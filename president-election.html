<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>总统选举 | Republic of Axie</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans SC",
    "Microsoft YaHei",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #07111c 0%,
      #0d1f30 50%,
      #102c42 100%
    );

  color: #f4f8fb;
  min-height: 100vh;
}

header {
  padding: 60px 20px 40px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 42px;
  font-weight: 700;
}

header p {
  margin-top: 12px;
  color: #a9c4d8;
  font-size: 16px;
}

.container {
  width: min(1000px, calc(100% - 32px));
  margin: 0 auto 60px;
}

.card {
  background: rgba(15, 35, 52, 0.88);
  border: 1px solid rgba(126, 203, 255, 0.16);
  border-radius: 18px;
  padding: 28px;
  margin-bottom: 22px;
  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
}

.election-info h2 {
  margin-top: 0;
  font-size: 25px;
}

.meta {
  color: #a9c4d8;
  line-height: 1.8;
}

.status {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
}

.status-title {
  font-size: 18px;
  font-weight: 700;
}

.countdown {
  margin-top: 10px;
  font-size: 28px;
  font-weight: 700;
  color: #ffd36a;
  letter-spacing: 1px;
}

.candidates-title {
  margin-top: 10px;
  margin-bottom: 20px;
  font-size: 25px;
}

.candidate-card {
  display: flex;
  gap: 22px;
  align-items: flex-start;

  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(126, 203, 255, 0.12);

  border-radius: 16px;
  padding: 22px;

  margin-bottom: 18px;

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    background 0.2s ease;
}

.candidate-card:hover {
  transform: translateY(-2px);
  border-color: rgba(126, 203, 255, 0.3);
  background: rgba(255, 255, 255, 0.055);
}

.candidate-photo {
  width: 110px;
  height: 110px;

  border-radius: 14px;

  object-fit: cover;

  background: #10283b;

  flex-shrink: 0;
}

.candidate-info {
  flex: 1;
}

.candidate-number {
  display: inline-block;

  padding: 5px 10px;

  border-radius: 8px;

  background: rgba(126, 203, 255, 0.12);

  color: #9edcff;

  font-size: 13px;

  margin-bottom: 8px;
}

.candidate-name {
  font-size: 23px;
  font-weight: 700;
  margin-bottom: 5px;
}

.candidate-en {
  color: #9fb8ca;
  font-size: 14px;
  margin-bottom: 4px;
}

.candidate-party {
  color: #c9e6f7;
  font-size: 15px;
  margin-bottom: 14px;
}

.candidate-introduction {
  color: #c5d4df;
  line-height: 1.7;
  font-size: 14px;
}

.detail-link {
  display: inline-block;

  margin-top: 18px;

  color: #9edcff;

  font-size: 14px;
  font-weight: 600;

  text-decoration: none;
}

.detail-link:hover {
  text-decoration: underline;
}

.empty {
  text-align: center;
  color: #91a8b8;
  padding: 30px;
}

footer {
  text-align: center;
  color: #70899b;
  font-size: 13px;
  padding: 30px 20px 50px;
}

@media (max-width: 700px) {

  header h1 {
    font-size: 32px;
  }

  .candidate-card {
    flex-direction: column;
  }

  .candidate-photo {
    width: 90px;
    height: 90px;
  }

  .countdown {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>总统选举</h1>
  <p>Republic of Axie · Presidential Election</p>
</header>

<main class="container">

  <!-- 选举基本信息 -->
  <section class="card election-info">

    <h2 id="election-name">
      正在读取选举信息……
    </h2>

    <div class="meta">

      <div id="election-period">
        选举期间：读取中……
      </div>

      <div id="inauguration-date">
        就任日期：读取中……
      </div>

    </div>

    <div class="status">

      <div
        id="status-title"
        class="status-title"
      >
        正在读取选举状态……
      </div>

      <div
        id="countdown"
        class="countdown"
      >
        --
      </div>

    </div>

  </section>


  <!-- 候选人 -->
  <section class="card">

    <h2 class="candidates-title">
      候选人
    </h2>

    <div id="candidate-list">

      <div class="empty">
        正在读取候选人信息……
      </div>

    </div>

  </section>

</main>


<footer>
  Republic of Axie · 阿谢国官方选举信息
</footer>


<script>

const ELECTION_ID = "president-axie4";

let electionData = null;


/* =========================
   HTML 安全转义
========================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   阿谢纪年日期格式化
========================= */

/*
  阿谢元年 = 公历 2024 年

  因此：
  阿谢年 = 公历年份 - 2023

  选举网站对外显示使用阿谢纪年，
  但内部仍然使用 ISO 时间进行状态判断和倒计时。
*/

function formatAxieDate(dateString) {

  if (!dateString) {
    return "未公布";
  }

  const date = new Date(dateString);

  if (Number.isNaN(date.getTime())) {
    return "日期错误";
  }

  /*
    使用东京时区（UTC+9）取得实际日期，
    与 elections.json 中的选举时间保持一致。
  */

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "numeric",
        day: "numeric"
      }
    ).formatToParts(date);


  let year = null;
  let month = null;
  let day = null;


  for (const part of parts) {

    if (part.type === "year") {
      year = Number(part.value);
    }

    if (part.type === "month") {
      month = Number(part.value);
    }

    if (part.type === "day") {
      day = Number(part.value);
    }

  }


  if (
    !year ||
    !month ||
    !day
  ) {
    return "日期错误";
  }


  const axieYear =
    year - 2023;


  return `阿谢${axieYear}年${month}月${day}日`;
}


/* =========================
   日期格式化
========================= */

/*
  保留这个函数用于其他需要完整日期时间
  的情况。

  选举页面主要显示阿谢纪年，
  所以选举期间和就任日期使用
  formatAxieDate()。
*/

function formatDate(dateString) {

  if (!dateString) {
    return "未公布";
  }

  const date = new Date(dateString);

  if (Number.isNaN(date.getTime())) {
    return "日期错误";
  }

  return new Intl.DateTimeFormat(
    "zh-CN",
    {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  ).format(date) + "（UTC+9）";
}


/* =========================
   文字换行
========================= */

function formatText(text) {

  if (!text) {
    return "";
  }

  return escapeHTML(text)
    .replace(/\n/g, "<br>");
}


/* =========================
   加载数据
========================= */

async function loadData() {

  try {

    const [
      electionsResponse,
      candidatesResponse
    ] = await Promise.all([

      fetch("./data/elections.json"),

      fetch("./data/candidates.json")

    ]);


    if (!electionsResponse.ok) {
      throw new Error("无法读取 elections.json");
    }

    if (!candidatesResponse.ok) {
      throw new Error("无法读取 candidates.json");
    }


    const elections =
      await electionsResponse.json();

    const candidates =
      await candidatesResponse.json();


    electionData =
      elections.president.elections.find(
        election =>
          election.electionId === ELECTION_ID
      );


    if (!electionData) {
      throw new Error(
        "找不到指定总统选举"
      );
    }


    /* =========================
       显示选举信息
    ========================= */

    document.getElementById(
      "election-name"
    ).textContent =
      electionData.name;


    /*
      使用阿谢纪年显示选举期间
    */

    document.getElementById(
      "election-period"
    ).textContent =
      `选举期间：${formatAxieDate(
        electionData.start
      )} ～ ${formatAxieDate(
        electionData.end
      )}（UTC+9）`;


    /*
      使用阿谢纪年显示总统就任日期
    */

    document.getElementById(
      "inauguration-date"
    ).textContent =
      `总统就任：${formatAxieDate(
        electionData.inauguration
      )}（UTC+9）`;


    /* =========================
       筛选候选人
    ========================= */

    const electionCandidates =
      candidates.candidates
        .filter(
          candidate =>
            candidate.electionId ===
            ELECTION_ID
        )
        .sort(
          (a, b) =>
            Number(a.candidateNo) -
            Number(b.candidateNo)
        );


    renderCandidates(
      electionCandidates
    );


    updateElectionStatus();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "election-name"
    ).textContent =
      "选举信息读取失败";

    document.getElementById(
      "candidate-list"
    ).innerHTML = `
      <div class="empty">
        无法读取选举数据。
      </div>
    `;
  }
}


/* =========================
   显示候选人
========================= */

function renderCandidates(candidates) {

  const container =
    document.getElementById(
      "candidate-list"
    );


  if (!candidates.length) {

    container.innerHTML = `
      <div class="empty">
        当前暂无已登记候选人。
      </div>
    `;

    return;
  }


  container.innerHTML =
    candidates.map(candidate => {

      const photo =
        candidate.photo ||
        "";


      const chineseName =
        candidate.names?.zh ||
        "未提供";

      const englishName =
        candidate.names?.en ||
        "";

      const party =
        candidate.partyName ||
        "独立候选人";


      return `

        <article class="candidate-card">

          <img
            class="candidate-photo"
            src="${escapeHTML(photo)}"
            alt="${escapeHTML(chineseName)}"
            onerror="
              this.onerror=null;
              this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="200"
                     height="200">
                  <rect width="100%" height="100%"
                        fill="#10283b"/>
                  <text x="50%"
                        y="50%"
                        dominant-baseline="middle"
                        text-anchor="middle"
                        fill="#8aa6ba"
                        font-size="20">
                    No Photo
                  </text>
                </svg>
              `)}';
            "
          >

          <div class="candidate-info">

            <div class="candidate-number">
              候选人编号 ${escapeHTML(
                candidate.candidateNo
              )}
            </div>

            <div class="candidate-name">
              ${escapeHTML(chineseName)}
            </div>

            ${
              englishName
              ? `
                <div class="candidate-en">
                  ${escapeHTML(
                    englishName
                  )}
                </div>
              `
              : ""
            }

            <div class="candidate-party">
              ${escapeHTML(party)}
            </div>

            <div class="candidate-introduction">
              ${
                formatText(
                  candidate.introduction ||
                  "暂无候选人简介。"
                )
              }
            </div>


            <!--
              点击后进入候选人详细资料页
            -->

            <a
              class="detail-link"
              href="candidate.html?id=${encodeURIComponent(
                candidate.candidateId
              )}"
            >
              查看完整候选人资料 →
            </a>

          </div>

        </article>

      `;

    }).join("");
}


/* =========================
   更新选举状态
========================= */

function updateElectionStatus() {

  if (!electionData) {
    return;
  }


  const now =
    new Date();


  const start =
    new Date(
      electionData.start
    );


  const end =
    new Date(
      electionData.end
    );


  const statusTitle =
    document.getElementById(
      "status-title"
    );


  const countdown =
    document.getElementById(
      "countdown"
    );


  if (now < start) {

    statusTitle.textContent =
      "选举尚未开始";

    countdown.textContent =
      formatCountdown(
        start - now
      );

    return;
  }


  if (
    now >= start &&
    now <= end
  ) {

    statusTitle.textContent =
      "选举进行中";

    countdown.textContent =
      "距离投票结束：" +
      formatCountdown(
        end - now
      );

    return;
  }


  statusTitle.textContent =
    "选举已结束";

  countdown.textContent =
    "本次选举投票已经结束。";
}


/* =========================
   倒计时
========================= */

function formatCountdown(milliseconds) {

  if (milliseconds <= 0) {
    return "00天 00小时 00分 00秒";
  }


  const totalSeconds =
    Math.floor(
      milliseconds / 1000
    );


  const days =
    Math.floor(
      totalSeconds / 86400
    );


  const hours =
    Math.floor(
      (totalSeconds % 86400) /
      3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) /
      60
    );


  const seconds =
    totalSeconds % 60;


  return [
    `${days}天`,
    `${String(hours).padStart(2, "0")}小时`,
    `${String(minutes).padStart(2, "0")}分`,
    `${String(seconds).padStart(2, "0")}秒`
  ].join(" ");
}


/* =========================
   启动
========================= */

loadData();


/*
  每秒更新一次状态和倒计时
*/

setInterval(
  updateElectionStatus,
  1000
);

</script>
