<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>阿谢国总统选举 | Republic of Axie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #071421 0%,
          #0b1f31 45%,
          #081722 100%
        );

      color: #f2f7fb;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(5, 18, 29, 0.92);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;

      padding: 16px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .logo span {
      opacity: 0.65;
      font-weight: 400;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      font-size: 14px;
      opacity: 0.8;
      transition: 0.2s;
    }

    nav a:hover {
      opacity: 1;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .hero {
      text-align: center;
      margin-bottom: 45px;
    }

    .hero h1 {
      margin: 0 0 12px;

      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.15;

      background: linear-gradient(
        90deg,
        #ffffff,
        #b8e2ff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero .english {
      font-size: 18px;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    .hero .japanese {
      font-size: 15px;
      opacity: 0.45;
    }

    .card {
      background:
        rgba(17, 42, 62, 0.72);

      border:
        1px solid rgba(126, 203, 255, 0.14);

      border-radius: 22px;

      padding: 30px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25);

      margin-bottom: 28px;
    }

    .election-card {
      background:
        linear-gradient(
          135deg,
          rgba(32, 74, 112, 0.65),
          rgba(19, 45, 70, 0.85)
        );

      border:
        1px solid rgba(126, 203, 255, 0.2);
    }

    .status {
      display: inline-block;

      padding: 7px 13px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.08);

      font-size: 13px;
      margin-bottom: 16px;
    }

    .status.active {
      background: rgba(85, 210, 145, 0.16);
      color: #8ff0ba;
    }

    .status.finished {
      background: rgba(255, 255, 255, 0.08);
      color: #b9c5ce;
    }

    .status.upcoming {
      color: #ffd36a;
    }

    .election-card h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      opacity: 0.65;
      margin-bottom: 22px;
    }

    .election-meta {
      opacity: 0.78;
      font-size: 14px;
      line-height: 1.8;
    }

    .countdown {
      font-size: clamp(24px, 5vw, 38px);

      font-weight: 700;

      margin: 24px 0;

      color: #ffd36a;

      letter-spacing: 1px;
    }

    .section-title {
      margin: 50px 0 20px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 30px;
    }

    .candidate-list {
      display: grid;
      gap: 22px;
    }

    .candidate-card {
      display: grid;

      grid-template-columns: 150px 1fr;

      gap: 28px;

      padding: 24px;

      border-radius: 20px;

      background:
        rgba(14, 34, 51, 0.78);

      border:
        1px solid rgba(255, 255, 255, 0.08);
    }

    .candidate-photo-wrapper {
      width: 150px;
      height: 180px;

      border-radius: 16px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #173750,
          #0d2235
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255, 255, 255, 0.45);

      text-align: center;

      font-size: 13px;
    }

    .candidate-photo {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .candidate-number {
      display: inline-block;

      font-size: 13px;

      padding: 5px 9px;

      border-radius: 8px;

      background: rgba(255, 255, 255, 0.08);

      margin-bottom: 10px;
    }

    .candidate-name {
      font-size: 27px;
      font-weight: 700;

      margin-bottom: 6px;
    }

    .candidate-en {
      opacity: 0.65;
      margin-bottom: 3px;
    }

    .candidate-jp {
      opacity: 0.45;
      margin-bottom: 14px;
    }

    .party {
      display: inline-block;

      padding: 6px 10px;

      border-radius: 8px;

      background:
        rgba(126, 203, 255, 0.1);

      color: #bde7ff;

      font-size: 14px;

      margin-bottom: 18px;
    }

    .candidate-introduction {
      line-height: 1.8;

      opacity: 0.85;

      margin-bottom: 18px;
    }

    .statement {
      line-height: 1.9;

      white-space: normal;

      color: rgba(255, 255, 255, 0.78);

      font-size: 14px;
    }

    .error {
      text-align: center;

      padding: 60px 20px;

      opacity: 0.7;
    }

    @media (max-width: 700px) {

      .nav {
        padding: 14px 16px;
      }

      nav {
        gap: 10px;
      }

      main {
        padding:
          45px 16px 80px;
      }

      .card {
        padding: 22px;
        border-radius: 18px;
      }

      .candidate-card {
        grid-template-columns: 1fr;
      }

      .candidate-photo-wrapper {
        width: 120px;
        height: 150px;
      }

      .candidate-name {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <a href="index.html" class="logo">
      Republic of Axie
      <span>阿谢国</span>
    </a>

    <nav>
      <a href="index.html">首页</a>
      <a href="constitution.html">宪法</a>
      <a href="AXNews.html">AXNews</a>
    </nav>

  </div>
</header>


<main>

  <section class="hero">

    <h1 id="election-name">
      阿谢国总统选举
    </h1>

    <div class="english" id="election-name-en">
      Presidential Election
    </div>

    <div class="japanese" id="election-name-jp">
      大統領選挙
    </div>

  </section>


  <section class="card election-card">

    <div
      id="election-status"
      class="status upcoming"
    >
      正在读取选举信息……
    </div>

    <h2 id="election-title">
      总统选举
    </h2>

    <div
      id="election-subtitle"
      class="subtitle"
    >
      Presidential Election
    </div>

    <div
      id="election-countdown"
      class="countdown"
    >
      —
    </div>

    <div
      id="election-meta"
      class="election-meta"
    >
      正在读取选举时间……
    </div>

  </section>


  <section class="section-title">

    <h2>
      总统候选人
    </h2>

  </section>


  <section
    id="candidate-list"
    class="candidate-list"
  >

    <div class="error">
      正在读取候选人资料……
    </div>

  </section>

</main>


<script>

  const ELECTION_ID = "president-axie4";

  let electionData = null;

  let countdownTimer = null;


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatStatement(value) {

    return escapeHTML(value)
      .replace(/\n/g, "<br>");

  }


  function formatDate(date) {

    const options = {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    };

    return new Intl.DateTimeFormat(
      "zh-CN",
      options
    ).format(date);

  }


  function getElectionStatus() {

    if (!electionData) {
      return "loading";
    }

    const now = new Date();

    const start = new Date(
      electionData.start
    );

    const end = new Date(
      electionData.end
    );

    if (now < start) {
      return "upcoming";
    }

    if (now <= end) {
      return "active";
    }

    return "finished";

  }


  function updateElectionStatus() {

    if (!electionData) {
      return;
    }

    const now = new Date();

    const start = new Date(
      electionData.start
    );

    const end = new Date(
      electionData.end
    );

    const statusElement =
      document.getElementById(
        "election-status"
      );

    const countdownElement =
      document.getElementById(
        "election-countdown"
      );


    if (now < start) {

      statusElement.textContent =
        "选举尚未开始";

      statusElement.className =
        "status upcoming";


      updateCountdown(
        start,
        "距离选举开始"
      );

      return;

    }


    if (now <= end) {

      statusElement.textContent =
        "选举进行中";

      statusElement.className =
        "status active";


      updateCountdown(
        end,
        "距离选举结束"
      );

      return;

    }


    statusElement.textContent =
      "选举已结束";

    statusElement.className =
      "status finished";

    countdownElement.textContent =
      "投票阶段已结束";

  }


  function updateCountdown(
    target,
    prefix
  ) {

    if (countdownTimer) {
      clearInterval(countdownTimer);
    }


    function render() {

      const now = new Date();

      let diff =
        target.getTime() -
        now.getTime();


      if (diff < 0) {
        diff = 0;
      }


      const totalSeconds =
        Math.floor(diff / 1000);


      const days =
        Math.floor(
          totalSeconds / 86400
        );

      const hours =
        Math.floor(
          (totalSeconds % 86400) / 3600
        );

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;


      document.getElementById(
        "election-countdown"
      ).textContent =
        `${prefix} ${days}天 ${hours}小时 ${minutes}分 ${seconds}秒`;

    }


    render();

    countdownTimer =
      setInterval(render, 1000);

  }


  function renderElection() {

    if (!electionData) {
      return;
    }


    document.getElementById(
      "election-name"
    ).textContent =
      electionData.name;


    document.getElementById(
      "election-name-en"
    ).textContent =
      electionData.nameEn;


    document.getElementById(
      "election-name-jp"
    ).textContent =
      electionData.nameJp;


    document.getElementById(
      "election-title"
    ).textContent =
      electionData.name;


    document.getElementById(
      "election-subtitle"
    ).textContent =
      electionData.nameEn;


    const start =
      new Date(electionData.start);

    const end =
      new Date(electionData.end);


    document.getElementById(
      "election-meta"
    ).innerHTML =

      `阿谢纪年：阿谢${electionData.axieYear}年<br>` +

      `选举时间：${formatDate(start)} — ${formatDate(end)}（UTC+9）<br>` +

      `总统就任：${formatDate(new Date(electionData.inauguration))}（UTC+9）`;


    updateElectionStatus();

  }


  function renderCandidates(
    candidates
  ) {

    const container =
      document.getElementById(
        "candidate-list"
      );


    if (!candidates.length) {

      container.innerHTML =
        `<div class="error">
          当前暂无总统候选人资料。
        </div>`;

      return;

    }


    candidates.sort(
      (a, b) =>
        Number(a.candidateNo) -
        Number(b.candidateNo)
    );


    container.innerHTML =
      candidates.map(
        candidate => {

          const photo =
            candidate.photo
              ? `
                <img
                  class="candidate-photo"
                  src="${escapeHTML(candidate.photo)}"
                  alt="${escapeHTML(candidate.names.zh)}"
                  onerror="this.style.display='none'; this.parentElement.innerHTML='<span>暂无候选人照片</span>';"
                >
              `
              :
              `<span>暂无候选人照片</span>`;


          return `

            <article class="candidate-card">

              <div class="candidate-photo-wrapper">
                ${photo}
              </div>


              <div>

                <div class="candidate-number">
                  候选人 ${escapeHTML(candidate.candidateNo)}
                </div>


                <div class="candidate-name">
                  ${escapeHTML(candidate.names.zh)}
                </div>


                <div class="candidate-en">
                  ${escapeHTML(candidate.names.en)}
                </div>


                <div class="candidate-jp">
                  ${escapeHTML(candidate.names.ja)}
                </div>


                <div class="party">
                  ${escapeHTML(candidate.partyName)}
                </div>


                <div class="candidate-introduction">
                  ${escapeHTML(candidate.introduction)}
                </div>


                <div class="statement">
                  ${formatStatement(candidate.campaignStatement)}
                </div>

              </div>

            </article>

          `;

        }
      ).join("");

  }


  async function loadElection() {

    try {

      const electionResponse =
        await fetch(
          "./data/elections.json"
        );


      if (!electionResponse.ok) {
        throw new Error(
          "无法读取 elections.json"
        );
      }


      const elections =
        await electionResponse.json();


      electionData =
        elections.president.elections.find(
          item =>
            item.electionId ===
            ELECTION_ID
        );


      if (!electionData) {
        throw new Error(
          "找不到指定的总统选举"
        );
      }


      renderElection();


      const candidatesResponse =
        await fetch(
          "./data/candidates.json"
        );


      if (!candidatesResponse.ok) {
        throw new Error(
          "无法读取 candidates.json"
        );
      }


      const candidateData =
        await candidatesResponse.json();


      const candidates =
        candidateData.candidates.filter(
          candidate =>
            candidate.electionId ===
            ELECTION_ID
        );


      renderCandidates(
        candidates
      );


      setInterval(
        updateElectionStatus,
        1000
      );

    }

    catch (error) {

      console.error(error);


      document.getElementById(
        "election-status"
      ).textContent =
        "选举信息读取失败";


      document.getElementById(
        "election-countdown"
      ).textContent =
        "请稍后再试";


      document.getElementById(
        "candidate-list"
      ).innerHTML =
        `<div class="error">
          无法读取选举资料，请检查网站数据文件。
        </div>`;

    }

  }


  loadElection();

</script>

</body>
</html>
