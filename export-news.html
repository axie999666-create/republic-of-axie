<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXNews 新闻导出工具</title>

</head>

<body>

<h1>AXNews 新闻导出工具</h1>

<p id="status">正在连接 Firebase……</p>

<button id="exportButton" disabled>
    导出 news.json
</button>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCse_UzZJT35j0Uot17BMlXEE-bhM7yOzs",

    authDomain: "axnews.firebaseapp.com",

    projectId: "axnews",

    storageBucket: "axnews.firebasestorage.app",

    messagingSenderId: "83261533390",

    appId: "1:83261533390:web:bf41a618b7ad0d8b4c749f",

    measurementId: "G-DHT9351SM6"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const status =
    document.getElementById("status");

const exportButton =
    document.getElementById("exportButton");


let newsData = [];


async function loadNews() {

    try {

        status.textContent =
            "正在读取 Firebase 新闻……";


        const snapshot =
            await getDocs(
                collection(db, "news")
            );


        newsData = [];


        snapshot.forEach(doc => {

            const news = doc.data();


            let timestamp = 0;


            // Firebase Timestamp
            if (
                news.timestamp &&
                typeof news.timestamp.toMillis === "function"
            ) {

                timestamp =
                    news.timestamp.toMillis();

            }


            newsData.push({

                title: news.title || "",

                date: news.date || "",

                author: news.author || "",

                content: news.content || "",

                image1: news.image1 || "",

                image2: news.image2 || "",

                image3: news.image3 || "",

                timestamp: timestamp

            });

        });


        // 从新到旧排序

        newsData.sort(
            (a, b) =>
                b.timestamp - a.timestamp
        );


        status.textContent =
            `成功读取 ${newsData.length} 条新闻，可以导出。`;

        exportButton.disabled = false;

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "❌ 读取 Firebase 失败：" +
            error.message;

    }

}


exportButton.addEventListener(
    "click",
    () => {

        const json =
            JSON.stringify(
                newsData,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                    "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;

        a.download = "news.json";

        a.click();


        URL.revokeObjectURL(url);


        status.textContent =
            `✅ 已导出 ${newsData.length} 条新闻！`;

    }
);


loadNews();

</script>

</body>
</html>
