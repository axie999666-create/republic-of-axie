<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXNews 新闻中心 | Republic of Axie</title>

<style>
body{
    margin:0;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:#102a44;
    color:white;
}

header{
    background:#081522;
    text-align:center;
    padding:30px;
}

header h1{
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px;
}

.card{
    background:rgba(255,255,255,.05);
    padding:25px;
    margin-bottom:30px;
    border-radius:15px;
}

.card img{
    width:100%;
    max-width:700px;
    border-radius:10px;
    margin:15px 0;
}

#searchBox{
    width:100%;
    padding:12px;
    margin-bottom:25px;
    border:none;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#2b567f;
    color:white;
    text-decoration:none;
    border-radius:20px;
    transition:.2s;
}

.back:hover{
    background:#3a75b3;
    transform:scale(1.05);
}
</style>

</head>

<body>

<header>
    <h1>📰 AXNews 新闻中心</h1>
    <p>Republic of Axie Official News</p>
</header>

<div class="container">

    <input
        type="text"
        id="searchBox"
        placeholder="🔍 搜索新闻..."
    >

    <div id="newsList">
        正在加载新闻……
    </div>

    <a class="back" href="index.html">← 返回首页</a>

</div>


<script>

async function loadNews() {

    const newsList = document.getElementById("newsList");

    try {

        // 从 GitHub Pages 同目录读取 news.json
        const response = await fetch("./news.json");

        if (!response.ok) {
            throw new Error(
                "无法读取 news.json，HTTP状态码：" + response.status
            );
        }

        const newsData = await response.json();

        // 清空“正在加载新闻……”
        newsList.innerHTML = "";

        let found = 0;

        const keyword = document
            .getElementById("searchBox")
            .value
            .trim()
            .toLowerCase();

        // 按 timestamp 从新到旧排序
        newsData.sort((a, b) => {
            return Number(b.timestamp || 0) - Number(a.timestamp || 0);
        });

        newsData.forEach(news => {

            // 搜索功能
            const title = String(news.title || "");
            const content = String(news.content || "");

            if (
                keyword &&
                !title.toLowerCase().includes(keyword) &&
                !content.toLowerCase().includes(keyword)
            ) {
                return;
            }

            found++;

            let html = `
                <div class="card">

                    <h2>${title}</h2>

                    <small>
                        ${news.date || ""} | ${news.author || ""}
                    </small>
            `;


            // 第一张图片
            if (news.image1) {
                html += `
                    <img src="./${news.image1}" alt="">
                `;
            }


            // 第二张图片
            if (news.image2) {
                html += `
                    <img src="./${news.image2}" alt="">
                `;
            }


            // 第三张图片
            if (news.image3) {
                html += `
                    <img src="./${news.image3}" alt="">
                `;
            }


            // 新闻正文
            html += `
                    <p>${content}</p>

                </div>
            `;

            newsList.innerHTML += html;

        });


        // 没有搜索结果
        if (found === 0) {

            newsList.innerHTML = `
                <div class="card">

                    <h2>🔍 没有找到相关新闻</h2>

                    <p>请尝试其他关键词。</p>

                </div>
            `;

        }

    }

    catch (err) {

        console.error(err);

        newsList.innerHTML = `
            <div class="card">

                <h2>❌ 新闻加载失败</h2>

                <p>
                    AXNews 暂时无法读取新闻数据。
                </p>

                <pre style="
                    color:red;
                    white-space:pre-wrap;
                    overflow:auto;
                ">${err.stack || err.message}</pre>

            </div>
        `;

    }

}


// 页面加载完成
document.addEventListener("DOMContentLoaded", () => {

    loadNews();

    // 搜索框实时搜索
    document
        .getElementById("searchBox")
        .addEventListener("input", loadNews);

});

</script>

</body>
</html>
