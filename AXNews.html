<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXNews 新闻中心 | Republic of Axie</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:#102a44;
    color:white;
    line-height:1.7;
}

/* 顶部 */

header{
    background:#081522;
    text-align:center;
    padding:35px 20px;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    opacity:.8;
}

/* 主容器 */

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 20px 50px;
}

/* 搜索区域 */

.search-area{
    margin-bottom:25px;
}

#searchBox{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
    background:white;
    color:#222;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.news-info{
    margin-top:10px;
    font-size:14px;
    opacity:.75;
}

.agency-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.agency-filters a{padding:7px 13px;border-radius:18px;background:rgba(255,255,255,.08);color:#d9e9fa;text-decoration:none;font-size:14px}
.agency-filters a.active,.agency-filters a:hover{background:#3478db;color:#fff}
.agency-tag{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:14px;background:rgba(93,155,224,.2);color:#bcdcff;font-size:13px}

/* 新闻卡片 */

.card{
    background:rgba(255,255,255,.06);
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.08);
}

.card h2{
    margin:0 0 6px;
    line-height:1.4;
    font-size:23px;
}

.card small{
    opacity:.7;
}

.card p{
    margin:18px 0 0;
    white-space:pre-wrap;
    word-break:break-word;
}

/* 图片 */

.card img{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
    border-radius:10px;
    margin:18px auto 0;
}

/* 按钮区域 */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.button{
    display:inline-block;
    padding:11px 20px;
    border-radius:22px;
    text-decoration:none;
    color:white;
    background:#2b567f;
    transition:.2s;
}

.button:hover{
    background:#3a75b3;
    transform:translateY(-1px);
}

.admin-button{
    background:#365f88;
}

.admin-button:hover{
    background:#477cab;
}

/* 加载 / 错误 */

.message{
    text-align:center;
    padding:35px 20px;
    background:rgba(255,255,255,.05);
    border-radius:15px;
    opacity:.85;
}

.error{
    border:1px solid rgba(255,80,80,.3);
}

.error pre{
    color:#ffaaaa;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
}

/* 手机 */

@media(max-width:600px){

    header h1{
        font-size:26px;
    }

    .container{
        padding:20px 15px 40px;
    }

    .card{
        padding:20px;
    }

    .card h2{
        font-size:20px;
    }

    .actions{
        flex-direction:column;
    }

    .button{
        text-align:center;
    }

}


a:focus-visible, button:focus-visible, #searchBox:focus-visible { outline: 3px solid #82d2ff; outline-offset: 4px; }
.card h2, .card small { overflow-wrap: anywhere; }
.agency-filters a { min-height: 44px; display: inline-flex; align-items: center; }
@media (max-width:600px) {
    header { padding: 28px 16px; }
    header h1 { font-size: 25px; line-height: 1.45; }
    header p { font-size: 13px; }
    .container { padding: 24px 16px 40px; }
    .card { padding: 20px 18px; margin-bottom: 18px; }
    .card h2 { line-height: 1.55; }
    .card p { line-height: 1.85; }
    .agency-filters { flex-wrap: nowrap; overflow-x: auto; padding: 4px 3px 10px; overscroll-behavior-x: contain; }
    .agency-filters a { flex-shrink: 0; white-space: nowrap; }
    .card:hover { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
    .card, .button { transition: none; }
    .card:hover, .button:hover { transform: none; }
}

.language-switch{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:18px}
.language-switch button{min-height:42px;padding:8px 17px;border:1px solid rgba(164,198,234,.38);border-radius:22px;background:rgba(255,255,255,.07);color:#dceaff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.language-switch button:hover{background:rgba(72,139,210,.28);transform:translateY(-1px)}
.language-switch button[aria-pressed="true"]{background:#3478db;border-color:#82b4f0;color:#fff;box-shadow:0 3px 12px rgba(20,84,160,.28)}
.language-switch button:focus-visible{outline:3px solid #82d2ff;outline-offset:3px}
.translation-note{color:#c2d9f4;font-size:13px;line-height:1.55;margin:14px 0 -8px;padding:9px 12px;border-left:3px solid #79aee8;background:rgba(61,116,174,.13);border-radius:0 8px 8px 0}
.translation-tag{display:inline-flex;align-items:center;margin:9px 0 0 8px;padding:3px 9px;border:1px solid rgba(145,195,246,.24);border-radius:14px;color:#c9e2ff;background:rgba(64,130,194,.16);font-size:12px}
.modified-tag{display:inline-flex;align-items:center;margin:9px 0 0 8px;padding:3px 9px;border:1px solid rgba(255,196,102,.28);border-radius:14px;color:#ffd28c;background:rgba(224,153,52,.12);font-size:12px}
.language-switch button,.agency-filters a{touch-action:manipulation}
@media(max-width:600px){.language-switch{gap:8px}.language-switch button{flex:1 1 84px;padding:8px 12px}.translation-tag,.modified-tag{margin-left:0;margin-top:8px}}

/* Shared dark technology UI from the original Republic of Axie design. */
:root{color-scheme:dark;--ax-blue:#4fc3ff;--ax-mint:#7cf5d2;--ax-text:#e6ecff;--ax-muted:#a8b4d7}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(79,195,255,.14),transparent 42%),linear-gradient(180deg,#050814,#0b1020 55%,#0b1428);color:var(--ax-text)}
header{position:relative;background:radial-gradient(ellipse at 50% 10%,rgba(79,195,255,.16),transparent 68%);border-bottom:1px solid rgba(79,195,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.2)}
header h1{color:#f0f5ff;text-shadow:0 0 28px rgba(79,195,255,.3);letter-spacing:.06em}
header p{color:var(--ax-muted)}
.container{max-width:1100px}
.card,.section,.version,.message{background:linear-gradient(145deg,rgba(17,24,54,.92),rgba(12,20,42,.88));border:1px solid rgba(79,195,255,.16);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.card:hover{border-color:rgba(79,195,255,.32)}
h2,h3{color:var(--ax-blue)}
.button,.actions .button{border:1px solid rgba(79,195,255,.25);background:#111836;color:#e6ecff}
.button:hover,.actions .button:hover{background:#163b5c;color:var(--ax-mint)}
input,select,textarea{border:1px solid rgba(79,195,255,.22)!important;background:#0d1630!important;color:var(--ax-text)!important}
footer{color:var(--ax-muted);border-top:1px solid rgba(79,195,255,.16)}
@media(prefers-reduced-motion:no-preference){.section,.card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}.section:hover,.card:hover{transform:translateY(-2px);box-shadow:0 22px 54px rgba(0,0,0,.28),0 0 28px rgba(79,195,255,.05)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

</style>

</head>

<body>

<header>

    <h1>📰 AXNews 新闻中心</h1>

    <p id="newsSubtitle">阿谢国官方新闻</p>
    <nav class="language-switch" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
    </nav>

</header>


<div class="container">

    <!-- 搜索 -->

    <div class="search-area">

        <input
            type="text"
            id="searchBox"
            aria-label="搜索新闻标题或正文"
            placeholder="🔍 搜索新闻标题或正文..."
            autocomplete="off"
        >

        <div
            id="newsInfo"
            class="news-info"
        >
            正在加载新闻……
        </div>

        <nav id="agencyFilters" class="agency-filters" aria-label="按发布机构筛选"></nav>

    </div>


    <!-- 新闻列表 -->

    <div id="newsList">

        <div class="message">
            📰 正在加载新闻……
        </div>

    </div>


    <!-- 页面按钮 -->

    <div class="actions">

        <a
            class="button"
            href="index.html"
        >
            ← 返回首页
        </a>

      
    </div>

</div>


<script src="api-client.js?v=20261005"></script>
<script>
const TEXT = {
  zh: {
    heading: "📰 AXNews 新闻中心", subtitle: "阿谢国官方新闻", search: "🔍 搜索新闻标题或正文…",
    all: "全部公告", other: "其他机构", ordinary: "普通新闻", unknown: "未知机构",
    count: n => `共 ${n} 条新闻`, found: n => `找到 ${n} 条相关新闻`,
    empty: "🔍 没有找到相关新闻", tryAgain: "请尝试其他关键词。", home: "← 返回首页",
    untitled: "无标题", loading: "正在加载新闻……", error: "新闻加载失败",
    errorBody: "AXNews 暂时无法读取新闻数据。", missing: "译文尚未生成，显示中文原文。",
    machine: "AI 自动翻译", modified: "有修改", fictional: "阿谢国为架空世界观创作项目"
  },
  en: {
    heading: "📰 AXNews News Center", subtitle: "republic of axie Official News", search: "🔍 Search news titles or articles…",
    all: "All announcements", other: "Other agencies", ordinary: "General news", unknown: "Unknown agency",
    count: n => `${n} news articles`, found: n => `${n} matching articles`,
    empty: "🔍 No matching news", tryAgain: "Try another keyword.", home: "← Home",
    untitled: "Untitled", loading: "Loading news…", error: "Unable to load news",
    errorBody: "AXNews cannot load news data at the moment.", missing: "Translation unavailable. Chinese original shown.",
    machine: "AI translation", modified: "Edited", fictional: "republic of axie is a fictional nation project"
  },
  ja: {
    heading: "📰 AXNews ニュースセンター", subtitle: "阿謝国公式ニュース", search: "🔍 ニュースの見出し・本文を検索…",
    all: "すべてのお知らせ", other: "その他の機関", ordinary: "一般ニュース", unknown: "不明な機関",
    count: n => `ニュース ${n} 件`, found: n => `検索結果 ${n} 件`,
    empty: "🔍 関連ニュースが見つかりません", tryAgain: "別のキーワードをお試しください。", home: "← ホームに戻る",
    untitled: "無題", loading: "ニュースを読み込み中…", error: "ニュースを読み込めません",
    errorBody: "現在、AXNews のニュースデータを読み込めません。", missing: "翻訳はまだありません。中国語の原文を表示しています。",
    machine: "AI 自動翻訳", modified: "更新済み", fictional: "阿謝国は架空の国家創作プロジェクトです"
  }
};
const AGENCY_TEXT = {
  president: {en: "Presidential Affairs Department", ja: "大統領業務部"},
  "vice-president": {en: "Vice President’s Office", ja: "副大統領室"},
  government: {en: "Government of the republic of axie", ja: "阿謝国政府"},
  congress: {en: "Congress of the republic of axie", ja: "阿謝国国会議事堂"},
  "constitutional-court": {en: "Constitutional Court of the republic of axie", ja: "阿謝国立憲院"}
};
let language = new URLSearchParams(location.search).get("lang") || "zh";
try { language = new URLSearchParams(location.search).get("lang") || localStorage.getItem("axnews-language") || "zh"; } catch {}
if (!TEXT[language]) language = "zh";
let allNews = [];
let loaded = false;
let loadError = null;
const fallbackAgencies = Array.isArray(window.AXNEWS_FALLBACK_AGENCIES) ? window.AXNEWS_FALLBACK_AGENCIES : [];
let agencies = fallbackAgencies.slice();
const API_BASE = window.AXNEWS_API_BASE || "https://axnews-admin-api.axie999666.workers.dev";
const selectedAgencyId = new URLSearchParams(location.search).get("agency") || "";

function countryName(value) {
  if (language === "zh") return String(value || "");
  const names = /阿[谢謝]国|republic of axie|アシーカ国|アーシー国/gi;
  return String(value || "").replace(names, language === "en" ? "republic of axie" : "阿謝国");
}
function articleText(news) {
  const translated = language === "zh" ? null : news.translations?.[language];
  const ready = translated && typeof translated.title === "string" && translated.title.trim() && typeof translated.content === "string" && translated.content.trim();
  return ready
    ? {title: countryName(translated.title), content: countryName(translated.content), translated: true}
    : {title: news.title || TEXT[language].untitled, content: news.content || "", translated: false};
}
function agencyName(id) {
  const agency = agencies.find(item => item.id === id);
  if (!agency) return id ? TEXT[language].other : TEXT[language].ordinary;
  return language === "zh" ? agency.name : (AGENCY_TEXT[id]?.[language] || countryName(agency.name));
}
function setLanguage(next, updateUrl = true) {
  if (!TEXT[next]) return;
  language = next;
  try { localStorage.setItem("axnews-language", language); } catch {}
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set("lang", language);
    history.replaceState(null, "", url);
  }
  applyLanguage();
}
function applyLanguage() {
  const t = TEXT[language];
  document.documentElement.lang = language;
  document.title = `${t.heading.replace("📰 ", "")} | ${language === "ja" ? "阿謝国" : "republic of axie"}`;
  document.querySelector("header h1").textContent = t.heading;
  document.getElementById("newsSubtitle").textContent = t.subtitle;
  const search = document.getElementById("searchBox");
  search.placeholder = t.search;
  search.setAttribute("aria-label", t.search);
  document.getElementById("agencyFilters").setAttribute("aria-label", t.all);
  document.querySelector(".actions a").textContent = t.home;
  const note = document.querySelector(".footer-note");
  if (note) { note.textContent = t.fictional; note.setAttribute("aria-label", t.fictional); }
  document.querySelectorAll("[data-lang]").forEach(button => {
    const active = button.dataset.lang === language;
    button.setAttribute("aria-pressed", String(active));
  });
  if (loadError) renderError(loadError);
  else if (loaded) renderNews();
  else {
    document.getElementById("newsInfo").textContent = t.loading;
    const message = document.querySelector("#newsList .message");
    if (message) message.textContent = `📰 ${t.loading}`;
  }
}
async function loadAgencies() {
  try {
    const response = await axieApiFetch(API_BASE + "/agencies");
    if (!response.ok) throw new Error("分类列表加载失败");
    const result = await response.json();
    agencies = Array.isArray(result.agencies) ? result.agencies : fallbackAgencies.slice();
  } catch (error) {
    console.warn("AXNews 机构分类暂不可用", error);
    agencies = fallbackAgencies.slice();
  }
}
function renderAgencyFilters() {
  const nav = document.getElementById("agencyFilters");
  nav.replaceChildren();
  const links = [{id: "", name: TEXT[language].all, href: "AXNews.html"}, ...agencies.map(item => ({
    id: item.id, name: agencyName(item.id), href: "AXNews.html?agency=" + encodeURIComponent(item.id)
  }))];
  links.forEach(item => {
    const link = document.createElement("a");
    const url = new URL(item.href, location.href);
    url.searchParams.set("lang", language);
    link.href = url.href;
    link.textContent = item.name;
    if (item.id === selectedAgencyId) link.classList.add("active");
    nav.appendChild(link);
  });
}
async function loadNews() {
  try {
    const response = await fetch("./news.json?ts=" + Date.now());
    if (!response.ok) throw new Error("无法读取 news.json，HTTP 状态码：" + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("news.json 格式错误：不是新闻数组");
    allNews = data;
    loaded = true;
    await loadAgencies();
    renderNews();
  } catch (error) {
    console.error(error);
    loadError = error;
    renderError(error);
  }
}
function renderError(error) {
  const t = TEXT[language];
  document.getElementById("newsInfo").textContent = t.error;
  document.getElementById("newsList").innerHTML = `<div class="message error"><h2>${t.error}</h2><p>${t.errorBody}</p><pre>${escapeHTML(error.stack || error.message)}</pre></div>`;
}
function renderNews() {
  const newsList = document.getElementById("newsList");
  const newsInfo = document.getElementById("newsInfo");
  const keyword = document.getElementById("searchBox").value.trim().toLocaleLowerCase(language);
  renderAgencyFilters();
  const sortedNews = [...allNews].sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
  const selectedNews = selectedAgencyId ? sortedNews.filter(news => news.agencyId === selectedAgencyId) : sortedNews;
  const filteredNews = selectedNews.filter(news => {
    if (!keyword) return true;
    const shown = articleText(news);
    const terms = [shown.title, shown.content, news.title, news.content].map(value => String(value || "").toLocaleLowerCase(language));
    return terms.some(value => value.includes(keyword));
  });
  const selectedAgency = agencies.find(item => item.id === selectedAgencyId);
  const scopeLabel = selectedAgency ? agencyName(selectedAgencyId) + " · " : (selectedAgencyId ? TEXT[language].unknown + " · " : "");
  newsInfo.textContent = scopeLabel + (keyword ? TEXT[language].found(filteredNews.length) : TEXT[language].count(filteredNews.length));
  if (!filteredNews.length) {
    newsList.innerHTML = `<div class="message"><h2>${TEXT[language].empty}</h2><p>${TEXT[language].tryAgain}</p></div>`;
    return;
  }
  newsList.replaceChildren();
  filteredNews.forEach(news => {
    const shown = articleText(news);
    const card = document.createElement("article");
    card.className = "card";
    const title = document.createElement("h2");
    title.textContent = shown.title;
    card.appendChild(title);
    const meta = document.createElement("small");
    meta.textContent = `${news.date || ""} | ${news.author || "AXNews"}`;
    card.appendChild(meta);
    if (news.updatedAt) {
      const modifiedTag = document.createElement("span");
      modifiedTag.className = "modified-tag";
      modifiedTag.textContent = TEXT[language].modified;
      card.appendChild(modifiedTag);
    }
    const agencyTag = document.createElement("span");
    agencyTag.className = "agency-tag";
    agencyTag.textContent = agencyName(news.agencyId);
    card.appendChild(agencyTag);
    if (shown.translated) {
      const translationTag = document.createElement("span");
      translationTag.className = "translation-tag";
      translationTag.textContent = TEXT[language].machine;
      card.appendChild(translationTag);
    } else if (language !== "zh") {
      const note = document.createElement("p");
      note.className = "translation-note";
      note.textContent = TEXT[language].missing;
      card.appendChild(note);
    }
    ["image1", "image2", "image3"].forEach(key => {
      if (!news[key]) return;
      const img = document.createElement("img");
      img.src = "./" + news[key];
      img.alt = shown.title || TEXT[language].untitled;
      img.loading = "lazy";
      img.onerror = () => { img.style.display = "none"; };
      card.appendChild(img);
    });
    const content = document.createElement("p");
    content.textContent = shown.content;
    card.appendChild(content);
    newsList.appendChild(card);
  });
}
function escapeHTML(text) {
  return String(text).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
document.getElementById("searchBox").addEventListener("input", renderNews);
document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => setLanguage(button.dataset.lang)));
document.addEventListener("DOMContentLoaded", () => { applyLanguage(); loadNews(); });

</script>
