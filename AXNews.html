<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXNews 新闻中心 | Republic of Axie</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:#102a44;
    color:white;
    line-height:1.7;
}

/* 顶部 */

header{
    background:#081522;
    text-align:center;
    padding:35px 20px;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    opacity:.8;
}

/* 主容器 */

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 20px 50px;
}

/* 搜索区域 */

.search-area{
    margin-bottom:25px;
}

#searchBox{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
    background:white;
    color:#222;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.news-info{
    margin-top:10px;
    font-size:14px;
    opacity:.75;
}

.agency-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.agency-filters a{padding:7px 13px;border-radius:18px;background:rgba(255,255,255,.08);color:#d9e9fa;text-decoration:none;font-size:14px}
.agency-filters a.active,.agency-filters a:hover{background:#3478db;color:#fff}
.agency-tag{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:14px;background:rgba(93,155,224,.2);color:#bcdcff;font-size:13px}

/* 新闻卡片 */

.card{
    background:rgba(255,255,255,.06);
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.08);
}

.card h2{
    margin:0 0 6px;
    line-height:1.4;
    font-size:23px;
}

.card small{
    opacity:.7;
}

.card p{
    margin:18px 0 0;
    white-space:pre-wrap;
    word-break:break-word;
}

/* 图片 */

.card img{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
    border-radius:10px;
    margin:18px auto 0;
}

/* 按钮区域 */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.button{
    display:inline-block;
    padding:11px 20px;
    border-radius:22px;
    text-decoration:none;
    color:white;
    background:#2b567f;
    transition:.2s;
}

.button:hover{
    background:#3a75b3;
    transform:translateY(-1px);
}

.admin-button{
    background:#365f88;
}

.admin-button:hover{
    background:#477cab;
}

/* 加载 / 错误 */

.message{
    text-align:center;
    padding:35px 20px;
    background:rgba(255,255,255,.05);
    border-radius:15px;
    opacity:.85;
}

.error{
    border:1px solid rgba(255,80,80,.3);
}

.error pre{
    color:#ffaaaa;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
}

/* 手机 */

@media(max-width:600px){

    header h1{
        font-size:26px;
    }

    .container{
        padding:20px 15px 40px;
    }

    .card{
        padding:20px;
    }

    .card h2{
        font-size:20px;
    }

    .actions{
        flex-direction:column;
    }

    .button{
        text-align:center;
    }

}

.language-switch{display:flex;justify-content:center;gap:8px;margin-top:18px}.language-switch button{border:1px solid #52779a;border-radius:18px;background:#2b567f;color:white;padding:8px 16px;cursor:pointer}.language-switch button[aria-pressed="true"]{background:#3478db;border-color:#87b5f8}.translation-note{font-size:13px;color:#bcdcff}
</style>

</head>

<body>

<header>

    <h1>📰 AXNews 新闻中心</h1>

    <p id="newsSubtitle">Republic of Axie Official News</p>
    <nav class="language-switch" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
    </nav>

</header>


<div class="container">

    <!-- 搜索 -->

    <div class="search-area">

        <input
            type="text"
            id="searchBox"
            placeholder="🔍 搜索新闻标题或正文..."
            autocomplete="off"
        >

        <div
            id="newsInfo"
            class="news-info"
        >
            正在加载新闻……
        </div>

        <nav id="agencyFilters" class="agency-filters" aria-label="按发布机构筛选"></nav>

    </div>


    <!-- 新闻列表 -->

    <div id="newsList">

        <div class="message">
            📰 正在加载新闻……
        </div>

    </div>


    <!-- 页面按钮 -->

    <div class="actions">

        <a
            class="button"
            href="index.html"
        >
            ← 返回首页
        </a>

      
    </div>

</div>


<script>

const TEXT = {
 zh: {heading:"📰 AXNews 新闻中心", subtitle:"阿谢国官方新闻",search:"🔍 搜索新闻标题或正文...",all:"全部公告",other:"其他机构",ordinary:"普通新闻",unknown:"未知机构",count:n=>`共 ${n} 条新闻`,found:n=>`找到 ${n} 条相关新闻`,empty:"🔍 没有找到相关新闻",tryAgain:"请尝试其他关键词。",home:"← 返回首页",untitled:"无标题",loading:"正在加载新闻……",error:"新闻加载失败",errorBody:"AXNews 暂时无法读取新闻数据。",missing:"译文尚未生成，显示中文原文。",machine:"AI 自动翻译",footer:"阿谢国为架空世界观创作项目"},
 en: {heading:"📰 AXNews News Center",subtitle:"republic of axie Official News",search:"🔍 Search news titles or articles...",all:"All announcements",other:"Other agencies",ordinary:"General news",unknown:"Unknown agency",count:n=>`${n} news articles`,found:n=>`${n} matching articles`,empty:"🔍 No matching news",tryAgain:"Try another keyword.",home:"← Home",untitled:"Untitled",loading:"Loading news…",error:"Unable to load news",errorBody:"AXNews cannot load news data at the moment.",missing:"Translation unavailable. Chinese original shown.",machine:"AI translation",footer:"republic of axie is a fictional nation project"},
 ja: {heading:"📰 AXNews ニュースセンター",subtitle:"阿謝国公式ニュース",search:"🔍 ニュースの見出し・本文を検索...",all:"すべてのお知らせ",other:"その他の機関",ordinary:"一般ニュース",unknown:"不明な機関",count:n=>`ニュース ${n} 件`,found:n=>`検索結果 ${n} 件`,empty:"🔍 関連ニュースが見つかりません",tryAgain:"別のキーワードをお試しください。",home:"← ホームに戻る",untitled:"無題",loading:"ニュースを読み込み中…",error:"ニュースを読み込めません",errorBody:"現在、AXNews のニュースデータを読み込めません。",missing:"翻訳はまだありません。中国語の原文を表示しています。",machine:"AI 自動翻訳",footer:"阿謝国は架空の国家創作プロジェクトです"}
};
const AGENCY_TEXT = {
 "president":{en:"Presidential Affairs Department",ja:"大統領業務部"},
 "vice-president":{en:"Vice President’s Office",ja:"副大統領室"},
 "government":{en:"Government of the republic of axie",ja:"阿謝国政府"},
 "congress":{en:"Congress of the republic of axie",ja:"阿謝国国会議事堂"},
 "constitutional-court":{en:"Constitutional Court of the republic of axie",ja:"阿謝国立憲院"}
};
let savedLanguage = "zh";
try { savedLanguage = localStorage.getItem("axnews-language") || "zh"; } catch {}
let language = new URLSearchParams(location.search).get("lang") || savedLanguage;
if (!TEXT[language]) language = "zh";
let loaded = false;
let loadError = null;
function countryName(text) {
 return language === "zh" ? String(text || "") : String(text || "").replace(/阿[谢謝]国|republic of axie/gi, language === "en" ? "republic of axie" : "阿謝国");
}
function articleText(news) {
 const translated = language !== "zh" && news.translations?.[language];
 const ready = translated && typeof translated.title === "string" && translated.title.trim() && typeof translated.content === "string" && translated.content.trim();
 return ready ? {title:countryName(translated.title),content:countryName(translated.content),translated:true} : {title:news.title || TEXT[language].untitled,content:news.content || "",translated:false};
}
function applyLanguage() {
 const t = TEXT[language];
 document.documentElement.lang = language;
 document.title = t.heading.replace("📰 ", "") + " | " + (language === "ja" ? "阿謝国" : "republic of axie");
 document.querySelector("header h1").textContent = t.heading;
 document.getElementById("newsSubtitle").textContent = t.subtitle;
 document.getElementById("searchBox").placeholder = t.search;
 document.getElementById("searchBox").setAttribute("aria-label",t.search);
 document.querySelector(".actions a").textContent = t.home;
 document.querySelector(".footer-note").textContent = t.footer;
 document.querySelectorAll("[data-lang]").forEach(button => button.setAttribute("aria-pressed",String(button.dataset.lang === language)));
 if (loadError) renderError(loadError);
 else if (loaded) renderNews();
 else { document.getElementById("newsInfo").textContent=t.loading; document.querySelector("#newsList .message").textContent=t.loading; }
}
function renderError(err) {
 const t = TEXT[language];
 document.getElementById("newsInfo").textContent = t.error;
 document.getElementById("newsList").innerHTML = `<div class="message error"><h2>${t.error}</h2><p>${t.errorBody}</p><pre>${escapeHTML(err.message)}</pre></div>`;
}
let allNews = [];
let agencies = [];
const API_BASE = "https://axnews-admin-api.axie999666.workers.dev";
const selectedAgencyId = new URLSearchParams(location.search).get("agency") || "";

async function loadAgencies(){
    try{
        const response = await fetch(API_BASE + "/agencies");
        if(!response.ok) throw new Error("分类列表加载失败");
        const result = await response.json();
        agencies = Array.isArray(result.agencies) ? result.agencies : [];
    }catch(error){
        console.warn("AXNews 机构分类暂不可用", error);
        agencies = [];
    }
}

function agencyName(id){
    const agency = agencies.find(item => item.id === id);
    return agency ? (AGENCY_TEXT[id]?.[language] || countryName(agency.name)) : (id ? TEXT[language].other : TEXT[language].ordinary);
}

function renderAgencyFilters(){
    const nav = document.getElementById("agencyFilters");
    if(!nav) return;
    nav.innerHTML = "";
    const links = [{id:"", name:TEXT[language].all, href:"AXNews.html"}, ...agencies.map(item => ({
        id:item.id, name:agencyName(item.id), href:"AXNews.html?agency=" + encodeURIComponent(item.id)
    }))];
    links.forEach(item => {
        const link = document.createElement("a");
        const url = new URL(item.href, location.href);
        url.searchParams.set("lang", language);
        link.href = url.href;
        link.textContent = item.name;
        if(item.id === selectedAgencyId) link.classList.add("active");
        nav.appendChild(link);
    });
}


/* =========================
   加载新闻
========================= */

async function loadNews(){

    const newsList = document.getElementById("newsList");
    const newsInfo = document.getElementById("newsInfo");

    try{

        const response = await fetch(
            "./news.json?ts=" + Date.now()
        );

        if(!response.ok){

            throw new Error(
                "无法读取 news.json，HTTP状态码：" +
                response.status
            );

        }

        const data = await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "news.json 格式错误：不是新闻数组"
            );

        }

        allNews = data;
        loaded = true;
        await loadAgencies();
        renderNews();

    }
    catch(err){

        console.error(err);

        loadError = err;
        renderError(err);

    }

}


/* =========================
   显示新闻
========================= */

function renderNews(){

    const newsList =
        document.getElementById("newsList");

    const newsInfo =
        document.getElementById("newsInfo");

    const keyword =
        document
            .getElementById("searchBox")
            .value
            .trim()
            .toLowerCase();


    renderAgencyFilters();

    /* 复制数组后排序并先按机构筛选 */

    const sortedNews = [...allNews].sort(
        (a,b) =>
            Number(b.timestamp || 0) -
            Number(a.timestamp || 0)
    );

    const selectedNews = selectedAgencyId
        ? sortedNews.filter(news => news.agencyId === selectedAgencyId)
        : sortedNews;

    /* 搜索 */

    const filteredNews = selectedNews.filter(news => {

        const title =
            String(articleText(news).title || "") + " " + String(news.title || "");

        const content =
            String(articleText(news).content || "") + " " + String(news.content || "");

        if(!keyword){
            return true;
        }

        return (
            title.toLowerCase().includes(keyword) ||
            content.toLowerCase().includes(keyword)
        );

    });


    /* 新闻数量 */

    const selectedAgency = agencies.find(item => item.id === selectedAgencyId);
    const scopeLabel = selectedAgency ? agencyName(selectedAgencyId) + " · " : (selectedAgencyId ? TEXT[language].unknown + " · " : "");
    newsInfo.textContent = scopeLabel + (keyword
        ? TEXT[language].found(filteredNews.length)
        : TEXT[language].count(filteredNews.length));


    /* 没有结果 */

    if(filteredNews.length === 0){

        newsList.innerHTML = `

            <div class="message">

                <h2>${TEXT[language].empty}</h2>

                <p>
                    ${TEXT[language].tryAgain}
                </p>

            </div>

        `;

        return;

    }


    /* 清空 */

    newsList.innerHTML = "";


    /* 创建新闻 */

    filteredNews.forEach(news => {
        const display = articleText(news);

        const card =
            document.createElement("article");

        card.className = "card";


        /* 标题 */

        const title =
            document.createElement("h2");

        title.textContent =
            String(display.title);

        card.appendChild(title);


        /* 日期 / 作者 */

        const meta =
            document.createElement("small");

        meta.textContent =
            `${news.date || ""} | ${news.author || ""}`;

        card.appendChild(meta);

        const agencyTag = document.createElement("span");
        agencyTag.className = "agency-tag";
        agencyTag.textContent = agencyName(news.agencyId);
        card.appendChild(agencyTag);


        /* 图片 */

        ["image1","image2","image3"].forEach(
            key => {

                if(!news[key]){
                    return;
                }

                const img =
                    document.createElement("img");

                img.src =
                    "./" + news[key];

                img.alt =
                    display.title;

                img.loading = "lazy";

                img.onerror = () => {
                    img.style.display = "none";
                };

                card.appendChild(img);

            }
        );


        /* 正文 */

        const content =
            document.createElement("p");

        content.textContent =
            String(display.content);

        card.appendChild(content);
        if(language !== "zh") {
            const note = document.createElement("p");
            note.className = "translation-note";
            note.textContent = display.translated ? TEXT[language].machine : TEXT[language].missing;
            if(!display.translated) { title.lang = "zh"; content.lang = "zh"; }
            card.appendChild(note);
        }


        newsList.appendChild(card);

    });

}


/* =========================
   防止错误信息直接插入 HTML
========================= */

function escapeHTML(text){

    return String(text)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================
   搜索
========================= */

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        renderNews
    );


/* =========================
   页面加载
========================= */

document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => {
    language = button.dataset.lang;
    try { localStorage.setItem("axnews-language", language); } catch {}
    const url = new URL(location.href);
    url.searchParams.set("lang", language);
    history.replaceState(null, "", url);
    applyLanguage();
}));
applyLanguage();
document.addEventListener("DOMContentLoaded", loadNews);

</script>


<aside class="axie-fiction-notice footer-note" aria-label="世界观创作说明" style="font-size:12px;opacity:0.5;margin-top:20px;text-align:center;padding:0 20px 30px;line-height:1.7;overflow-wrap:anywhere">阿谢国为架空世界观创作项目 · Republic of Axie is a fictional nation project</aside>
<script src="axai-config.js"></script>
<script src="axai-widget.js?v=20261001-laws-general" defer></script>
</body>
</html>
