<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>投票 | Republic of Axie</title>

  <meta
    name="description"
    content="阿谢国选举投票系统"
  >

  <link
    rel="icon"
    href="/ROA_flag.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f7fb;

      color: #172033;

      line-height: 1.7;

    }


    /* =========================================================
       Header
    ========================================================= */

    header {

      background: #0b1f3a;

      color: white;

      padding: 22px 20px;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.12);

    }


    .header-inner {

      max-width: 1100px;

      margin: auto;

      display: flex;

      align-items: center;

      gap: 15px;

    }


    .flag {

      width: 52px;

      height: 35px;

      object-fit: cover;

      border-radius: 4px;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.25);

    }


    .site-title {

      margin: 0;

      font-size: 22px;

      font-weight: 700;

    }


    .site-subtitle {

      margin: 2px 0 0;

      font-size: 13px;

      opacity: 0.75;

    }


    /* =========================================================
       Main
    ========================================================= */

    main {

      max-width: 900px;

      margin: 45px auto;

      padding: 0 20px;

    }


    .back-link {

      display: inline-block;

      margin-bottom: 22px;

      color: #1557a6;

      text-decoration: none;

      font-size: 14px;

    }


    .back-link:hover {

      text-decoration: underline;

    }


    /* =========================================================
       Page Title
    ========================================================= */

    .page-title {

      margin-bottom: 30px;

    }


    .page-title h1 {

      margin: 0 0 7px;

      font-size: 32px;

      color: #102a4c;

    }


    .page-title p {

      margin: 0;

      color: #6b7789;

      font-size: 14px;

    }


    /* =========================================================
       Card
    ========================================================= */

    .card {

      background: white;

      border-radius: 16px;

      padding: 28px;

      margin-bottom: 22px;

      box-shadow:
        0 7px 25px rgba(20, 45, 80, 0.07);

    }


    .card-title {

      margin: 0 0 18px;

      color: #102a4c;

      font-size: 21px;

    }


    /* =========================================================
       Notice
    ========================================================= */

    .notice {

      padding: 20px;

      border-radius: 12px;

      background: #f7f9fc;

      border: 1px solid #e2e7ef;

      color: #5f6d80;

      margin-bottom: 22px;

    }


    .notice strong {

      display: block;

      margin-bottom: 5px;

      color: #26364d;

      font-size: 16px;

    }


    .notice.success {

      background: #eef9f3;

      border-color: #cfe8da;

      color: #276644;

    }


    .notice.warning {

      background: #fff8e8;

      border-color: #f0dfb3;

      color: #775d22;

    }


    /* =========================================================
       Status
    ========================================================= */

    .status {

      display: inline-block;

      padding: 5px 12px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 600;

    }


    .status-before {

      background: #e9f1fb;

      color: #1557a6;

    }


    .status-active {

      background: #e8f6ee;

      color: #18794e;

    }


    .status-ended {

      background: #eef1f5;

      color: #596577;

    }


    /* =========================================================
       Election Information
    ========================================================= */

    .election-info {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 13px;

    }


    .info-item {

      background: #f7f9fc;

      border-radius: 10px;

      padding: 13px 15px;

    }


    .info-label {

      font-size: 11px;

      color: #7b8798;

      margin-bottom: 3px;

    }


    .info-value {

      font-size: 13px;

      font-weight: 600;

      color: #33435a;

    }


    /* =========================================================
       Candidate List
    ========================================================= */

    .candidate-list {

      display: grid;

      gap: 15px;

    }


    .candidate-option {

      position: relative;

    }


    .candidate-option input {

      position: absolute;

      opacity: 0;

      pointer-events: none;

    }


    .candidate-label {

      display: block;

      padding: 20px;

      border: 2px solid #e2e7ef;

      border-radius: 14px;

      cursor: pointer;

      background: white;

      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;

    }


    .candidate-label:hover {

      border-color: #b8c8db;

    }


    .candidate-option input:checked
    + .candidate-label {

      border-color: #1557a6;

      background: #f5f9ff;

      box-shadow:
        0 4px 16px rgba(21, 87, 166, 0.10);

    }


    .candidate-main {

      display: grid;

      grid-template-columns:
        55px 1fr;

      gap: 16px;

      align-items: center;

    }


    .candidate-number {

      width: 48px;

      height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 11px;

      background: #eef3f9;

      color: #1557a6;

      font-size: 19px;

      font-weight: 700;

    }


    .candidate-name {

      font-size: 18px;

      font-weight: 700;

      color: #24344b;

    }


    .candidate-name-en {

      font-size: 12px;

      color: #7a8798;

      margin-top: 1px;

    }


    .candidate-party {

      font-size: 13px;

      color: #637084;

      margin-top: 4px;

    }


    .candidate-introduction {

      margin-top: 14px;

      padding-top: 13px;

      border-top: 1px solid #edf0f4;

      font-size: 13px;

      color: #657287;

    }


    /* =========================================================
       Buttons
    ========================================================= */

    .button-area {

      margin-top: 25px;

    }


    .vote-button {

      width: 100%;

      border: none;

      border-radius: 11px;

      padding: 14px 20px;

      font-size: 16px;

      font-weight: 700;

      background: #1557a6;

      color: white;

      cursor: pointer;

    }


    .vote-button:hover {

      opacity: 0.92;

    }


    .vote-button:disabled {

      background: #b9c2ce;

      cursor: not-allowed;

    }


    .secondary-button {

      display: inline-block;

      text-align: center;

      padding: 11px 18px;

      border-radius: 10px;

      background: #e9edf2;

      color: #445267;

      text-decoration: none;

      font-size: 14px;

      font-weight: 600;

    }


    .secondary-button:hover {

      background: #dde3ea;

    }


    /* =========================================================
       Confirmation
    ========================================================= */

    .confirmation {

      display: none;

      margin-top: 22px;

      padding: 22px;

      background: #f7f9fc;

      border-radius: 12px;

      border: 1px solid #e0e6ee;

    }


    .confirmation.show {

      display: block;

    }


    .confirmation-name {

      font-size: 20px;

      font-weight: 700;

      color: #102a4c;

    }


    .confirmation-party {

      color: #66748a;

      font-size: 13px;

      margin-top: 4px;

    }


    .confirm-buttons {

      display: flex;

      gap: 12px;

      margin-top: 18px;

    }


    .confirm-button {

      flex: 1;

      border: none;

      border-radius: 10px;

      padding: 12px;

      cursor: pointer;

      font-weight: 700;

    }


    .confirm-submit {

      background: #1557a6;

      color: white;

    }


    .confirm-cancel {

      background: #e9edf2;

      color: #445267;

    }


    /* =========================================================
       Success
    ========================================================= */

    .success-result {

      display: none;

    }


    .success-result.show {

      display: block;

    }


    .success-icon {

      font-size: 40px;

      margin-bottom: 8px;

    }


    .success-title {

      font-size: 24px;

      font-weight: 700;

      color: #102a4c;

      margin-bottom: 8px;

    }


    .success-text {

      color: #637084;

      font-size: 14px;

    }


    /* =========================================================
       Error
    ========================================================= */

    .error-card {

      background: white;

      border-radius: 16px;

      padding: 55px 30px;

      text-align: center;

      box-shadow:
        0 8px 30px rgba(20, 45, 80, 0.06);

    }


    .error-card h1 {

      margin: 0 0 10px;

      color: #102a4c;

    }


    .error-card p {

      margin: 0;

      color: #687589;

    }


    /* =========================================================
       Responsive
    ========================================================= */

    @media (max-width: 760px) {

      main {

        margin: 30px auto;

      }


      .page-title h1 {

        font-size: 28px;

      }


      .card {

        padding: 22px 20px;

      }


      .election-info {

        grid-template-columns: 1fr;

      }


      .candidate-main {

        grid-template-columns:
          48px 1fr;

      }


      .confirm-buttons {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <img
      src="/ROA_flag.png"
      alt="Republic of Axie"
      class="flag"
    >

    <div>

      <h1 class="site-title">
        Republic of Axie
      </h1>

      <p class="site-subtitle">
        阿谢国选举投票系统
      </p>

    </div>

  </div>

</header>



<main>

  <a
    href="javascript:history.back()"
    class="back-link"
  >
    ← 返回上一页
  </a>


  <div id="content">

    <div class="error-card">

      <h1>
        正在读取选举资料
      </h1>

      <p>
        请稍候……
      </p>

    </div>

  </div>

</main>



<script>

  /* =========================================================
     阿谢纪年
  ========================================================= */

  const AXIE_ERA_START_YEAR = 2024;


  /* =========================================================
     HTML 转义
  ========================================================= */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     阿谢纪年
  ========================================================= */

  function formatAxieDate(
    isoString,
    includeTime = false
  ) {

    if (!isoString) {

      return "暂无资料";

    }

    const date =
      new Date(
        isoString
      );

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "暂无资料";

    }

    const formatter =
      new Intl.DateTimeFormat(
        "zh-CN",
        {

          timeZone:
            "Asia/Tokyo",

          year:
            "numeric",

          month:
            "numeric",

          day:
            "numeric",

          ...(includeTime
            ? {

                hour:
                  "2-digit",

                minute:
                  "2-digit",

                hour12:
                  false

              }

            : {})

        }
      );

    const parts =
      formatter.formatToParts(
        date
      );

    const values = {};

    for (
      const part of parts
    ) {

      values[part.type] =
        part.value;

    }

    const gregorianYear =
      Number(
        values.year
      );

    const axieYear =
      gregorianYear
      - AXIE_ERA_START_YEAR
      + 1;

    const axieYearText =
      axieYear === 1
        ? "元年"
        : `${axieYear}年`;

    let result =
      `阿谢${axieYearText}${values.month}月${values.day}日`;

    if (includeTime) {

      result +=
        ` ${values.hour}:${values.minute}`;

    }

    return result;

  }


  /* =========================================================
     获取 URL electionId
  ========================================================= */

  function getRequestedElectionId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get(
      "id"
    );

  }


  /* =========================================================
     获取全部选举
  ========================================================= */

  function getAllElections(
    electionsData
  ) {

    const list = [];


    if (
      electionsData.president
      &&
      Array.isArray(
        electionsData.president.elections
      )
    ) {

      for (
        const election
        of electionsData.president.elections
      ) {

        list.push({

          election,

          typeData:
            electionsData.president,

          typeKey:
            "president"

        });

      }

    }


    if (
      electionsData.vicePresident
      &&
      Array.isArray(
        electionsData.vicePresident.elections
      )
    ) {

      for (
        const election
        of electionsData.vicePresident.elections
      ) {

        list.push({

          election,

          typeData:
            electionsData.vicePresident,

          typeKey:
            "vicePresident"

        });

      }

    }


    return list;

  }


  /* =========================================================
     获取指定选举
  ========================================================= */

  function findElection(
    electionsData,
    electionId
  ) {

    const all =
      getAllElections(
        electionsData
      );

    return (
      all.find(
        item =>
          item.election.electionId
          === electionId
      )
      || null
    );

  }


  /* =========================================================
     判断选举当前状态
  ========================================================= */

  function getElectionStatus(
    election
  ) {

    if (
      !election
      ||
      !election.start
      ||
      !election.end
    ) {

      return "before";

    }


    const now =
      new Date();


    const start =
      new Date(
        election.start
      );


    const end =
      new Date(
        election.end
      );


    if (
      Number.isNaN(
        start.getTime()
      )
      ||
      Number.isNaN(
        end.getTime()
      )
    ) {

      return "before";

    }


    /*
     * 投票区间：
     *
     * start <= now <= end
     */

    if (
      now < start
    ) {

      return "before";

    }


    if (
      now > end
    ) {

      return "ended";

    }


    return "active";

  }


  /* =========================================================
     状态文字
  ========================================================= */

  function getStatusText(
    status
  ) {

    const map = {

      before:
        "尚未开始",

      active:
        "投票进行中",

      ended:
        "投票已结束"

    };

    return (
      map[status]
      || "未知状态"
    );

  }


  /* =========================================================
     找下一场选举
  ========================================================= */

  function findNextElection(
    electionsData
  ) {

    const all =
      getAllElections(
        electionsData
      );

    const now =
      new Date();


    const future =
      all

        .filter(
          item => {

            if (
              !item.election.start
            ) {

              return false;

            }


            const start =
              new Date(
                item.election.start
              );


            return (
              !Number.isNaN(
                start.getTime()
              )
              &&
              start > now
            );

          }
        )

        .sort(
          (a, b) => {

            return (
              new Date(
                a.election.start
              ).getTime()
              -
              new Date(
                b.election.start
              ).getTime()
            );

          }
        );


    return (
      future[0]
      || null
    );

  }


  /* =========================================================
     找当前正在进行的选举
  ========================================================= */

  function findActiveElection(
    electionsData
  ) {

    const all =
      getAllElections(
        electionsData
      );


    for (
      const item
      of all
    ) {

      if (
        getElectionStatus(
          item.election
        )
        === "active"
      ) {

        return item;

      }

    }


    return null;

  }


  /* =========================================================
     获取候选人
  ========================================================= */

  function getCandidates(
    candidatesData,
    electionId
  ) {

    if (
      !candidatesData
      ||
      !Array.isArray(
        candidatesData.candidates
      )
    ) {

      return [];

    }


    return candidatesData.candidates

      .filter(
        candidate =>
          candidate.electionId
          === electionId
      )

      .sort(
        (a, b) => {

          const noA =
            Number(
              a.candidateNo
              || 9999
            );

          const noB =
            Number(
              b.candidateNo
              || 9999
            );

          return noA - noB;

        }
      );

  }


  /* =========================================================
     候选人 HTML
  ========================================================= */

  function renderCandidates(
    candidates,
    disabled = false
  ) {

    if (
      candidates.length === 0
    ) {

      return `

        <div
          class="notice warning"
        >

          <strong>
            当前没有候选人
          </strong>

          本次选举暂时没有可供投票的候选人资料。

        </div>

      `;

    }


    return candidates

      .map(
        candidate => `

          <div
            class="candidate-option"
          >

            <input
              type="radio"
              name="candidate"
              id="candidate-${escapeHTML(
                candidate.candidateId
              )}"
              value="${escapeHTML(
                candidate.candidateId
              )}"
              ${disabled ? "disabled" : ""}
            >


            <label
              class="candidate-label"
              for="candidate-${escapeHTML(
                candidate.candidateId
              )}"
              style="${
                disabled
                  ? "cursor:not-allowed;opacity:0.72;"
                  : ""
              }"
            >

              <div
                class="candidate-main"
              >

                <div
                  class="candidate-number"
                >
                  ${escapeHTML(
                    candidate.candidateNo
                    || "-"
                  )}
                </div>


                <div>

                  <div
                    class="candidate-name"
                  >
                    ${escapeHTML(
                      candidate.names?.zh
                      || "未命名候选人"
                    )}
                  </div>


                  ${
                    candidate.names?.en
                      ? `
                        <div
                          class="candidate-name-en"
                        >
                          ${escapeHTML(
                            candidate.names.en
                          )}
                        </div>
                      `
                      : ""
                  }


                  <div
                    class="candidate-party"
                  >

                    ${
                      candidate.partyName
                        ? escapeHTML(
                            candidate.partyName
                          )
                        : "独立候选人"
                    }

                  </div>

                </div>

              </div>


              ${
                candidate.introduction
                  ? `
                    <div
                      class="candidate-introduction"
                    >
                      ${escapeHTML(
                        candidate.introduction
                      )}
                    </div>
                  `
                  : ""
              }

            </label>

          </div>

        `
      )

      .join("");

  }


  /* =========================================================
     选举信息
  ========================================================= */

  function renderElectionInfo(
    electionInfo,
    candidates
  ) {

    const election =
      electionInfo.election;

    const typeData =
      electionInfo.typeData;

    const status =
      getElectionStatus(
        election
      );


    return `

      <div
        class="card"
      >

        <h2
          class="card-title"
        >
          选举信息
        </h2>


        <div
          class="election-info"
        >

          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              选举类型
            </div>

            <div
              class="info-value"
            >
              ${escapeHTML(
                typeData.name
                || "暂无资料"
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              当前状态
            </div>

            <div
              class="info-value"
            >

              <span
                class="status status-${status}"
              >
                ${getStatusText(
                  status
                )}
              </span>

            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              候选人数
            </div>

            <div
              class="info-value"
            >
              ${candidates.length} 人
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              投票开始
            </div>

            <div
              class="info-value"
            >
              ${formatAxieDate(
                election.start
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              投票结束
            </div>

            <div
              class="info-value"
            >
              ${formatAxieDate(
                election.end
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              Election ID
            </div>

            <div
              class="info-value"
            >
              ${escapeHTML(
                election.electionId
              )}
            </div>

          </div>

        </div>

      </div>

    `;

  }


  /* =========================================================
     禁用所有候选人
  ========================================================= */

  function disableAllCandidates() {

    const inputs =
      document.querySelectorAll(
        'input[name="candidate"]'
      );


    inputs.forEach(
      input => {

        input.disabled = true;

      }
    );


    const labels =
      document.querySelectorAll(
        ".candidate-label"
      );


    labels.forEach(
      label => {

        label.style.cursor =
          "not-allowed";

        label.style.opacity =
          "0.72";

      }
    );

  }


  /* =========================================================
     禁用投票区域
  ========================================================= */

  function lockVotingInterface(
    message
  ) {

    disableAllCandidates();


    const voteButton =
      document.getElementById(
        "voteButton"
      );


    if (voteButton) {

      voteButton.disabled =
        true;

      voteButton.textContent =
        "投票已结束";

    }


    const confirmation =
      document.getElementById(
        "confirmation"
      );


    if (confirmation) {

      confirmation.classList.remove(
        "show"
      );

    }


    if (message) {

      const oldNotice =
        document.getElementById(
          "dynamicVoteNotice"
        );


      if (oldNotice) {

        oldNotice.remove();

      }


      const notice =
        document.createElement(
          "div"
        );


      notice.id =
        "dynamicVoteNotice";

      notice.className =
        "notice warning";


      notice.innerHTML = `

        <strong>
          投票状态已更新
        </strong>

        ${escapeHTML(
          message
        )}

      `;


      const content =
        document.getElementById(
          "content"
        );


      if (content) {

        content.prepend(
          notice
        );

      }

    }

  }


  /* =========================================================
     设置投票操作
  ========================================================= */

  function setupVoting(
    electionInfo,
    candidates
  ) {

    const voteButton =
      document.getElementById(
        "voteButton"
      );


    if (!voteButton) {

      return;

    }


    const confirmation =
      document.getElementById(
        "confirmation"
      );


    const confirmationName =
      document.getElementById(
        "confirmationName"
      );


    const confirmationParty =
      document.getElementById(
        "confirmationParty"
      );


    const submitButton =
      document.getElementById(
        "submitButton"
      );


    const cancelButton =
      document.getElementById(
        "cancelButton"
      );


    /*
     * ========================================================
     * 确认选择
     * ========================================================
     */

    voteButton.addEventListener(
      "click",
      () => {

        /*
         * 第一次检查：
         * 用户点击「确认选择」时检查时间。
         */

        const currentStatus =
          getElectionStatus(
            electionInfo.election
          );


        if (
          currentStatus !== "active"
        ) {

          lockVotingInterface(

            currentStatus === "before"

              ? "本次选举尚未开始，当前不能进行投票。"

              : "本次选举的投票时间已经结束，当前不能提交新的选票。"

          );

          return;

        }


        const selected =
          document.querySelector(
            'input[name="candidate"]:checked'
          );


        if (!selected) {

          alert(
            "请先选择一名候选人。"
          );

          return;

        }


        const candidate =
          candidates.find(
            item =>
              item.candidateId
              === selected.value
          );


        if (!candidate) {

          alert(
            "无法找到所选候选人的资料。"
          );

          return;

        }


        confirmationName.textContent =
          `候选人 ${
            candidate.candidateNo
            || "-"
          }：${
            candidate.names?.zh
            || "未命名候选人"
          }`;


        confirmationParty.textContent =
          candidate.partyName
          || "独立候选人";


        confirmation.classList.add(
          "show"
        );


        confirmation.scrollIntoView({

          behavior:
            "smooth",

          block:
            "center"

        });

      }
    );


    /* ========================================================
       返回修改
    ======================================================== */

    cancelButton.addEventListener(
      "click",
      () => {

        confirmation.classList.remove(
          "show"
        );

      }
    );


    /* ========================================================
       最终提交
    ======================================================== */

    submitButton.addEventListener(
      "click",
      () => {

        /*
         * =====================================================
         * 第二次、也是关键的一次时间检查。
         *
         * 防止：
         *
         * 23:59 打开页面
         * ↓
         * 23:59 选择候选人
         * ↓
         * 00:00 选举结束
         * ↓
         * 点击提交
         *
         * 这种情况下仍然必须拒绝提交。
         * =====================================================
         */

        const currentStatus =
          getElectionStatus(
            electionInfo.election
          );


        if (
          currentStatus !== "active"
        ) {

          lockVotingInterface(

            currentStatus === "before"

              ? "本次选举尚未开始，当前不能提交选票。"

              : "本次选举已经结束，本次操作不能提交选票。"

          );

          return;

        }


        /*
         * 再次确认候选人仍然存在。
         */

        const selected =
          document.querySelector(
            'input[name="candidate"]:checked'
          );


        if (!selected) {

          confirmation.classList.remove(
            "show"
          );

          alert(
            "未检测到有效的候选人选择。"
          );

          return;

        }


        const candidate =
          candidates.find(
            item =>
              item.candidateId
              === selected.value
          );


        if (!candidate) {

          confirmation.classList.remove(
            "show"
          );

          alert(
            "无法确认所选候选人的资料。"
          );

          return;

        }


        /*
         * =====================================================
         * 当前版本：
         *
         * 仅测试前端投票流程。
         *
         * 不发送网络请求。
         * 不修改 JSON。
         * 不写入数据库。
         * =====================================================
         */

        confirmation.classList.remove(
          "show"
        );


        const successResult =
          document.getElementById(
            "successResult"
          );


        successResult.classList.add(
          "show"
        );


        successResult.scrollIntoView({

          behavior:
            "smooth",

          block:
            "center"

        });

      }
    );

  }


  /* =========================================================
     渲染无正在进行的选举
  ========================================================= */

  function renderNoActiveElection(
    electionsData
  ) {

    const next =
      findNextElection(
        electionsData
      );


    let nextHTML = "";


    if (next) {

      const election =
        next.election;


      nextHTML = `

        <div
          class="card"
        >

          <h2
            class="card-title"
          >
            下一场选举
          </h2>


          <div
            style="
              font-size:20px;
              font-weight:700;
              color:#102a4c;
              margin-bottom:5px;
            "
          >
            ${escapeHTML(
              election.name
            )}
          </div>


          <div
            style="
              color:#6b7789;
              font-size:13px;
              margin-bottom:16px;
            "
          >
            ${escapeHTML(
              election.nameEn
              || ""
            )}
          </div>


          <div
            class="election-info"
          >

            <div
              class="info-item"
            >

              <div
                class="info-label"
              >
                投票开始
              </div>


              <div
                class="info-value"
              >
                ${formatAxieDate(
                  election.start,
                  true
                )}
              </div>

            </div>


            <div
              class="info-item"
            >

              <div
                class="info-label"
              >
                投票结束
              </div>


              <div
                class="info-value"
              >
                ${formatAxieDate(
                  election.end,
                  true
                )}
              </div>

            </div>


            <div
              class="info-item"
            >

              <div
                class="info-label"
              >
                Election ID
              </div>


              <div
                class="info-value"
              >
                ${escapeHTML(
                  election.electionId
                )}
              </div>

            </div>

          </div>


          <div
            style="
              margin-top:20px;
            "
          >

            <a
              class="secondary-button"
              href="election-result.html?id=${encodeURIComponent(
                election.electionId
              )}"
            >
              查看选举资料
            </a>

          </div>

        </div>

      `;

    }


    else {

      nextHTML = `

        <div
          class="card"
        >

          <div
            class="notice"
            style="
              margin-bottom:0;
            "
          >

            <strong>
              当前没有安排中的选举
            </strong>

            目前没有可以开放投票的选举。

          </div>

        </div>

      `;

    }


    return `

      <div
        class="page-title"
      >

        <h1>
          阿谢国选举投票
        </h1>


        <p>
          Republic of Axie Election Voting System
        </p>

      </div>


      <div
        class="notice"
      >

        <strong>
          当前没有正在进行的选举
        </strong>

        投票系统目前没有开放新的选票。

        如果选举开始，系统将自动开放对应选举的投票页面。

      </div>


      ${nextHTML}

    `;

  }


  /* =========================================================
     渲染具体投票页面
  ========================================================= */

  function renderVotingPage(
    electionInfo,
    candidates
  ) {

    const election =
      electionInfo.election;


    const status =
      getElectionStatus(
        election
      );


    let notice = "";


    if (
      status === "active"
    ) {

      notice = `

        <div
          class="notice success"
        >

          <strong>
            投票正在进行
          </strong>

          当前处于本次选举规定的投票时间内。

          请确认你的选择后再提交。

        </div>

      `;

    }


    else if (
      status === "before"
    ) {

      notice = `

        <div
          class="notice"
        >

          <strong>
            投票尚未开始
          </strong>

          本次选举将于

          ${formatAxieDate(
            election.start,
            true
          )}

          开始。

        </div>

      `;

    }


    else {

      notice = `

        <div
          class="notice warning"
        >

          <strong>
            投票已经结束
          </strong>

          本次选举的投票时间已经结束，
          当前不能提交新的选票。

        </div>

      `;

    }


    const disabled =
      status !== "active"
      ||
      candidates.length === 0;


    return `

      <div
        class="page-title"
      >

        <h1>
          ${escapeHTML(
            election.name
          )}
        </h1>


        <p>
          ${escapeHTML(
            election.nameEn
            || ""
          )}
        </p>

      </div>


      ${notice}


      ${renderElectionInfo(
        electionInfo,
        candidates
      )}


      <div
        class="card"
      >

        <h2
          class="card-title"
        >
          选择候选人
        </h2>


        <div
          class="candidate-list"
        >

          ${renderCandidates(
            candidates,
            disabled
          )}

        </div>


        <div
          class="button-area"
        >

          <button
            id="voteButton"
            class="vote-button"
            ${disabled ? "disabled" : ""}
          >
            ${
              status === "active"
                ? "确认选择"
                : "当前不可投票"
            }
          </button>

        </div>


        <div
          id="confirmation"
          class="confirmation"
        >

          <div
            id="confirmationName"
            class="confirmation-name"
          ></div>


          <div
            id="confirmationParty"
            class="confirmation-party"
          ></div>


          <div
            class="confirm-buttons"
          >

            <button
              id="cancelButton"
              class="confirm-button confirm-cancel"
            >
              返回修改
            </button>


            <button
              id="submitButton"
              class="confirm-button confirm-submit"
            >
              提交选票
            </button>

          </div>

        </div>

      </div>


      <div
        id="successResult"
        class="card success-result"
      >

        <div
          class="success-icon"
        >
          ✓
        </div>


        <div
          class="success-title"
        >
          投票流程测试完成
        </div>


        <div
          class="success-text"
        >

          当前版本为前端投票流程测试。

          <br><br>

          本次操作没有向服务器提交真实选票，
          不会修改数据库，
          也不会影响正式选举结果。

          <br><br>

          正式投票系统上线后，
          此处将连接服务器端选票提交、身份验证、
          防重复投票及计票系统。

        </div>

      </div>

    `;

  }


  /* =========================================================
     错误页面
  ========================================================= */

  function showError(
    message
  ) {

    document.getElementById(
      "content"
    ).innerHTML = `

      <div
        class="error-card"
      >

        <h1>
          无法打开投票系统
        </h1>


        <p>
          ${escapeHTML(
            message
          )}
        </p>

      </div>

    `;

  }


  /* =========================================================
     主程序
  ========================================================= */

  async function loadVotingPage() {

    try {

      /*
       * 读取选举与候选人资料。
       */

      const [
        electionsResponse,
        candidatesResponse
      ] = await Promise.all([

        fetch(
          "./data/elections.json",
          {
            cache: "no-store"
          }
        ),

        fetch(
          "./data/candidates.json",
          {
            cache: "no-store"
          }
        )

      ]);


      if (
        !electionsResponse.ok
      ) {

        throw new Error(
          "无法读取 elections.json"
        );

      }


      if (
        !candidatesResponse.ok
      ) {

        throw new Error(
          "无法读取 candidates.json"
        );

      }


      const [
        electionsData,
        candidatesData
      ] = await Promise.all([

        electionsResponse.json(),

        candidatesResponse.json()

      ]);


      /* =====================================================
         模式一：
         URL 存在 ?id=
         ===================================================== */

      const requestedId =
        getRequestedElectionId();


      if (requestedId) {

        const electionInfo =
          findElection(
            electionsData,
            requestedId
          );


        if (!electionInfo) {

          throw new Error(
            `找不到 electionId：${requestedId}`
          );

        }


        const candidates =
          getCandidates(
            candidatesData,
            requestedId
          );


        document.getElementById(
          "content"
        ).innerHTML =
          renderVotingPage(
            electionInfo,
            candidates
          );


        setupVoting(
          electionInfo,
          candidates
        );


        return;

      }


      /* =====================================================
         模式二：
         没有 ?id=
         自动寻找当前正在进行的选举
         ===================================================== */

      const activeElection =
        findActiveElection(
          electionsData
        );


      if (activeElection) {

        const candidates =
          getCandidates(
            candidatesData,
            activeElection.election.electionId
          );


        document.getElementById(
          "content"
        ).innerHTML =
          renderVotingPage(
            activeElection,
            candidates
          );


        setupVoting(
          activeElection,
          candidates
        );


        return;

      }


      /* =====================================================
         没有正在进行的选举
         ===================================================== */

      document.getElementById(
        "content"
      ).innerHTML =
        renderNoActiveElection(
          electionsData
        );

    }


    catch (error) {

      console.error(
        error
      );


      showError(
        error.message
        ||
        "读取选举资料时发生未知错误。"
      );

    }

  }


  /* =========================================================
     启动
  ========================================================= */

  loadVotingPage();

</script>
