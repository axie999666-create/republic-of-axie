<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>候选人申请审核｜阿谢国管理系统</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }

    /* =========================
       Header
       ========================= */

    header {
      background: #071a36;
      color: white;
      padding: 18px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .flag {
      width: 58px;
      height: 39px;
      object-fit: cover;
      border-radius: 4px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.25);
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    .header-subtitle {
      margin-top: 3px;
      font-size: 13px;
      opacity: 0.72;
    }

    .logout-button {
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: white;

      padding: 9px 15px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 14px;
    }

    .logout-button:hover {
      background: rgba(255,255,255,0.16);
    }

    /* =========================
       Main
       ========================= */

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 30px auto 60px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 30px;
      color: #102a52;
    }

    .page-title p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 14px;
    }

    /* =========================
       Login
       ========================= */

    .login-container {
      width: min(460px, 100%);
      margin: 70px auto;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 32px;

      box-shadow:
        0 8px 30px rgba(16, 42, 82, 0.08);
    }

    .login-card h1 {
      margin: 0 0 8px;
      color: #102a52;
      font-size: 25px;
    }

    .login-card p {
      color: #667085;
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #344054;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid #d0d5dd;
      border-radius: 9px;

      padding: 11px 12px;

      font-size: 14px;
      font-family: inherit;

      background: white;
      color: #172033;

      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #315ea8;
      box-shadow: 0 0 0 3px rgba(49,94,168,0.10);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.65;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .primary-button {
      width: 100%;

      border: none;
      border-radius: 9px;

      background: #173d73;
      color: white;

      padding: 12px 18px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }

    .primary-button:hover {
      background: #0f2d58;
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       Message
       ========================= */

    .message {
      display: none;

      border-radius: 9px;
      padding: 12px 14px;

      margin-bottom: 18px;

      font-size: 14px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff1f1;
      border: 1px solid #f3b4b4;
      color: #a61b1b;
    }

    .message.success {
      background: #eefaf2;
      border: 1px solid #b6dfc2;
      color: #176b34;
    }

    .message.info {
      background: #eef5ff;
      border: 1px solid #bdd2f2;
      color: #1d4f91;
    }

    /* =========================
       Toolbar
       ========================= */

    .toolbar {
      background: white;
      border-radius: 14px;

      padding: 16px 18px;

      margin-bottom: 20px;

      box-shadow:
        0 4px 18px rgba(16, 42, 82, 0.06);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-button {
      border: 1px solid #d0d5dd;
      background: white;

      color: #475467;

      padding: 8px 13px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 13px;
    }

    .filter-button:hover {
      background: #f7f9fc;
    }

    .filter-button.active {
      background: #173d73;
      border-color: #173d73;
      color: white;
    }

    .refresh-button {
      border: 1px solid #173d73;
      background: white;

      color: #173d73;

      padding: 8px 14px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 13px;
    }

    .refresh-button:hover {
      background: #eef4fc;
    }

    /* =========================
       Stats
       ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 17px 18px;

      box-shadow:
        0 4px 18px rgba(16, 42, 82, 0.05);
    }

    .stat-label {
      font-size: 13px;
      color: #667085;
    }

    .stat-number {
      margin-top: 7px;

      font-size: 26px;
      font-weight: 700;

      color: #102a52;
    }

    /* =========================
       Applications
       ========================= */

    .applications {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .application-card {
      background: white;
      border-radius: 15px;

      padding: 22px;

      box-shadow:
        0 5px 20px rgba(16, 42, 82, 0.06);
    }

    .application-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 16px;
    }

    .candidate-title {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .candidate-avatar {
      width: 54px;
      height: 54px;

      border-radius: 50%;

      object-fit: cover;

      background: #edf1f7;
      border: 1px solid #dce2eb;
    }

    .candidate-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;

      color: #667085;
      font-size: 20px;
      font-weight: 700;
    }

    .candidate-name {
      font-size: 19px;
      font-weight: 700;

      color: #102a52;
    }

    .candidate-id {
      margin-top: 4px;

      color: #98a2b3;
      font-size: 12px;

      font-family: monospace;
    }

    /* =========================
       Status
       ========================= */

    .status-badge {
      display: inline-flex;
      align-items: center;

      padding: 6px 10px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 700;

      white-space: nowrap;
    }

    .status-pending {
      background: #fff7df;
      color: #8a6100;
    }

    .status-approved {
      background: #eaf8ef;
      color: #176b34;
    }

    .status-rejected {
      background: #fff0f0;
      color: #a61b1b;
    }

    /* =========================
       Information grid
       ========================= */

    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px 18px;

      margin-bottom: 17px;
    }

    .info-item {
      border: 1px solid #edf0f5;
      border-radius: 9px;

      padding: 11px 13px;

      background: #fafbfd;
    }

    .info-label {
      font-size: 11px;
      color: #98a2b3;

      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      color: #344054;

      word-break: break-word;
    }

    /* =========================
       Long content
       ========================= */

    .content-section {
      margin-top: 15px;
    }

    .content-section-title {
      font-size: 13px;
      font-weight: 700;

      color: #475467;

      margin-bottom: 7px;
    }

    .content-box {
      white-space: pre-wrap;
      word-break: break-word;

      background: #f8fafc;

      border: 1px solid #edf0f5;
      border-radius: 9px;

      padding: 13px;

      font-size: 13px;
      line-height: 1.7;

      color: #344054;
    }

    /* =========================
       Review area
       ========================= */

    .review-area {
      margin-top: 20px;

      border-top: 1px solid #edf0f5;

      padding-top: 18px;
    }

    .review-actions {
      display: flex;
      align-items: flex-end;

      gap: 10px;

      margin-top: 10px;
    }

    .review-note-wrapper {
      flex: 1;
    }

    .review-note-wrapper textarea {
      min-height: 90px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .approve-button,
    .reject-button {
      border: none;

      padding: 10px 16px;

      border-radius: 8px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .approve-button {
      background: #198754;
      color: white;
    }

    .approve-button:hover {
      background: #14713f;
    }

    .reject-button {
      background: #c93434;
      color: white;
    }

    .reject-button:hover {
      background: #a92525;
    }

    .approve-button:disabled,
    .reject-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .reviewed-info {
      margin-top: 10px;

      font-size: 12px;
      color: #98a2b3;
    }

    /* =========================
       Empty state
       ========================= */

    .empty-state {
      background: white;

      border-radius: 15px;

      padding: 60px 20px;

      text-align: center;

      color: #667085;

      box-shadow:
        0 5px 20px rgba(16, 42, 82, 0.05);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 17px;
      font-weight: 700;

      color: #344054;

      margin-bottom: 6px;
    }

    .empty-description {
      font-size: 13px;
    }

    /* =========================
       Loading
       ========================= */

    .loading {
      background: white;

      border-radius: 15px;

      padding: 50px;

      text-align: center;

      color: #667085;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid #e5eaf2;
      border-top-color: #173d73;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       Hidden
       ========================= */

    .hidden {
      display: none !important;
    }

    /* =========================
       Responsive
       ========================= */

    @media (max-width: 800px) {

      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .review-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .action-buttons {
        width: 100%;
      }

      .approve-button,
      .reject-button {
        flex: 1;
      }
    }

    @media (max-width: 600px) {

      header {
        padding: 14px 16px;
      }

      .header-title {
        font-size: 16px;
      }

      .header-subtitle {
        font-size: 11px;
      }

      .flag {
        width: 48px;
        height: 32px;
      }

      main {
        width: min(100% - 20px, 1200px);
        margin-top: 20px;
      }

      .page-title h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .application-card {
        padding: 16px;
      }

      .application-top {
        flex-direction: column;
      }

      .candidate-title {
        width: 100%;
      }

      .status-badge {
        align-self: flex-start;
      }

      .toolbar {
        align-items: stretch;
      }

      .filters {
        width: 100%;
      }

      .filter-button {
        flex: 1;
      }

      .refresh-button {
        width: 100%;
      }

      .login-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-left">

    <img
      src="/ROA_flag.png"
      alt="阿谢国国旗"
      class="flag"
    >

    <div>
      <div class="header-title">
        阿谢国管理系统
      </div>

      <div class="header-subtitle">
        候选人申请审核
      </div>
    </div>

  </div>

  <button
    id="logoutButton"
    class="logout-button hidden"
    type="button"
  >
    退出登录
  </button>

</header>


<!-- =========================
     Login
     ========================= -->

<section
  id="loginSection"
  class="login-container"
>

  <div class="login-card">

    <h1>
      管理员登录
    </h1>

    <p>
      登录后可以查看候选人报名申请，并进行通过或驳回审核。
      管理操作将通过阿谢国后台 API 完成。
    </p>

    <div
      id="loginMessage"
      class="message"
    ></div>

    <form id="loginForm">

      <div class="form-group">

        <label for="password">
          管理员密码
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="请输入管理员密码"
          required
        >

      </div>

      <button
        id="loginButton"
        class="primary-button"
        type="submit"
      >
        登录
      </button>

    </form>

  </div>

</section>


<!-- =========================
     Admin application
     ========================= -->

<section
  id="adminSection"
  class="hidden"
>

  <main>

    <div class="page-title">

      <h1>
        候选人申请审核
      </h1>

      <p>
        查看、审核和管理阿谢国总统及副总统选举候选人申请。
      </p>

    </div>


    <!-- Global message -->

    <div
      id="globalMessage"
      class="message"
    ></div>


    <!-- Statistics -->

    <div class="stats">

      <div class="stat-card">
        <div class="stat-label">
          全部申请
        </div>

        <div
          id="statAll"
          class="stat-number"
        >
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          待审核
        </div>

        <div
          id="statPending"
          class="stat-number"
        >
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          已通过
        </div>

        <div
          id="statApproved"
          class="stat-number"
        >
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          已驳回
        </div>

        <div
          id="statRejected"
          class="stat-number"
        >
          0
        </div>
      </div>

    </div>


    <!-- Toolbar -->

    <div class="toolbar">

      <div class="filters">

        <button
          class="filter-button active"
          data-filter="all"
          type="button"
        >
          全部
        </button>

        <button
          class="filter-button"
          data-filter="pending"
          type="button"
        >
          待审核
        </button>

        <button
          class="filter-button"
          data-filter="approved"
          type="button"
        >
          已通过
        </button>

        <button
          class="filter-button"
          data-filter="rejected"
          type="button"
        >
          已驳回
        </button>

      </div>


      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
      >
        ↻ 刷新申请
      </button>

    </div>


    <!-- Loading -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      正在加载申请……

    </div>


    <!-- Applications -->

    <div
      id="applications"
      class="applications hidden"
    ></div>


    <!-- Empty -->

    <div
      id="emptyState"
      class="empty-state hidden"
    >

      <div class="empty-icon">
        📋
      </div>

      <div class="empty-title">
        暂无申请
      </div>

      <div class="empty-description">
        当前筛选条件下没有候选人申请。
      </div>

    </div>

  </main>

</section>


<script>

  /* ============================================================
     API
     ============================================================ */

  const API_BASE =
    "https://axnews-admin-api.axie999666.workers.dev";


  /* ============================================================
     Storage
     ============================================================ */

  const TOKEN_KEY =
    "axie_admin_session_token";


  let applications = [];

  let currentFilter = "all";


  /* ============================================================
     DOM
     ============================================================ */

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const globalMessage =
    document.getElementById("globalMessage");

  const loading =
    document.getElementById("loading");

  const applicationsContainer =
    document.getElementById("applications");

  const emptyState =
    document.getElementById("emptyState");

  const refreshButton =
    document.getElementById("refreshButton");


  /* ============================================================
     Helpers
     ============================================================ */

  function getToken() {

    return sessionStorage.getItem(TOKEN_KEY);

  }


  function setToken(token) {

    sessionStorage.setItem(
      TOKEN_KEY,
      token
    );

  }


  function clearToken() {

    sessionStorage.removeItem(
      TOKEN_KEY
    );

  }


  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatDate(value) {

    if (!value) {
      return "—";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return escapeHtml(value);
    }

    return new Intl.DateTimeFormat(
      "zh-CN",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(date);

  }


  function formatPosition(position) {

    if (position === "president") {
      return "总统";
    }

    if (position === "vicePresident") {
      return "副总统";
    }

    return position || "—";

  }


  function formatStatus(status) {

    if (status === "pending") {
      return "待审核";
    }

    if (status === "approved") {
      return "已通过";
    }

    if (status === "rejected") {
      return "已驳回";
    }

    return status || "未知";

  }


  function statusClass(status) {

    if (status === "pending") {
      return "status-pending";
    }

    if (status === "approved") {
      return "status-approved";
    }

    if (status === "rejected") {
      return "status-rejected";
    }

    return "";

  }


  function getPhotoUrl(photo) {

    if (!photo) {
      return "";
    }

    if (
      photo.startsWith("http://") ||
      photo.startsWith("https://") ||
      photo.startsWith("/")
    ) {
      return photo;
    }

    return "/" + photo.replace(/^\/+/, "");

  }


  function showMessage(
    element,
    message,
    type = "info"
  ) {

    element.textContent = message;

    element.className =
      "message show " + type;

  }


  function hideMessage(element) {

    element.className =
      "message";

    element.textContent = "";

  }


  function getErrorMessage(
    data,
    fallback
  ) {

    if (
      data &&
      typeof data.error === "string" &&
      data.error.trim()
    ) {
      return data.error;
    }

    if (
      data &&
      typeof data.message === "string" &&
      data.message.trim()
    ) {
      return data.message;
    }

    return fallback;

  }


  /* ============================================================
     API Request
     ============================================================ */

  async function apiFetch(
    path,
    options = {}
  ) {

    const headers = {
      ...(options.headers || {})
    };

    const token = getToken();

    if (token) {

      headers.Authorization =
        "Bearer " + token;

    }

    if (
      options.body &&
      !headers["Content-Type"]
    ) {

      headers["Content-Type"] =
        "application/json";

    }

    const response =
      await fetch(
        API_BASE + path,
        {
          ...options,
          headers,
          cache: "no-store"
        }
      );

    let data = null;

    const contentType =
      response.headers.get(
        "content-type"
      ) || "";

    if (
      contentType.includes(
        "application/json"
      )
    ) {

      try {
        data = await response.json();
      } catch {
        data = null;
      }

    } else {

      try {
        const text =
          await response.text();

        data = text
          ? { message: text }
          : null;

      } catch {
        data = null;
      }

    }

    if (
      response.status === 401 ||
      response.status === 403
    ) {

      clearToken();

      showLogin();

      throw new Error(
        "登录状态已失效，请重新登录。"
      );

    }

    if (!response.ok) {

      throw new Error(
        getErrorMessage(
          data,
          `请求失败（HTTP ${response.status}）`
        )
      );

    }

    return data;

  }


  /* ============================================================
     Login
     ============================================================ */

  async function login(password) {

    loginButton.disabled = true;

    loginButton.textContent =
      "正在登录……";

    hideMessage(loginMessage);

    try {

      const response =
        await fetch(
          API_BASE + "/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              password
            }),

            cache: "no-store"
          }
        );

      let data = null;

      try {

        data =
          await response.json();

      } catch {

        data = null;

      }

      if (!response.ok) {

        throw new Error(
          getErrorMessage(
            data,
            `登录失败（HTTP ${response.status}）`
          )
        );

      }

      if (
        !data ||
        !data.token
      ) {

        throw new Error(
          "服务器没有返回有效的登录 Token。"
        );

      }

      setToken(data.token);

      document.getElementById(
        "password"
      ).value = "";

      showAdmin();

      await loadApplications();

    } catch (error) {

      showMessage(
        loginMessage,
        error.message ||
          "登录失败。",
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "登录";

    }

  }


  loginForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const password =
        document.getElementById(
          "password"
        ).value;

      if (!password) {

        showMessage(
          loginMessage,
          "请输入管理员密码。",
          "error"
        );

        return;

      }

      await login(password);

    }
  );


  /* ============================================================
     Show / Hide
     ============================================================ */

  function showLogin() {

    loginSection.classList.remove(
      "hidden"
    );

    adminSection.classList.add(
      "hidden"
    );

    logoutButton.classList.add(
      "hidden"
    );

  }


  function showAdmin() {

    loginSection.classList.add(
      "hidden"
    );

    adminSection.classList.remove(
      "hidden"
    );

    logoutButton.classList.remove(
      "hidden"
    );

  }


  logoutButton.addEventListener(
    "click",
    () => {

      clearToken();

      applications = [];

      applicationsContainer.innerHTML =
        "";

      showLogin();

      hideMessage(
        globalMessage
      );

    }
  );


  /* ============================================================
     Load Applications
     ============================================================ */

  async function loadApplications() {

    loading.classList.remove(
      "hidden"
    );

    applicationsContainer.classList.add(
      "hidden"
    );

    emptyState.classList.add(
      "hidden"
    );

    try {

      const data =
        await apiFetch(
          "/candidate-applications"
        );

      if (
        !data ||
        !Array.isArray(
          data.applications
        )
      ) {

        throw new Error(
          "服务器返回的申请数据格式不正确。"
        );

      }

      applications =
        data.applications;

      updateStatistics();

      renderApplications();

      hideMessage(
        globalMessage
      );

    } catch (error) {

      showMessage(
        globalMessage,
        error.message ||
          "加载候选人申请失败。",
        "error"
      );

      applications = [];

      updateStatistics();

      renderApplications();

    } finally {

      loading.classList.add(
        "hidden"
      );

    }

  }


  /* ============================================================
     Statistics
     ============================================================ */

  function updateStatistics() {

    const all =
      applications.length;

    const pending =
      applications.filter(
        item =>
          item.status === "pending"
      ).length;

    const approved =
      applications.filter(
        item =>
          item.status === "approved"
      ).length;

    const rejected =
      applications.filter(
        item =>
          item.status === "rejected"
      ).length;

    document.getElementById(
      "statAll"
    ).textContent = all;

    document.getElementById(
      "statPending"
    ).textContent = pending;

    document.getElementById(
      "statApproved"
    ).textContent = approved;

    document.getElementById(
      "statRejected"
    ).textContent = rejected;

  }


  /* ============================================================
     Filter
     ============================================================ */

  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentFilter =
            button.dataset.filter;

          document
            .querySelectorAll(
              ".filter-button"
            )
            .forEach(item => {

              item.classList.toggle(
                "active",
                item === button
              );

            });

          renderApplications();

        }
      );

    });


  /* ============================================================
     Render
     ============================================================ */

  function getFilteredApplications() {

    if (
      currentFilter === "all"
    ) {

      return applications;

    }

    return applications.filter(
      item =>
        item.status ===
        currentFilter
    );

  }


  function renderApplications() {

    const filtered =
      getFilteredApplications();

    applicationsContainer.innerHTML =
      "";

    if (
      filtered.length === 0
    ) {

      applicationsContainer.classList.add(
        "hidden"
      );

      emptyState.classList.remove(
        "hidden"
      );

      return;

    }

    emptyState.classList.add(
      "hidden"
    );

    applicationsContainer.classList.remove(
      "hidden"
    );

    filtered.forEach(
      application => {

        applicationsContainer.appendChild(
          createApplicationCard(
            application
          )
        );

      }
    );

  }


  function createApplicationCard(
    application
  ) {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "application-card";

    const photoUrl =
      getPhotoUrl(
        application.photo
      );

    const avatarHtml =
      photoUrl
        ? `
          <img
            class="candidate-avatar"
            src="${escapeHtml(photoUrl)}"
            alt="候选人照片"
            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
          >

          <div
            class="candidate-avatar placeholder hidden"
          >
            ${escapeHtml(
              (
                application.name ||
                "候"
              ).charAt(0)
            )}
          </div>
        `
        : `
          <div
            class="candidate-avatar placeholder"
          >
            ${escapeHtml(
              (
                application.name ||
                "候"
              ).charAt(0)
            )}
          </div>
        `;


    const reviewedInfo =
      application.reviewedAt
        ? `
          <div class="reviewed-info">
            审核时间：
            ${escapeHtml(
              formatDate(
                application.reviewedAt
              )
            )}

           　审核人：
            ${escapeHtml(
              application.reviewedBy ||
                "—"
            )}
          </div>
        `
        : "";


    const reviewNote =
      application.reviewNote
        ? `
          <div class="content-section">

            <div class="content-section-title">
              审核备注
            </div>

            <div class="content-box">
              ${escapeHtml(
                application.reviewNote
              )}
            </div>

          </div>
        `
        : "";


    const reviewArea =
      application.status ===
      "pending"
        ? `
          <div class="review-area">

            <div class="content-section-title">
              审核备注（可选）
            </div>

            <div class="review-actions">

              <div class="review-note-wrapper">

                <textarea
                  class="review-note"
                  placeholder="可以填写审核意见，例如资料确认情况、需要补充的内容等。"
                ></textarea>

              </div>

              <div class="action-buttons">

                <button
                  type="button"
                  class="approve-button"
                  data-action="approve"
                  data-id="${escapeHtml(
                    application.applicationId
                  )}"
                >
                  ✓ 通过
                </button>

                <button
                  type="button"
                  class="reject-button"
                  data-action="reject"
                  data-id="${escapeHtml(
                    application.applicationId
                  )}"
                >
                  ✕ 驳回
                </button>

              </div>

            </div>

          </div>
        `
        : `
          <div class="review-area">
            ${reviewedInfo}
          </div>
        `;


    card.innerHTML = `

      <div class="application-top">

        <div class="candidate-title">

          ${avatarHtml}

          <div>

            <div class="candidate-name">
              ${escapeHtml(
                application.name ||
                  "未填写姓名"
              )}
            </div>

            <div class="candidate-id">
              ${escapeHtml(
                application.applicationId ||
                  "—"
              )}
            </div>

          </div>

        </div>


        <span
          class="status-badge ${statusClass(
            application.status
          )}"
        >
          ${escapeHtml(
            formatStatus(
              application.status
            )
          )}
        </span>

      </div>


      <div class="info-grid">

        <div class="info-item">

          <div class="info-label">
            参选职位
          </div>

          <div class="info-value">
            ${escapeHtml(
              formatPosition(
                application.position
              )
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            选举
          </div>

          <div class="info-value">
            ${escapeHtml(
              application.electionId ||
                "—"
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            中文姓名
          </div>

          <div class="info-value">
            ${escapeHtml(
              application.name ||
                "—"
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            English Name
          </div>

          <div class="info-value">
            ${escapeHtml(
              application.englishName ||
                "—"
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            日本語名
          </div>

          <div class="info-value">
            ${escapeHtml(
              application.japaneseName ||
                "—"
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            政党
          </div>

          <div class="info-value">
            ${escapeHtml(
              application.partyName ||
                "—"
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            政党 ID
          </div>

          <div class="info-value">
            ${escapeHtml(
              application.partyId ||
                "—"
            )}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            提交时间
          </div>

          <div class="info-value">
            ${escapeHtml(
              formatDate(
                application.submittedAt
              )
            )}
          </div>

        </div>

      </div>


      <div class="content-section">

        <div class="content-section-title">
          候选人简介
        </div>

        <div class="content-box">
          ${escapeHtml(
            application.introduction ||
              "未填写"
          )}
        </div>

      </div>


      <div class="content-section">

        <div class="content-section-title">
          竞选声明
        </div>

        <div class="content-box">
          ${escapeHtml(
            application.campaignStatement ||
              "未填写"
          )}
        </div>

      </div>


      ${
        application.photo
          ? `
            <div class="content-section">

              <div class="content-section-title">
                照片路径
              </div>

              <div class="content-box">
                ${escapeHtml(
                  application.photo
                )}
              </div>

            </div>
          `
          : ""
      }


      ${reviewNote}

      ${reviewArea}

    `;


    /* =========================
       Review buttons
       ========================= */

    card
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            const action =
              button.dataset.action;

            const applicationId =
              button.dataset.id;

            const noteElement =
              card.querySelector(
                ".review-note"
              );

            const reviewNote =
              noteElement
                ? noteElement.value.trim()
                : "";

            await reviewApplication(
              applicationId,
              action,
              reviewNote,
              card
            );

          }
        );

      });


    return card;

  }


  /* ============================================================
     Review
     ============================================================ */

  async function reviewApplication(
    applicationId,
    action,
    reviewNote,
    card
  ) {

    let status;

    if (action === "approve") {
      status = "approved";
    } else if (
      action === "reject"
    ) {
      status = "rejected";
    } else {
      return;
    }


    const application =
      applications.find(
        item =>
          item.applicationId ===
          applicationId
      );


    if (!application) {

      showMessage(
        globalMessage,
        "找不到对应的候选人申请。",
        "error"
      );

      return;

    }


    const actionText =
      status === "approved"
        ? "通过"
        : "驳回";


    const confirmed =
      window.confirm(
        `确定要${actionText}候选人「${application.name || applicationId}」的申请吗？\n\n审核结果：${formatStatus(status)}`
      );


    if (!confirmed) {
      return;
    }


    const buttons =
      card.querySelectorAll(
        "[data-action]"
      );


    buttons.forEach(
      button => {
        button.disabled = true;
      }
    );


    showMessage(
      globalMessage,
      `正在${actionText}申请……`,
      "info"
    );


    try {

      const data =
        await apiFetch(
          "/candidate-applications/" +
          encodeURIComponent(
            applicationId
          ) +
          "/review",
          {
            method: "POST",

            body: JSON.stringify({
              status,
              reviewNote
            })
          }
        );


      if (
        data &&
        data.application
      ) {

        const index =
          applications.findIndex(
            item =>
              item.applicationId ===
              applicationId
          );

        if (index !== -1) {

          applications[index] =
            data.application;

        }

      } else {

        /*
         * 即使 Worker 没有返回完整
         * application，也重新读取一次。
         */

        await loadApplications();

        showMessage(
          globalMessage,
          `申请已${actionText}。`,
          "success"
        );

        return;

      }


      updateStatistics();

      renderApplications();


      /*
       * 如果未来 Worker 审核通过时
       * 同时生成正式候选人，
       * Worker 可以返回：
       *
       * {
       *   success: true,
       *   application: {...},
       *   candidate: {...}
       * }
       *
       * 这里会自动显示相关信息。
       */

      if (
        data &&
        data.candidate
      ) {

        showMessage(
          globalMessage,
          `申请已通过，正式候选人 ${data.candidate.candidateId} 已生成。`,
          "success"
        );

      } else {

        showMessage(
          globalMessage,
          `申请已${actionText}。`,
          "success"
        );

      }


    } catch (error) {

      buttons.forEach(
        button => {
          button.disabled = false;
        }
      );


      showMessage(
        globalMessage,
        error.message ||
          `申请${actionText}失败。`,
        "error"
      );

    }

  }


  /* ============================================================
     Refresh
     ============================================================ */

  refreshButton.addEventListener(
    "click",
    async () => {

      refreshButton.disabled = true;

      refreshButton.textContent =
        "正在刷新……";

      try {

        await loadApplications();

      } finally {

        refreshButton.disabled = false;

        refreshButton.textContent =
          "↻ 刷新申请";

      }

    }
  );


  /* ============================================================
     Initial state
     ============================================================ */

  async function init() {

    const token =
      getToken();

    if (!token) {

      showLogin();

      return;

    }


    showAdmin();

    await loadApplications();

  }


  init();

</script>

</body>
