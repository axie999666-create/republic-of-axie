<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>候选人申请审核｜阿谢国管理系统</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    /* =========================
       Header
    ========================= */

    header {
      background: #071a3d;
      color: white;
      padding: 18px 24px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: #b9c8e5;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-button {
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .header-button:hover {
      background: rgba(255,255,255,.15);
    }

    .logout-button {
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .logout-button:hover {
      background: rgba(255,255,255,.15);
    }


    /* =========================
       Login
    ========================= */

    .login-page {
      min-height: calc(100vh - 81px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px 60px;
    }

    .login-card {
      width: min(430px, 100%);

      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;

      padding: 30px;

      box-shadow:
        0 10px 35px rgba(7, 26, 61, .08);
    }

    .login-icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: #eef4ff;

      font-size: 30px;
    }

    .login-title {
      margin: 0;

      text-align: center;

      font-size: 25px;
      color: #071a3d;
    }

    .login-subtitle {
      margin: 8px 0 25px;

      text-align: center;

      color: #748096;
      font-size: 13px;
      line-height: 1.6;
    }

    .login-label {
      display: block;

      margin-bottom: 7px;

      color: #344054;
      font-size: 13px;
      font-weight: 600;
    }

    .login-input {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d7deea;
      border-radius: 9px;

      outline: none;

      font: inherit;
      font-size: 14px;

      transition: .15s;
    }

    .login-input:focus {
      border-color: #0d5bd7;

      box-shadow:
        0 0 0 3px rgba(13,91,215,.1);
    }

    .login-button {
      width: 100%;

      margin-top: 16px;

      border: none;

      background: #0d5bd7;
      color: white;

      padding: 12px 15px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;
    }

    .login-button:hover {
      background: #094cae;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .login-status {
      min-height: 20px;

      margin-top: 14px;

      text-align: center;

      font-size: 13px;

      line-height: 1.5;
    }

    .login-status.error {
      color: #a52b2b;
    }

    .login-status.success {
      color: #16733c;
    }

    .login-security {
      margin-top: 22px;

      padding: 11px 12px;

      background: #f8fafc;

      border: 1px solid #edf0f5;

      border-radius: 8px;

      color: #7b8799;

      font-size: 12px;

      line-height: 1.6;

      text-align: center;
    }


    /* =========================
       Main
    ========================= */

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 20px 60px;

      display: none;
    }

    main.show {
      display: block;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 30px;
      color: #071a3d;
    }

    .page-title p {
      margin: 8px 0 0;
      color: #68758b;
      font-size: 14px;
    }


    /* =========================
       Stats
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .stat-label {
      font-size: 13px;
      color: #748096;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 28px;
      font-weight: 700;
      color: #071a3d;
    }


    /* =========================
       Toolbar
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-button {
      border: 1px solid #d7deea;
      background: white;
      color: #344054;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-button:hover {
      background: #f4f7fb;
    }

    .filter-button.active {
      background: #071a3d;
      border-color: #071a3d;
      color: white;
    }

    .refresh-button {
      margin-left: auto;
      border: none;
      background: #0d5bd7;
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .refresh-button:hover {
      background: #094cae;
    }

    .refresh-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* =========================
       Application card
    ========================= */

    .applications {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .application-card {
      background: white;
      border: 1px solid #e1e7ef;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.04);
    }

    .application-header {
      padding: 18px 20px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;

      border-bottom: 1px solid #edf0f5;
    }

    .application-main {
      min-width: 0;
    }

    .application-name {
      font-size: 20px;
      font-weight: 700;
      color: #071a3d;
    }

    .application-en {
      margin-top: 3px;
      color: #64748b;
      font-size: 13px;
    }

    .application-id {
      margin-top: 8px;
      color: #8792a5;
      font-size: 12px;
      font-family: monospace;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      font-weight: 600;
    }

    .status-pending {
      background: #fff4d6;
      color: #936400;
    }

    .status-approved {
      background: #dcf8e7;
      color: #16733c;
    }

    .status-rejected {
      background: #ffe1e1;
      color: #a52b2b;
    }

    .application-body {
      padding: 18px 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .info-item {
      min-width: 0;
    }

    .info-label {
      color: #7b8799;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .info-value {
      color: #27364d;
      font-size: 14px;
      word-break: break-word;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .text-box {
      white-space: pre-wrap;
      line-height: 1.7;
      background: #f8fafc;
      border: 1px solid #edf0f5;
      border-radius: 8px;
      padding: 12px;
    }


    /* =========================
       Actions
    ========================= */

    .application-actions {
      padding: 14px 20px;

      display: flex;
      gap: 10px;
      align-items: center;

      border-top: 1px solid #edf0f5;
      background: #fbfcfe;
    }

    .action-button {
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .approve-button {
      background: #16834b;
      color: white;
    }

    .approve-button:hover {
      background: #116b3d;
    }

    .reject-button {
      background: #c93636;
      color: white;
    }

    .reject-button:hover {
      background: #a92d2d;
    }

    .action-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }


    /* =========================
       Empty / Loading
    ========================= */

    .message {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #68758b;
    }

    .message strong {
      display: block;
      color: #27364d;
      margin-bottom: 7px;
    }

    .error-message {
      border-color: #f1c5c5;
      background: #fff7f7;
      color: #a52b2b;
    }


    /* =========================
       Modal
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 26, 61, .52);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      background: white;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid #edf0f5;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      color: #071a3d;
      font-size: 19px;
    }

    .modal-close {
      border: none;
      background: none;
      font-size: 24px;
      color: #7b8799;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-body p {
      margin-top: 0;
      color: #5d6a7e;
      font-size: 14px;
      line-height: 1.6;
    }

    .review-note {
      width: 100%;
      min-height: 120px;
      resize: vertical;

      border: 1px solid #d7deea;
      border-radius: 8px;
      padding: 11px 12px;

      font: inherit;
      font-size: 14px;
      outline: none;
    }

    .review-note:focus {
      border-color: #0d5bd7;
      box-shadow: 0 0 0 3px rgba(13,91,215,.1);
    }

    .modal-actions {
      margin-top: 15px;

      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .cancel-button {
      background: #eef2f7;
      color: #344054;
    }


    /* =========================
       Responsive
    ========================= */

    @media (max-width: 700px) {

      .header-inner {
        align-items: flex-start;
      }

      .brand-title {
        font-size: 17px;
      }

      .brand-subtitle {
        font-size: 11px;
      }

      .header-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .header-button,
      .logout-button {
        font-size: 12px;
        padding: 8px 10px;
      }

      .login-page {
        min-height: calc(100vh - 100px);
        padding: 25px 13px 45px;
      }

      .login-card {
        padding: 25px 20px;
      }

      main {
        padding: 25px 13px 45px;
      }

      .page-title h1 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      .application-header {
        flex-direction: column;
      }

      .application-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .action-button {
        width: 100%;
      }

      .refresh-button {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

<!-- =========================================================
     Header
========================================================= -->

<header>

  <div class="header-inner">

    <div class="brand">

      <img
        src="/ROA_flag.png"
        alt="阿谢国国旗"
      >

      <div>

        <div class="brand-title">
          阿谢国管理系统
        </div>

        <div class="brand-subtitle">
          Republic of Axie Administration System
        </div>

      </div>

    </div>


    <div class="header-actions">

      <a
        class="header-button"
        href="/"
      >
        返回官网
      </a>

      <button
        class="logout-button"
        id="logoutButton"
      >
        🚪 退出登录
      </button>

    </div>

  </div>

</header>


<!-- =========================================================
     Login Page
========================================================= -->

<section
  class="login-page"
  id="loginPage"
>

  <div class="login-card">

    <div class="login-icon">
      🔐
    </div>


    <h1 class="login-title">
      管理员登录
    </h1>


    <p class="login-subtitle">
      请登录阿谢国管理系统后继续访问<br>
      候选人申请审核功能。
    </p>


    <label
      class="login-label"
      for="adminPassword"
    >
      管理员密码
    </label>


    <input
      type="password"
      id="adminPassword"
      class="login-input"
      placeholder="请输入管理员密码"
      autocomplete="current-password"
    >


    <button
      class="login-button"
      id="loginButton"
    >
      🔓 登录管理系统
    </button>


    <div
      class="login-status"
      id="loginStatus"
    ></div>


    <div class="login-security">
      🔒 登录凭证仅用于当前管理系统访问。
    </div>

  </div>

</section>


<!-- =========================================================
     Main
========================================================= -->

<main id="adminMain">

  <div class="page-title">

    <h1>
      候选人申请审核
    </h1>

    <p>
      管理候选人参选申请，并根据审核结果将申请转为正式候选人。
    </p>

  </div>


  <!-- =========================
       Statistics
  ========================== -->

  <section class="stats">

    <div class="stat-card">

      <div class="stat-label">
        全部申请
      </div>

      <div
        class="stat-value"
        id="totalCount"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        待审核
      </div>

      <div
        class="stat-value"
        id="pendingCount"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        已处理
      </div>

      <div
        class="stat-value"
        id="processedCount"
      >
        0
      </div>

    </div>

  </section>


  <!-- =========================
       Toolbar
  ========================== -->

  <section class="toolbar">

    <button
      class="filter-button active"
      data-filter="all"
    >
      全部
    </button>

    <button
      class="filter-button"
      data-filter="pending"
    >
      待审核
    </button>

    <button
      class="filter-button"
      data-filter="approved"
    >
      已批准
    </button>

    <button
      class="filter-button"
      data-filter="rejected"
    >
      已驳回
    </button>


    <button
      class="refresh-button"
      id="refreshButton"
    >
      ↻ 刷新申请
    </button>

  </section>


  <!-- =========================
       Applications
  ========================== -->

  <section
    class="applications"
    id="applications"
  >

    <div class="message">
      正在加载申请……
    </div>

  </section>

</main>


<!-- =========================================================
     Reject Modal
========================================================= -->

<div
  class="modal-overlay"
  id="rejectModal"
>

  <div class="modal">

    <div class="modal-header">

      <h2>
        驳回候选人申请
      </h2>


      <button
        class="modal-close"
        id="closeModalButton"
        aria-label="关闭"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <p id="rejectDescription">
        请填写本次审核的意见。
      </p>


      <textarea
        id="reviewNote"
        class="review-note"
        maxlength="1000"
        placeholder="请输入审核意见，例如：申请资料不完整。"
      ></textarea>


      <div class="modal-actions">

        <button
          class="action-button cancel-button"
          id="cancelRejectButton"
        >
          取消
        </button>


        <button
          class="action-button reject-button"
          id="confirmRejectButton"
        >
          确认驳回
        </button>

      </div>

    </div>

  </div>

</div>


<script src="../api-client.js?v=20261005"></script>
<script>

  /* =========================================================
     基础设置
  ========================================================= */

  const API_BASE =
    window.AXNEWS_API_BASE;


  /* =========================================================
     登录 Token
  ========================================================= */

  function getAuthToken() {

    return (
      localStorage.getItem("axnews_admin_token") ||
      localStorage.getItem("AXNEWS_ADMIN_TOKEN") ||
      localStorage.getItem("adminToken") ||
      ""
    );

  }


  function saveAuthToken(token) {

    localStorage.setItem(
      "axnews_admin_token",
      token
    );

  }


  function clearAuthToken() {

    localStorage.removeItem(
      "axnews_admin_token"
    );

    localStorage.removeItem(
      "AXNEWS_ADMIN_TOKEN"
    );

    localStorage.removeItem(
      "adminToken"
    );

  }


  /* =========================================================
     全局状态
  ========================================================= */

  let applications = [];

  let currentFilter = "all";

  let rejectApplicationId = null;


  /* =========================================================
     DOM
  ========================================================= */

  const loginPage =
    document.getElementById("loginPage");

  const adminMain =
    document.getElementById("adminMain");

  const adminPassword =
    document.getElementById("adminPassword");

  const loginButton =
    document.getElementById("loginButton");

  const loginStatus =
    document.getElementById("loginStatus");

  const logoutButton =
    document.getElementById("logoutButton");


  const applicationsContainer =
    document.getElementById("applications");

  const totalCount =
    document.getElementById("totalCount");

  const pendingCount =
    document.getElementById("pendingCount");

  const processedCount =
    document.getElementById("processedCount");

  const refreshButton =
    document.getElementById("refreshButton");

  const rejectModal =
    document.getElementById("rejectModal");

  const reviewNote =
    document.getElementById("reviewNote");

  const confirmRejectButton =
    document.getElementById("confirmRejectButton");


  /* =========================================================
     登录状态 UI
  ========================================================= */

  function showLoginPage() {

    loginPage.style.display = "flex";

    adminMain.classList.remove("show");

    logoutButton.style.display = "none";

  }


  function showAdminPage() {

    loginPage.style.display = "none";

    adminMain.classList.add("show");

    logoutButton.style.display = "block";

  }


  function showLoginStatus(message, type = "") {

    loginStatus.textContent =
      message;

    loginStatus.className =
      "login-status" +
      (type ? " " + type : "");

  }


  /* =========================================================
     登录
  ========================================================= */

  async function login() {

    const password =
      adminPassword.value.trim();


    if (!password) {

      showLoginStatus(
        "❌ 请输入管理员密码。",
        "error"
      );

      adminPassword.focus();

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "⏳ 登录中……";


    showLoginStatus("");


    try {

      const response =
        await axieApiFetch(
          API_BASE + "/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              password: password
            })
          }
        );


      let result = null;


      try {

        result =
          await response.json();

      } catch {

        result = null;

      }


      if (
        !response.ok ||
        !result?.success
      ) {

        throw new Error(
          result?.error ||
          `登录失败（HTTP ${response.status}）`
        );

      }


      if (!result.token) {

        throw new Error(
          "服务器没有返回登录凭证。"
        );

      }


      /*
       * 保存 Token
       */

      saveAuthToken(
        result.token
      );


      /*
       * 清空密码
       */

      adminPassword.value = "";


      /*
       * 显示后台
       */

      showAdminPage();


      /*
       * 读取候选人申请
       */

      await loadApplications();


    } catch (error) {

      console.error(error);

      clearAuthToken();

      showLoginPage();

      showLoginStatus(
        "❌ " + error.message,
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "🔓 登录管理系统";

    }

  }


  /* =========================================================
     登出
  ========================================================= */

  function logout() {

    clearAuthToken();

    applications = [];

    currentFilter = "all";

    showLoginPage();

    showLoginStatus(
      "已退出登录。",
      "success"
    );

  }


  loginButton.addEventListener(
    "click",
    login
  );


  adminPassword.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        login();
      }

    }
  );


  logoutButton.addEventListener(
    "click",
    logout
  );


  /* =========================================================
     HTML 转义
  ========================================================= */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     日期格式
  ========================================================= */

  function formatAxieDateTime(value) {

    if (!value) {
      return "—";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }


    const year =
      date.getFullYear();


    const axieYear =
      year - 2023;


    const yearText =
      axieYear === 1
        ? "阿谢元年"
        : `阿谢${axieYear}年`;


    const month =
      String(
        date.getMonth() + 1
      ).padStart(2, "0");


    const day =
      String(
        date.getDate()
      ).padStart(2, "0");


    const hour =
      String(
        date.getHours()
      ).padStart(2, "0");


    const minute =
      String(
        date.getMinutes()
      ).padStart(2, "0");


    return (
      `${yearText}${month}月${day}日 ${hour}:${minute}`
    );

  }


  /* =========================================================
     状态
  ========================================================= */

  function getStatusText(status) {

    switch (status) {

      case "pending":
        return "待审核";

      case "approved":
        return "已批准";

      case "rejected":
        return "已驳回";

      default:
        return status || "未知";

    }

  }


  function getStatusClass(status) {

    switch (status) {

      case "approved":
        return "status-approved";

      case "rejected":
        return "status-rejected";

      default:
        return "status-pending";

    }

  }


  function getPositionText(position) {

    if (
      position === "president"
    ) {
      return "总统候选人";
    }


    if (
      position === "vicePresident"
    ) {
      return "副总统候选人";
    }


    return position || "未知职位";

  }


  /* =========================================================
     获取申请
  ========================================================= */

  async function loadApplications() {

    const token =
      getAuthToken();


    if (!token) {

      showLoginPage();

      return;

    }


    applicationsContainer.innerHTML = `
      <div class="message">
        正在读取候选人申请……
      </div>
    `;


    try {

      const response =
        await axieApiFetch(
          `${API_BASE}/candidate-applications`,
          {
            method: "GET",

            headers: {
              "Authorization":
                `Bearer ${token}`
            },

            cache: "no-store"
          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        data = null;

      }


      if (!response.ok) {

        if (
          response.status === 401
        ) {

          clearAuthToken();

          showLoginPage();

          showLoginStatus(
            "登录凭证已失效，请重新登录。",
            "error"
          );

          return;

        }


        throw new Error(
          data?.error ||
          `请求失败（HTTP ${response.status}）`
        );

      }


      /*
       * Worker 返回：
       *
       * {
       *   applications: [...]
       * }
       */

      applications =
        Array.isArray(
          data?.applications
        )
          ? data.applications
          : [];


      sortApplications();

      updateStatistics();

      renderApplications();


    } catch (error) {

      console.error(error);


      applicationsContainer.innerHTML = `
        <div class="message error-message">
          <strong>申请加载失败</strong>
          ${escapeHtml(error.message)}
        </div>
      `;

    }

  }


  /* =========================================================
     排序
  ========================================================= */

  function sortApplications() {

    applications.sort(
      (a, b) => {

        const aTime =
          new Date(
            a.submittedAt || 0
          ).getTime();


        const bTime =
          new Date(
            b.submittedAt || 0
          ).getTime();


        return bTime - aTime;

      }
    );

  }


  /* =========================================================
     统计
  ========================================================= */

  function updateStatistics() {

    const total =
      applications.length;


    const pending =
      applications.filter(
        app =>
          app.status === "pending"
      ).length;


    const processed =
      total - pending;


    totalCount.textContent =
      total;


    pendingCount.textContent =
      pending;


    processedCount.textContent =
      processed;

  }


  /* =========================================================
     过滤
  ========================================================= */

  function getFilteredApplications() {

    if (
      currentFilter === "all"
    ) {
      return applications;
    }


    return applications.filter(
      app =>
        app.status === currentFilter
    );

  }


  /* =========================================================
     渲染
  ========================================================= */

  function renderApplications() {

    const list =
      getFilteredApplications();


    if (!list.length) {

      let text =
        "目前没有申请记录。";


      if (
        currentFilter === "pending"
      ) {
        text =
          "目前没有待审核申请。";
      }


      if (
        currentFilter === "approved"
      ) {
        text =
          "目前没有已批准申请。";
      }


      if (
        currentFilter === "rejected"
      ) {
        text =
          "目前没有已驳回申请。";
      }


      applicationsContainer.innerHTML = `
        <div class="message">
          <strong>没有申请</strong>
          ${text}
        </div>
      `;

      return;

    }


    applicationsContainer.innerHTML =
      list
        .map(
          renderApplication
        )
        .join("");

  }


  function renderApplication(app) {

    const status =
      app.status || "pending";


    const canReview =
      status === "pending";


    const party =
      app.partyName ||
      "未填写";


    const englishName =
      app.englishName ||
      "—";


    const japaneseName =
      app.japaneseName ||
      "—";


    const photo =
      app.photo ||
      "未提供";


    const reviewNoteText =
      app.reviewNote ||
      "";


    return `

      <article
        class="application-card"
        data-application-id="${escapeHtml(app.applicationId)}"
      >

        <div class="application-header">

          <div class="application-main">

            <div class="application-name">
              ${escapeHtml(
                app.name ||
                "未填写姓名"
              )}
            </div>


            <div class="application-en">
              ${escapeHtml(
                englishName
              )}
            </div>


            <div class="application-id">
              ${escapeHtml(
                app.applicationId ||
                "无申请编号"
              )}
            </div>

          </div>


          <div>

            <span
              class="status-badge ${getStatusClass(status)}"
            >
              ${getStatusText(status)}
            </span>

          </div>

        </div>


        <div class="application-body">

          <div class="info-grid">


            <div class="info-item">

              <div class="info-label">
                参选职位
              </div>

              <div class="info-value">
                ${escapeHtml(
                  getPositionText(
                    app.position
                  )
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                选举
              </div>

              <div class="info-value">
                ${escapeHtml(
                  app.electionId ||
                  "—"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                中文姓名
              </div>

              <div class="info-value">
                ${escapeHtml(
                  app.name ||
                  "—"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                日本語氏名
              </div>

              <div class="info-value">
                ${escapeHtml(
                  japaneseName
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                政党
              </div>

              <div class="info-value">
                ${escapeHtml(
                  party
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                照片
              </div>

              <div class="info-value">
                ${escapeHtml(
                  photo
                )}
              </div>

            </div>


            <div
              class="info-item full-width"
            >

              <div class="info-label">
                候选人简介
              </div>

              <div
                class="info-value text-box"
              >
                ${escapeHtml(
                  app.introduction ||
                  "未填写"
                )}
              </div>

            </div>


            <div
              class="info-item full-width"
            >

              <div class="info-label">
                竞选声明
              </div>

              <div
                class="info-value text-box"
              >
                ${escapeHtml(
                  app.campaignStatement ||
                  "未填写"
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                提交时间
              </div>

              <div class="info-value">
                ${escapeHtml(
                  formatAxieDateTime(
                    app.submittedAt
                  )
                )}
              </div>

            </div>


            ${
              status !== "pending"
                ? `
                  <div class="info-item">

                    <div class="info-label">
                      审核时间
                    </div>

                    <div class="info-value">
                      ${escapeHtml(
                        formatAxieDateTime(
                          app.reviewedAt
                        )
                      )}
                    </div>

                  </div>
                `
                : ""
            }


            ${
              reviewNoteText
                ? `
                  <div
                    class="info-item full-width"
                  >

                    <div class="info-label">
                      审核意见
                    </div>

                    <div
                      class="info-value text-box"
                    >
                      ${escapeHtml(
                        reviewNoteText
                      )}
                    </div>

                  </div>
                `
                : ""
            }

          </div>

        </div>


        ${
          canReview
            ? `
              <div
                class="application-actions"
              >

                <button
                  class="action-button approve-button"
                  onclick="approveApplication('${escapeHtml(app.applicationId)}')"
                >
                  ✓ 批准申请
                </button>


                <button
                  class="action-button reject-button"
                  onclick="openRejectModal('${escapeHtml(app.applicationId)}')"
                >
                  ✕ 驳回申请
                </button>

              </div>
            `
            : `
              <div
                class="application-actions"
              >

                <span
                  style="
                    color:#78859a;
                    font-size:13px;
                  "
                >
                  此申请已经完成审核。
                </span>

              </div>
            `
        }

      </article>

    `;

  }


  /* =========================================================
     批准申请
  ========================================================= */

  async function approveApplication(
    applicationId
  ) {

    const app =
      applications.find(
        item =>
          item.applicationId ===
          applicationId
      );


    if (!app) {

      alert(
        "找不到该申请。"
      );

      return;

    }


    if (
      app.status !== "pending"
    ) {

      alert(
        "该申请已经完成审核。"
      );

      return;

    }


    const confirmed =
      confirm(
        `确定批准 ${app.name || "该候选人"} 的参选申请吗？\n\n批准后，系统将把该申请正式加入候选人名单。`
      );


    if (!confirmed) {
      return;
    }


    const token =
      getAuthToken();


    if (!token) {

      alert(
        "登录已失效，请重新登录。"
      );

      showLoginPage();

      return;

    }


    const card =
      document.querySelector(
        `[data-application-id="${CSS.escape(applicationId)}"]`
      );


    const buttons =
      card
        ? card.querySelectorAll("button")
        : [];


    buttons.forEach(
      button =>
        button.disabled = true
    );


    try {

      const response =
        await axieApiFetch(
          `${API_BASE}/candidate-applications/${encodeURIComponent(applicationId)}/review`,
          {
            method: "POST",

            headers: {

              "Authorization":
                `Bearer ${token}`,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              status:
                "approved",

              reviewNote:
                "申请审核通过"

            })

          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        data = null;

      }


      if (
        !response.ok
      ) {

        if (
          response.status === 401
        ) {

          clearAuthToken();

          showLoginPage();

          showLoginStatus(
            "登录凭证已失效，请重新登录。",
            "error"
          );

          return;

        }


        throw new Error(
          data?.error ||
          `批准失败（HTTP ${response.status}）`
        );

      }


      await loadApplications();


      alert(
        data?.created
          ? `申请已批准。\n正式候选人编号：${data.created.candidateId}`
          : "申请已批准。"
      );


    } catch (error) {

      console.error(error);


      alert(
        `批准失败：\n${error.message}`
      );


      buttons.forEach(
        button =>
          button.disabled = false
      );

    }

  }


  /* =========================================================
     驳回 Modal
  ========================================================= */

  function openRejectModal(
    applicationId
  ) {

    const app =
      applications.find(
        item =>
          item.applicationId ===
          applicationId
      );


    if (!app) {

      alert(
        "找不到该申请。"
      );

      return;

    }


    if (
      app.status !== "pending"
    ) {

      alert(
        "该申请已经完成审核。"
      );

      return;

    }


    rejectApplicationId =
      applicationId;


    reviewNote.value = "";


    document.getElementById(
      "rejectDescription"
    ).textContent =
      `正在驳回 ${app.name || "该候选人"} 的参选申请。建议填写明确的审核意见。`;


    rejectModal.classList.add(
      "show"
    );


    setTimeout(
      () => {
        reviewNote.focus();
      },
      50
    );

  }


  function closeRejectModal() {

    rejectModal.classList.remove(
      "show"
    );


    rejectApplicationId =
      null;


    reviewNote.value = "";

  }


  /* =========================================================
     确认驳回
  ========================================================= */

  async function rejectApplication() {

    if (
      !rejectApplicationId
    ) {
      return;
    }


    const note =
      reviewNote.value.trim();


    if (!note) {

      alert(
        "请先填写驳回理由。"
      );

      reviewNote.focus();

      return;

    }


    const token =
      getAuthToken();


    if (!token) {

      alert(
        "登录已失效，请重新登录。"
      );

      showLoginPage();

      return;

    }


    confirmRejectButton.disabled =
      true;


    confirmRejectButton.textContent =
      "正在提交……";


    try {

      const response =
        await axieApiFetch(
          `${API_BASE}/candidate-applications/${encodeURIComponent(rejectApplicationId)}/review`,
          {
            method: "POST",

            headers: {

              "Authorization":
                `Bearer ${token}`,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              status:
                "rejected",

              reviewNote:
                note

            })

          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        data = null;

      }


      if (
        !response.ok
      ) {

        if (
          response.status === 401
        ) {

          clearAuthToken();

          closeRejectModal();

          showLoginPage();

          showLoginStatus(
            "登录凭证已失效，请重新登录。",
            "error"
          );

          return;

        }


        throw new Error(
          data?.error ||
          `驳回失败（HTTP ${response.status}）`
        );

      }


      closeRejectModal();


      await loadApplications();


      alert(
        "申请已经驳回。"
      );


    } catch (error) {

      console.error(error);


      alert(
        `驳回失败：\n${error.message}`
      );

    } finally {

      confirmRejectButton.disabled =
        false;

      confirmRejectButton.textContent =
        "确认驳回";

    }

  }


  /* =========================================================
     筛选按钮
  ========================================================= */

  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".filter-button"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            renderApplications();

          }
        );

      }
    );


  /* =========================================================
     刷新
  ========================================================= */

  refreshButton.addEventListener(
    "click",
    async () => {

      refreshButton.disabled =
        true;


      refreshButton.textContent =
        "正在刷新……";


      await loadApplications();


      refreshButton.disabled =
        false;


      refreshButton.textContent =
        "↻ 刷新申请";

    }
  );


  /* =========================================================
     Modal 控制
  ========================================================= */

  document
    .getElementById(
      "closeModalButton"
    )
    .addEventListener(
      "click",
      closeRejectModal
    );


  document
    .getElementById(
      "cancelRejectButton"
    )
    .addEventListener(
      "click",
      closeRejectModal
    );


  confirmRejectButton.addEventListener(
    "click",
    rejectApplication
  );


  rejectModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        rejectModal
      ) {

        closeRejectModal();

      }

    }
  );


  /* =========================================================
     页面启动
  ========================================================= */

  const existingToken =
    getAuthToken();


  if (existingToken) {

    /*
     * 有旧 Token：
     * 先显示管理页面，
     * 然后验证 Token。
     */

    showAdminPage();

    loadApplications();

  } else {

    /*
     * 没有 Token：
     * 显示登录页面。
     */

    showLoginPage();

  }

</script>
