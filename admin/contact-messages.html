<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#071426">
  <title>网站访客留言 | 阿谢国管理后台</title>
  <style>
    :root{color-scheme:dark;--bg:#071426;--panel:rgba(14,35,62,.94);--panel2:rgba(5,18,34,.78);--line:rgba(150,190,230,.15);--text:#eef5ff;--muted:#9fb2ca;--blue:#75b5ff;--mint:#67d6ae;--amber:#f2c26b;--red:#ff9292}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 50% -25%,#17365b,transparent 55%),linear-gradient(145deg,#061120,#0b1f3a 55%,#102b4c)}
    button,input,textarea{font:inherit}button{color:inherit}.shell{width:min(1250px,calc(100% - 32px));margin:auto;padding:22px 0 34px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand h1{margin:0;font-size:clamp(20px,3vw,27px)}.brand p{margin:5px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid rgba(117,181,255,.22);border-radius:10px;padding:9px 13px;background:rgba(102,157,219,.13);color:#dcecff;text-decoration:none;cursor:pointer}.button:hover{background:rgba(117,181,255,.24)}.button.primary{border-color:rgba(103,214,174,.3);background:linear-gradient(130deg,#287d78,#3174ad);font-weight:700}.button:disabled{opacity:.55;cursor:wait}
    .panel{border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:0 18px 55px rgba(0,0,0,.24)}.login{width:min(430px,100%);margin:9vh auto;padding:24px}.login h2{margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.login label{display:block;margin:18px 0 7px;font-size:13px}input,textarea{width:100%;border:1px solid rgba(170,200,230,.24);border-radius:10px;padding:11px 13px;color:var(--text);background:var(--panel2);outline:none}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(117,181,255,.13)}.login input{margin-bottom:12px}.error{min-height:22px;color:var(--red);font-size:13px}
    #workspace{display:none}.inbox{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);min-height:min(720px,calc(100vh - 120px));overflow:hidden}.list{border-right:1px solid var(--line);min-width:0}.list-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}.list-head h2{margin:0;font-size:16px}.list-items{max-height:calc(100vh - 190px);overflow:auto}.conversation{display:block;width:100%;padding:14px 15px;border:0;border-bottom:1px solid rgba(150,190,230,.09);text-align:left;color:inherit;background:transparent;cursor:pointer}.conversation:hover,.conversation.active{background:rgba(79,195,255,.09)}.conversation.active{box-shadow:inset 3px 0 var(--blue)}.conv-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;font-weight:700}.conv-preview{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conv-time{margin-top:6px;color:#7186a0;font-size:10px}.badge{border-radius:999px;padding:4px 7px;color:#ffdc98;background:rgba(242,194,107,.12);font-size:10px;white-space:nowrap}.badge.closed{color:#9db2ca;background:rgba(150,190,230,.1)}.thread{display:flex;min-width:0;min-height:0;flex-direction:column}.thread-head{padding:16px 18px;border-bottom:1px solid var(--line)}.thread-head h2{margin:0;font-size:17px}.thread-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.thread-messages{display:flex;flex:1;min-height:300px;max-height:calc(100vh - 295px);flex-direction:column;gap:12px;overflow:auto;padding:18px}.empty{margin:auto;color:var(--muted);text-align:center;line-height:1.7}.bubble{max-width:min(82%,650px);align-self:flex-start;padding:11px 13px;border:1px solid rgba(150,190,230,.14);border-radius:13px 13px 13px 4px;background:rgba(255,255,255,.055);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.admin{align-self:flex-end;border-color:rgba(103,214,174,.22);border-radius:13px 13px 4px 13px;background:rgba(39,116,104,.25)}.bubble time{display:block;margin-top:5px;color:#8498b1;font-size:10px}.reply{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:14px 16px;border-top:1px solid var(--line)}.reply textarea{min-height:52px;max-height:150px;resize:vertical;line-height:1.55}.reply button{min-width:88px}.status{min-height:18px;padding:0 17px 10px;color:var(--muted);font-size:12px}.hidden{display:none!important}.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-width:760px){.shell{width:calc(100% - 20px);padding-top:14px}.inbox{grid-template-columns:1fr;min-height:calc(100vh - 145px)}.list{border-right:0;border-bottom:1px solid var(--line)}.list-items{display:flex;max-height:195px;overflow:auto}.conversation{min-width:220px;border-right:1px solid rgba(150,190,230,.09)}.thread-messages{min-height:250px;max-height:calc(100vh - 470px)}.topbar{align-items:flex-start}.brand p{max-width:210px}.actions{justify-content:flex-end}.actions .button{font-size:12px;padding:8px 10px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><h1>💬 网站访客留言</h1><p>Republic of Axie · 管理员对话收件箱</p></div>
      <div class="actions"><a class="button" href="index.html">返回管理首页</a><button class="button hidden" id="logout" type="button">退出登录</button></div>
    </header>
    <section class="panel login" id="loginView">
      <h2>管理员登录</h2><p class="muted">使用阿谢国管理后台管理员密码登录。登录凭证仅保存在当前标签页。</p>
      <form id="loginForm"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required><button class="button primary" id="loginButton" type="submit">登录并查看留言</button></form>
      <p class="error" id="loginError" role="status"></p>
    </section>
    <section id="workspace" class="panel inbox" aria-label="访客留言收件箱">
      <aside class="list"><div class="list-head"><h2>对话列表 <span id="count"></span></h2><button class="button" id="refresh" type="button">刷新</button></div><div class="list-items" id="conversationList"><p class="empty">正在读取对话…</p></div></aside>
      <section class="thread"><header class="thread-head"><h2 id="threadTitle">选择一段对话</h2><p id="threadSubtitle">访客发送的消息会显示在这里。</p></header><div class="thread-messages" id="threadMessages"><p class="empty">选择左侧对话，直接向访客回复。</p></div><p class="status" id="threadStatus" role="status"></p><form class="reply" id="replyForm"><label class="visually-hidden" for="replyText">回复内容</label><textarea id="replyText" maxlength="2000" placeholder="输入回复…" required disabled></textarea><button class="button primary" id="replyButton" type="submit" disabled>发送回复</button></form></section>
    </section>
  </main>
  <script>
  (()=>{
    const API="https://axie-citizens-admin-api.axie999666.workers.dev";const TOKEN_KEY="axieCitizensAdminToken";const $=id=>document.getElementById(id);
    const state={token:sessionStorage.getItem(TOKEN_KEY)||"",conversations:[],selected:"",messageIds:new Set(),loading:false};
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const time=value=>new Intl.DateTimeFormat("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(value));
    async function api(path,options={}){const headers=new Headers(options.headers||{});headers.set("Accept","application/json");if(state.token)headers.set("Authorization",`Bearer ${state.token}`);if(options.body)headers.set("Content-Type","application/json");let response;try{response=await fetch(`${API}${path}`,{...options,headers,cache:"no-store"})}catch{throw new Error("无法连接管理服务，请检查网络后重试。")}const data=await response.json().catch(()=>({}));if(response.status===401&&path!=="/api/auth/login"){signOut(false);throw new Error("登录已过期，请重新登录。")}if(!response.ok)throw new Error(data.error||`请求失败 (${response.status})`);return data}
    function showWorkspace(){ $("loginView").classList.add("hidden");$("workspace").style.display="grid";$("logout").classList.remove("hidden"); }
    function signOut(callApi=true){const token=state.token;state.token="";sessionStorage.removeItem(TOKEN_KEY);$("workspace").style.display="none";$("loginView").classList.remove("hidden");$("logout").classList.add("hidden");if(callApi&&token)fetch(`${API}/api/auth/logout`,{method:"POST",headers:{Authorization:`Bearer ${token}`}}).catch(()=>{});}
    function renderList(){const list=$("conversationList");$("count").textContent=`(${state.conversations.length})`;if(!state.conversations.length){list.innerHTML='<p class="empty">还没有访客留言。</p>';return}list.innerHTML=state.conversations.map(c=>`<button class="conversation ${c.id===state.selected?"active":""}" data-id="${esc(c.id)}"><span class="conv-title"><span>${esc(c.visitor_name||"访客")}</span><span class="badge ${c.status==='closed'?'closed':''}">${c.status==='awaiting_admin'?'待回复':c.status==='awaiting_visitor'?'已回复':'已结束'}</span></span><span class="conv-preview">${esc(c.latest_message||"")}</span><span class="conv-time">${time(c.updated_at)}</span></button>`).join("");list.querySelectorAll("[data-id]").forEach(button=>button.addEventListener("click",()=>selectConversation(button.dataset.id)));}
    function renderMessages(messages){const box=$("threadMessages");if(!messages.length){box.innerHTML='<p class="empty">这段对话还没有消息。</p>';return}const hadBottom=box.scrollHeight-box.scrollTop-box.clientHeight<50;box.innerHTML=messages.map(m=>`<div class="bubble ${m.sender==='admin'?'admin':''}">${esc(m.body)}<time>${m.sender==='admin'?'管理员':'访客'} · ${time(m.created_at)}</time></div>`).join("");if(hadBottom)box.scrollTop=box.scrollHeight;}
    async function loadConversations(){if(state.loading)return;state.loading=true;try{const data=await api("/api/admin/contact/conversations");state.conversations=data.conversations||[];renderList();if(state.selected&&!state.conversations.some(c=>c.id===state.selected)){state.selected="";state.messageIds.clear()}if(state.selected)await loadMessages(state.selected);else if(state.conversations.length)await selectConversation(state.conversations[0].id)}catch(error){$("threadStatus").textContent=error.message}finally{state.loading=false}}
    async function loadMessages(id){const data=await api(`/api/admin/contact/conversations/${encodeURIComponent(id)}/messages`);if(id!==state.selected)return;state.messageIds=new Set((data.messages||[]).map(m=>m.id));renderMessages(data.messages||[]);const conversation=state.conversations.find(c=>c.id===id);$("threadTitle").textContent=conversation?.visitor_name||"访客";$("threadSubtitle").textContent=`对话开始于 ${conversation?time(conversation.created_at):""}`;const closed=conversation?.status==="closed";$("replyText").disabled=closed;$("replyButton").disabled=closed;$("threadStatus").textContent=closed?"这段对话已结束。":"访客每 8 秒会收到新消息更新。"}
    async function selectConversation(id){state.selected=id;state.messageIds.clear();renderList();$("threadMessages").innerHTML='<p class="empty">正在加载对话…</p>';$("replyText").disabled=false;$("replyButton").disabled=false;try{await loadMessages(id)}catch(error){$("threadStatus").textContent=error.message}}
    $("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;$("loginError").textContent="";try{const data=await api("/api/auth/login",{method:"POST",body:JSON.stringify({password:$("password").value})});state.token=data.token;sessionStorage.setItem(TOKEN_KEY,state.token);$("password").value="";showWorkspace();await loadConversations()}catch(error){$("loginError").textContent=error.message}finally{$("loginButton").disabled=false}});
    $("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!state.selected)return;const message=$("replyText").value.trim();if(!message)return;$("replyButton").disabled=true;try{await api(`/api/admin/contact/conversations/${encodeURIComponent(state.selected)}/messages`,{method:"POST",body:JSON.stringify({message})});$("replyText").value="";await loadConversations()}catch(error){$("threadStatus").textContent=error.message}finally{$("replyButton").disabled=false}});
    $("refresh").addEventListener("click",loadConversations);$("logout").addEventListener("click",()=>signOut());
    if(state.token){api("/api/auth/me").then(()=>{showWorkspace();loadConversations()}).catch(()=>signOut(false))}
    window.setInterval(()=>{if(state.token&&!document.hidden)loadConversations()},8000);
  })();
  </script>
</body>
</html>
