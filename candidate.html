<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>候选人资料 | Republic of Axie</title>

  <meta
    name="description"
    content="阿谢国官方候选人资料"
  >

  <link
    rel="icon"
    href="/ROA_flag.png"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #071421 0%,
          #0b1f31 45%,
          #081722 100%
        );

      color: #f2f7fb;

      min-height: 100vh;

    }


    a {

      color: inherit;

      text-decoration: none;

    }


    header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(5, 18, 29, 0.92);

      backdrop-filter: blur(12px);

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.08);

    }


    .nav {

      max-width: 1200px;

      margin: 0 auto;

      padding: 16px 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

    }


    .logo {

      font-size: 20px;

      font-weight: 700;

      letter-spacing: 0.5px;

    }


    .logo span {

      opacity: 0.65;

      font-weight: 400;

    }


    nav {

      display: flex;

      gap: 18px;

      flex-wrap: wrap;

    }


    nav a {

      font-size: 14px;

      opacity: 0.8;

      transition: 0.2s;

    }


    nav a:hover {

      opacity: 1;

    }


    main {

      max-width: 1000px;

      margin: 0 auto;

      padding:
        60px 24px 100px;

    }


    .back-link {

      display: inline-block;

      margin-bottom: 25px;

      font-size: 14px;

      opacity: 0.65;

      transition: 0.2s;

    }


    .back-link:hover {

      opacity: 1;

    }


    .profile-card {

      background:
        rgba(17, 42, 62, 0.78);

      border:
        1px solid
        rgba(126, 203, 255, 0.16);

      border-radius: 24px;

      padding: 34px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.25);

    }


    .profile-top {

      display: grid;

      grid-template-columns:
        220px 1fr;

      gap: 35px;

      align-items: start;

    }


    .photo-wrapper {

      width: 220px;

      height: 270px;

      border-radius: 20px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #173750,
          #0d2235
        );

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color:
        rgba(255, 255, 255, 0.45);

      font-size: 14px;

    }


    .candidate-photo {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    .candidate-number {

      display: inline-block;

      padding: 6px 10px;

      border-radius: 8px;

      background:
        rgba(255, 255, 255, 0.08);

      font-size: 13px;

      margin-bottom: 14px;

    }


    .candidate-name {

      font-size:
        clamp(34px, 6vw, 50px);

      font-weight: 700;

      line-height: 1.15;

      margin-bottom: 8px;

    }


    .candidate-en {

      font-size: 19px;

      opacity: 0.68;

      margin-bottom: 4px;

    }


    .candidate-jp {

      font-size: 15px;

      opacity: 0.45;

      margin-bottom: 20px;

    }


    /* =========================================================
       政党
    ========================================================= */

    .party {

      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding: 8px 12px;

      border-radius: 9px;

      background:
        rgba(126, 203, 255, 0.1);

      color: #bde7ff;

      font-size: 14px;

      margin-bottom: 22px;

    }


    .party-link {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      color: #bde7ff;

      transition:
        color 0.2s,
        opacity 0.2s;

    }


    .party-link:hover {

      color: #ffffff;

      text-decoration: underline;

    }


    .party-arrow {

      opacity: 0.65;

      font-size: 16px;

      transition:
        transform 0.2s,
        opacity 0.2s;

    }


    .party-link:hover .party-arrow {

      transform:
        translateX(3px);

      opacity: 1;

    }


    .party-abbreviation {

      display: inline-block;

      padding:
        2px 6px;

      border-radius: 5px;

      background:
        rgba(255, 255, 255, 0.08);

      font-size: 11px;

      opacity: 0.75;

    }


    .party-fallback {

      opacity: 0.85;

    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;

    }


    .info-item {

      padding: 14px;

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.04);

    }


    .info-label {

      font-size: 12px;

      opacity: 0.45;

      margin-bottom: 6px;

    }


    .info-value {

      font-size: 14px;

      line-height: 1.5;

    }


    .section {

      margin-top: 35px;

      padding-top: 30px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.08);

    }


    .section h2 {

      margin: 0 0 18px;

      font-size: 24px;

    }


    .introduction {

      line-height: 1.9;

      color:
        rgba(255, 255, 255, 0.86);

    }


    .statement {

      line-height: 1.95;

      color:
        rgba(255, 255, 255, 0.78);

      font-size: 15px;

    }


    .status {

      display: inline-block;

      padding: 6px 10px;

      border-radius: 8px;

      background:
        rgba(85, 210, 145, 0.12);

      color: #8ff0ba;

      font-size: 13px;

    }


    .error {

      text-align: center;

      padding: 80px 20px;

      opacity: 0.7;

    }


    .error h1 {

      font-size: 32px;

      margin-bottom: 12px;

    }


    .error p {

      line-height: 1.8;

    }


    .election-link {

      display: inline-block;

      margin-top: 8px;

      color: #9edcff;

    }


    .election-link:hover {

      text-decoration: underline;

    }


    @media (max-width: 700px) {

      .nav {

        padding:
          14px 16px;

      }


      nav {

        gap: 10px;

      }


      main {

        padding:
          40px 16px 70px;

      }


      .profile-card {

        padding: 22px;

        border-radius: 19px;

      }


      .profile-top {

        grid-template-columns: 1fr;

        gap: 25px;

      }


      .photo-wrapper {

        width: 150px;

        height: 190px;

      }


      .info-grid {

        grid-template-columns: 1fr;

      }


      .party {

        max-width: 100%;

      }


      .party-link {

        flex-wrap: wrap;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="nav">

    <a
      href="index.html"
      class="logo"
    >

      Republic of Axie

      <span>
        阿谢国
      </span>

    </a>


    <nav>

      <a href="index.html">
        首页
      </a>

      <a href="constitution.html">
        宪法
      </a>

      <a href="AXNews.html">
        AXNews
      </a>

    </nav>

  </div>

</header>



<main>


  <a
    href="javascript:history.back()"
    class="back-link"
  >
    ← 返回上一页
  </a>


  <div
    id="content"
  >

    <div class="error">

      正在读取候选人资料……

    </div>

  </div>


</main>



<script>


  // ============================================================
  // 阿谢纪年设置
  //
  // 阿谢元年 = 公历 2024 年
  //
  // 因此：
  // 2024 → 阿谢1年
  // 2025 → 阿谢2年
  // 2026 → 阿谢3年
  // 2027 → 阿谢4年
  // ============================================================

  const AXIE_ERA_START_YEAR = 2024;



  // ============================================================
  // HTML 转义
  // ============================================================

  function escapeHTML(value) {

    return String(value ?? "")

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  // ============================================================
  // 换行处理
  // ============================================================

  function formatStatement(value) {

    return escapeHTML(value)

      .replace(
        /\n/g,
        "<br>"
      );

  }



  // ============================================================
  // 阿谢纪年日期格式化
  //
  // JSON / 数据库内部仍使用 ISO 8601：
  //
  // 2026-10-02T00:00:00+09:00
  //
  // 页面显示：
  //
  // 阿谢3年10月2日 00:00
  //
  // 所有面向用户的日期均通过这里转换。
  // ============================================================

  function formatAxieDate(
    dateString,
    options = {}
  ) {

    if (!dateString) {

      return "暂无资料";

    }


    const date =
      new Date(dateString);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "暂无资料";

    }


    // ----------------------------------------------------------
    // 强制使用阿谢国网站统一时区 UTC+9
    // ----------------------------------------------------------

    const parts =
      new Intl.DateTimeFormat(
        "en-US",
        {

          timeZone:
            "Asia/Tokyo",

          year: "numeric",

          month: "numeric",

          day: "numeric",

          hour: "numeric",

          minute: "numeric",

          second: "numeric",

          hour12: false

        }

      ).formatToParts(date);


    const values = {};


    parts.forEach(
      part => {

        values[part.type] =
          part.value;

      }
    );


    const gregorianYear =
      Number(
        values.year
      );


    const axieYear =
      gregorianYear -
      AXIE_ERA_START_YEAR +
      1;


    if (
      !Number.isFinite(
        axieYear
      ) ||
      axieYear < 1
    ) {

      return "暂无资料";

    }


    const month =
      Number(
        values.month
      );


    const day =
      Number(
        values.day
      );


    const hour =
      String(
        values.hour
      ).padStart(
        2,
        "0"
      );


    const minute =
      String(
        values.minute
      ).padStart(
        2,
        "0"
      );


    const second =
      String(
        values.second
      ).padStart(
        2,
        "0"
      );


    // ----------------------------------------------------------
    // 只显示日期
    // ----------------------------------------------------------

    if (
      options.dateOnly === true
    ) {

      return (
        `阿谢${axieYear}年` +
        `${month}月` +
        `${day}日`
      );

    }


    // ----------------------------------------------------------
    // 日期 + 时间，但默认不显示秒
    // ----------------------------------------------------------

    if (
      options.showSeconds === true
    ) {

      return (
        `阿谢${axieYear}年` +
        `${month}月` +
        `${day}日 ` +
        `${hour}:${minute}:${second}`
      );

    }


    return (
      `阿谢${axieYear}年` +
      `${month}月` +
      `${day}日 ` +
      `${hour}:${minute}`
    );

  }



  // ============================================================
  // 获取候选人 ID
  // ============================================================

  function getCandidateId() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    return params.get("id");

  }



  // ============================================================
  // 获取职位名称
  // ============================================================

  function getPositionName(
    position
  ) {

    if (
      position ===
      "president"
    ) {

      return "阿谢国总统";

    }


    if (
      position ===
      "vicePresident"
    ) {

      return "阿谢国副总统";

    }


    return "暂无资料";

  }



  // ============================================================
  // 获取选举资料
  // ============================================================

  function getElectionInfo(
    elections,
    candidate
  ) {

    if (
      !elections
    ) {

      return null;

    }


    if (
      candidate.position ===
      "president"
    ) {

      if (
        elections.president &&
        Array.isArray(
          elections.president.elections
        )
      ) {

        return (
          elections.president.elections.find(
            item =>
              item.electionId ===
              candidate.electionId
          ) || null
        );

      }

    }


    else if (
      candidate.position ===
      "vicePresident"
    ) {

      if (
        elections.vicePresident &&
        Array.isArray(
          elections.vicePresident.elections
        )
      ) {

        return (
          elections.vicePresident.elections.find(
            item =>
              item.electionId ===
              candidate.electionId
          ) || null
        );

      }

    }


    return null;

  }



  // ============================================================
  // 获取政党资料
  // ============================================================

  function getPartyInfo(
    parties,
    candidate
  ) {

    if (
      !parties ||
      !Array.isArray(
        parties.parties
      )
    ) {

      return null;

    }


    if (
      !candidate.partyId
    ) {

      return null;

    }


    return (
      parties.parties.find(
        party =>
          party.partyId ===
          candidate.partyId
      ) || null
    );

  }



  // ============================================================
  // 生成政党 HTML
  // ============================================================

  function renderParty(
    candidate,
    party
  ) {

    // 如果成功找到政党资料

    if (
      party
    ) {

      const partyName =
        party.names?.zh ||
        party.partyName ||
        "未知政党";


      const abbreviation =
        party.abbreviation ||
        "";


      return `

        <div class="party">

          <a
            class="party-link"
            href="party.html?id=${encodeURIComponent(
              party.partyId
            )}"
          >

            <span>
              ${escapeHTML(
                partyName
              )}
            </span>


            ${
              abbreviation
                ?

                `
                  <span
                    class="party-abbreviation"
                  >
                    ${escapeHTML(
                      abbreviation
                    )}
                  </span>
                `

                :

                ""
            }


            <span
              class="party-arrow"
            >
              →
            </span>

          </a>

        </div>

      `;

    }


    // 如果 parties.json 中没有对应政党
    // 则使用 candidates.json 中的备用名称

    return `

      <div class="party">

        <span class="party-fallback">

          ${escapeHTML(
            candidate.partyName ||
            "暂无政党资料"
          )}

        </span>

      </div>

    `;

  }



  // ============================================================
  // 渲染候选人
  // ============================================================

  function renderCandidate(
    candidate,
    election,
    party
  ) {

    const content =
      document.getElementById(
        "content"
      );


    const candidateName =
      candidate.names?.zh ||
      candidate.names?.en ||
      candidate.candidateId ||
      "未知候选人";


    const photo =
      candidate.photo

        ?

        `
          <img
            class="candidate-photo"
            src="${escapeHTML(
              candidate.photo
            )}"
            alt="${escapeHTML(
              candidateName
            )}"
            onerror="
              this.style.display='none';
              this.parentElement.innerHTML='<span>暂无候选人照片</span>';
            "
          >
        `

        :

        `
          <span>
            暂无候选人照片
          </span>
        `;


    const electionName =
      election
        ? election.name
        : "暂无资料";


    const electionPage =
      candidate.position ===
      "president"

        ?

        "president-election.html"

        :

        "vice-president-election.html";


    const partyHTML =
      renderParty(
        candidate,
        party
      );


    content.innerHTML = `

      <article
        class="profile-card"
      >


        <div
          class="profile-top"
        >


          <div
            class="photo-wrapper"
          >

            ${photo}

          </div>



          <div>


            <div
              class="candidate-number"
            >

              候选人编号：
              ${escapeHTML(
                candidate.candidateNo ||
                "暂无资料"
              )}

            </div>



            <div
              class="candidate-name"
            >

              ${escapeHTML(
                candidateName
              )}

            </div>



            <div
              class="candidate-en"
            >

              ${escapeHTML(
                candidate.names?.en ||
                "—"
              )}

            </div>



            <div
              class="candidate-jp"
            >

              ${escapeHTML(
                candidate.names?.ja ||
                "—"
              )}

            </div>



            ${partyHTML}



            <div
              class="info-grid"
            >


              <div
                class="info-item"
              >

                <div
                  class="info-label"
                >
                  参选职位
                </div>

                <div
                  class="info-value"
                >

                  ${escapeHTML(
                    getPositionName(
                      candidate.position
                    )
                  )}

                </div>

              </div>



              <div
                class="info-item"
              >

                <div
                  class="info-label"
                >
                  候选人状态
                </div>

                <div
                  class="info-value"
                >

                  <span
                    class="status"
                  >
                    ${escapeHTML(
                      candidate.status ||
                      "暂无资料"
                    )}
                  </span>

                </div>

              </div>



              <div
                class="info-item"
              >

                <div
                  class="info-label"
                >
                  所属选举
                </div>

                <div
                  class="info-value"
                >

                  <a
                    class="election-link"
                    href="${electionPage}"
                  >

                    ${escapeHTML(
                      electionName
                    )}

                  </a>

                </div>

              </div>



              <div
                class="info-item"
              >

                <div
                  class="info-label"
                >
                  登记时间
                </div>

                <div
                  class="info-value"
                >

                  ${formatAxieDate(
                    candidate.registeredAt
                  )}

                </div>

              </div>


            </div>


          </div>


        </div>



        <section
          class="section"
        >

          <h2>
            候选人简介
          </h2>


          <div
            class="introduction"
          >

            ${escapeHTML(
              candidate.introduction ||
              "暂无候选人简介。"
            )}

          </div>

        </section>



        <section
          class="section"
        >

          <h2>
            候选人声明
          </h2>


          <div
            class="statement"
          >

            ${formatStatement(
              candidate.campaignStatement ||
              "暂无候选人声明。"
            )}

          </div>

        </section>


      </article>

    `;

  }



  // ============================================================
  // 错误页面
  // ============================================================

  function showError(
    title,
    message
  ) {

    document.getElementById(
      "content"
    ).innerHTML = `

      <div class="error">

        <h1>
          ${escapeHTML(
            title
          )}
        </h1>

        <p>
          ${escapeHTML(
            message
          )}
        </p>

      </div>

    `;

  }



  // ============================================================
  // 主加载函数
  // ============================================================

  async function loadCandidate() {

    try {


      const candidateId =
        getCandidateId();


      if (!candidateId) {

        showError(
          "未指定候选人",
          "请通过有效的候选人资料链接访问本页面。"
        );

        return;

      }



      // ========================================================
      // 同时读取三个数据文件
      // ========================================================

      const [
        candidateResponse,
        electionResponse,
        partyResponse
      ] = await Promise.all([

        fetch(
          "./data/candidates.json",
          {
            cache: "no-store"
          }
        ),

        fetch(
          "./data/elections.json",
          {
            cache: "no-store"
          }
        ),

        fetch(
          "./data/parties.json",
          {
            cache: "no-store"
          }
        )

      ]);



      // ========================================================
      // candidates.json 必须正常
      // ========================================================

      if (
        !candidateResponse.ok
      ) {

        throw new Error(
          "无法读取 candidates.json"
        );

      }



      // ========================================================
      // elections.json 必须正常
      // ========================================================

      if (
        !electionResponse.ok
      ) {

        throw new Error(
          "无法读取 elections.json"
        );

      }



      // ========================================================
      // 读取候选人资料
      // ========================================================

      const candidateData =
        await candidateResponse.json();


      // ========================================================
      // 读取选举资料
      // ========================================================

      const electionData =
        await electionResponse.json();


      // ========================================================
      // 读取政党资料
      //
      // 如果 parties.json 暂时不可用，
      // 候选人页面仍然可以正常显示。
      // ========================================================

      let partyData =
        null;


      if (
        partyResponse.ok
      ) {

        try {

          partyData =
            await partyResponse.json();

        }

        catch (
          partyJSONError
        ) {

          console.warn(
            "无法解析 parties.json：",
            partyJSONError
          );

        }

      }

      else {

        console.warn(
          "无法读取 parties.json"
        );

      }



      // ========================================================
      // 查找候选人
      // ========================================================

      if (
        !candidateData ||
        !Array.isArray(
          candidateData.candidates
        )
      ) {

        throw new Error(
          "candidates.json 数据格式错误"
        );

      }


      const candidate =
        candidateData.candidates.find(
          item =>
            item.candidateId ===
            candidateId
        );



      if (!candidate) {

        showError(
          "找不到候选人",
          "该候选人不存在，或者候选人资料已经发生变化。"
        );

        return;

      }



      // ========================================================
      // 查找选举
      // ========================================================

      const election =
        getElectionInfo(
          electionData,
          candidate
        );



      // ========================================================
      // 查找政党
      // ========================================================

      const party =
        getPartyInfo(
          partyData,
          candidate
        );



      // ========================================================
      // 渲染页面
      // ========================================================

      renderCandidate(
        candidate,
        election,
        party
      );


      // ========================================================
      // 修改网页标题
      // ========================================================

      document.title =
        `${candidate.names?.zh || candidate.candidateId}｜候选人资料 | Republic of Axie`;

    }


    catch (error) {

      console.error(
        "Candidate page error:",
        error
      );


      showError(
        "资料读取失败",
        "无法读取候选人资料，请检查数据文件是否正确，或稍后再试。"
      );

    }

  }



  // ============================================================
  // 启动
  // ============================================================

  loadCandidate();

</script>
