<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>选举结果 | Republic of Axie</title>

  <meta
    name="description"
    content="阿谢国选举结果及候选人资料"
  >

  <link
    rel="icon"
    href="/ROA_flag.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f7fb;

      color: #172033;

      line-height: 1.7;

    }


    /* =========================================================
       Header
    ========================================================= */

    header {

      background: #0b1f3a;

      color: white;

      padding: 22px 20px;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.12);

    }


    .header-inner {

      max-width: 1100px;

      margin: auto;

      display: flex;

      align-items: center;

      gap: 15px;

    }


    .flag {

      width: 52px;

      height: 35px;

      object-fit: cover;

      border-radius: 4px;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.25);

    }


    .site-title {

      margin: 0;

      font-size: 22px;

      font-weight: 700;

    }


    .site-subtitle {

      margin: 2px 0 0;

      font-size: 13px;

      opacity: 0.75;

    }


    /* =========================================================
       Main
    ========================================================= */

    main {

      max-width: 1100px;

      margin: 45px auto;

      padding: 0 20px;

    }


    .back-link {

      display: inline-block;

      margin-bottom: 22px;

      color: #1557a6;

      text-decoration: none;

      font-size: 14px;

    }


    .back-link:hover {

      text-decoration: underline;

    }


    /* =========================================================
       Title
    ========================================================= */

    .page-title {

      margin-bottom: 30px;

    }


    .page-title h1 {

      margin: 0 0 6px;

      font-size: 32px;

      color: #102a4c;

    }


    .page-title p {

      margin: 0;

      color: #6b7789;

      font-size: 14px;

    }


    /* =========================================================
       Cards
    ========================================================= */

    .card {

      background: white;

      border-radius: 15px;

      padding: 26px 28px;

      margin-bottom: 22px;

      box-shadow:
        0 7px 25px rgba(20, 45, 80, 0.07);

    }


    .card-title {

      margin: 0 0 18px;

      font-size: 21px;

      color: #102a4c;

    }


    /* =========================================================
       Election Info
    ========================================================= */

    .election-info {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 13px;

    }


    .info-item {

      background: #f7f9fc;

      border-radius: 9px;

      padding: 13px 15px;

    }


    .info-label {

      color: #7b8798;

      font-size: 11px;

      margin-bottom: 3px;

    }


    .info-value {

      color: #33435a;

      font-size: 13px;

      font-weight: 600;

    }


    /* =========================================================
       Status
    ========================================================= */

    .status {

      display: inline-block;

      padding: 6px 13px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 600;

    }


    .status-not-started {

      background: #e9f1fb;

      color: #1557a6;

    }


    .status-counting {

      background: #fff4dc;

      color: #956000;

    }


    .status-published {

      background: #e8f6ee;

      color: #18794e;

    }


    .status-unknown {

      background: #eef1f5;

      color: #596577;

    }


    /* =========================================================
       Result Notice
    ========================================================= */

    .result-notice {

      padding: 22px;

      border-radius: 12px;

      background: #f7f9fc;

      border: 1px solid #e2e7ef;

      color: #5f6d80;

    }


    .result-notice strong {

      display: block;

      margin-bottom: 5px;

      color: #26364d;

      font-size: 16px;

    }


    /* =========================================================
       Winner
    ========================================================= */

    .winner-card {

      border: 1px solid #dfe7f1;

      background:
        linear-gradient(
          135deg,
          #f8fbff,
          #ffffff
        );

    }


    .winner-label {

      color: #728096;

      font-size: 12px;

      margin-bottom: 5px;

    }


    .winner-name {

      font-size: 26px;

      font-weight: 700;

      color: #102a4c;

    }


    .winner-party {

      color: #617086;

      margin-top: 4px;

    }


    /* =========================================================
       Candidate Result
    ========================================================= */

    .candidate-result {

      display: grid;

      grid-template-columns:
        60px 1fr auto;

      align-items: center;

      gap: 16px;

      padding: 17px 0;

      border-bottom:
        1px solid #edf0f4;

    }


    .candidate-result:last-child {

      border-bottom: none;

    }


    .candidate-number {

      width: 46px;

      height: 46px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 10px;

      background: #eef3f9;

      color: #1557a6;

      font-size: 18px;

      font-weight: 700;

    }


    .candidate-name {

      font-size: 17px;

      font-weight: 700;

      color: #24344b;

    }


    .candidate-party {

      font-size: 13px;

      color: #718096;

      margin-top: 2px;

    }


    .candidate-votes {

      text-align: right;

    }


    .votes-number {

      font-size: 19px;

      font-weight: 700;

      color: #102a4c;

    }


    .votes-percentage {

      font-size: 12px;

      color: #7b8798;

    }


    /* =========================================================
       Links
    ========================================================= */

    .candidate-links {

      margin-top: 5px;

      font-size: 12px;

    }


    .candidate-links a {

      color: #1557a6;

      text-decoration: none;

      margin-right: 10px;

    }


    .candidate-links a:hover {

      text-decoration: underline;

    }


    /* =========================================================
       Error
    ========================================================= */

    .error-card {

      background: white;

      border-radius: 16px;

      padding: 55px 30px;

      text-align: center;

      box-shadow:
        0 8px 30px rgba(20, 45, 80, 0.06);

    }


    .error-card h1 {

      margin: 0 0 10px;

      color: #102a4c;

    }


    .error-card p {

      margin: 0;

      color: #687589;

    }


    /* =========================================================
       Footer
    ========================================================= */

    footer {

      margin-top: 60px;

      padding: 30px 20px;

      background: #0b1f3a;

      color:
        rgba(255, 255, 255, 0.75);

      text-align: center;

      font-size: 13px;

    }


    /* =========================================================
       Responsive
    ========================================================= */

    @media (max-width: 760px) {

      main {

        margin: 30px auto;

      }


      .page-title h1 {

        font-size: 28px;

      }


      .card {

        padding: 22px 20px;

      }


      .election-info {

        grid-template-columns: 1fr;

      }


      .candidate-result {

        grid-template-columns:
          50px 1fr;

      }


      .candidate-votes {

        grid-column: 2;

        text-align: left;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <img
      src="/ROA_flag.png"
      alt="Republic of Axie"
      class="flag"
    >

    <div>

      <h1 class="site-title">
        Republic of Axie
      </h1>

      <p class="site-subtitle">
        阿谢国选举结果
      </p>

    </div>

  </div>

</header>



<main>

  <a
    href="election-history.html"
    class="back-link"
  >
    ← 返回选举历史
  </a>


  <div id="content">

    <div class="error-card">

      <h1>
        正在读取资料
      </h1>

      <p>
        请稍候……
      </p>

    </div>

  </div>

</main>



<footer>

  Republic of Axie · 阿谢国

</footer>



<script>

  /* =========================================================
     基础设置
  ========================================================= */

  const AXIE_ERA_START_YEAR = 2024;


  /* =========================================================
     HTML 转义
  ========================================================= */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     阿谢纪年
  ========================================================= */

  function formatAxieDate(
    isoString,
    includeTime = false
  ) {

    if (!isoString) {

      return "暂无资料";

    }


    const date =
      new Date(
        isoString
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "暂无资料";

    }


    const formatter =
      new Intl.DateTimeFormat(
        "zh-CN",
        {

          timeZone:
            "Asia/Tokyo",

          year:
            "numeric",

          month:
            "numeric",

          day:
            "numeric",

          ...(includeTime
            ? {

                hour:
                  "2-digit",

                minute:
                  "2-digit",

                hour12:
                  false

              }

            : {})

        }
      );


    const parts =
      formatter.formatToParts(
        date
      );


    const values = {};


    for (
      const part of parts
    ) {

      values[part.type] =
        part.value;

    }


    const gregorianYear =
      Number(
        values.year
      );


    const axieYear =
      gregorianYear
      - AXIE_ERA_START_YEAR
      + 1;


    const axieYearText =
      axieYear === 1
        ? "元年"
        : `${axieYear}年`;


    let result =
      `阿谢${axieYearText}${values.month}月${values.day}日`;


    if (includeTime) {

      result +=
        ` ${values.hour}:${values.minute}`;

    }


    return result;

  }


  /* =========================================================
     获取 URL 中的 electionId
  ========================================================= */

  function getElectionId() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    return params.get(
      "id"
    );

  }


  /* =========================================================
     选举状态
  ========================================================= */

  function getResultStatusName(
    status
  ) {

    const names = {

      not_started:
        "尚未开始",

      counting:
        "计票中",

      published:
        "结果已公布"

    };


    return (
      names[status]
      || "暂无结果"
    );

  }


  function getResultStatusClass(
    status
  ) {

    const classes = {

      not_started:
        "status-not-started",

      counting:
        "status-counting",

      published:
        "status-published"

    };


    return (
      classes[status]
      || "status-unknown"
    );

  }


  /* =========================================================
     找选举
  ========================================================= */

  function findElection(
    electionsData,
    electionId
  ) {

    const types = [
      electionsData.president,
      electionsData.vicePresident
    ];


    for (
      const typeData of types
    ) {

      if (
        !typeData
        ||
        !Array.isArray(
          typeData.elections
        )
      ) {

        continue;

      }


      const election =
        typeData.elections.find(
          item =>
            item.electionId
            === electionId
        );


      if (election) {

        return {

          election,
          typeData

        };

      }

    }


    return null;

  }


  /* =========================================================
     找候选人
  ========================================================= */

  function findCandidate(
    candidatesData,
    candidateId
  ) {

    if (
      !candidatesData
      ||
      !Array.isArray(
        candidatesData.candidates
      )
    ) {

      return null;

    }


    return (
      candidatesData.candidates.find(
        candidate =>
          candidate.candidateId
          === candidateId
      )
      || null
    );

  }


  /* =========================================================
     找政党
  ========================================================= */

  function findParty(
    partiesData,
    partyId
  ) {

    if (
      !partiesData
      ||
      !Array.isArray(
        partiesData.parties
      )
    ) {

      return null;

    }


    return (
      partiesData.parties.find(
        party =>
          party.partyId
          === partyId
      )
      || null
    );

  }


  /* =========================================================
     渲染候选人结果
  ========================================================= */

  function renderCandidateResult(
    candidate,
    result
  ) {

    const votes =
      Number(
        result.votes
        || 0
      );


    const percentage =
      Number(
        result.percentage
        || 0
      );


    const partyName =
      candidate.partyName
      || "独立候选人";


    return `

      <div
        class="candidate-result"
      >

        <div
          class="candidate-number"
        >
          ${escapeHTML(
            candidate.candidateNo
            || "-"
          )}
        </div>


        <div>

          <div
            class="candidate-name"
          >
            ${escapeHTML(
              candidate.names?.zh
              || "未命名候选人"
            )}
          </div>


          <div
            class="candidate-party"
          >
            ${escapeHTML(
              partyName
            )}
          </div>


          <div
            class="candidate-links"
          >

            <a
              href="candidate.html?id=${encodeURIComponent(
                candidate.candidateId
              )}"
            >
              候选人资料
            </a>


            ${
              candidate.partyId
                ? `
                  <a
                    href="party.html?id=${encodeURIComponent(
                      candidate.partyId
                    )}"
                  >
                    政党资料
                  </a>
                `
                : ""
            }

          </div>

        </div>


        <div
          class="candidate-votes"
        >

          <div
            class="votes-number"
          >
            ${votes.toLocaleString(
              "zh-CN"
            )} 票
          </div>


          <div
            class="votes-percentage"
          >
            ${percentage.toFixed(
              2
            )}%
          </div>

        </div>

      </div>

    `;

  }


  /* =========================================================
     页面渲染
  ========================================================= */

  function renderPage(
    election,
    typeData,
    result,
    candidatesData,
    partiesData
  ) {

    const resultStatus =
      result
        ? result.status
        : "not_started";


    let resultContent = "";


    /*
     * =======================================================
     * 尚未公布
     * =======================================================
     */

    if (
      resultStatus
      === "not_started"
    ) {

      resultContent = `

        <div
          class="result-notice"
        >

          <strong>
            选举结果尚未公布
          </strong>

          本次选举尚未开始，
          当前没有可公开的计票结果。

        </div>

      `;

    }


    /*
     * =======================================================
     * 计票中
     * =======================================================
     */

    else if (
      resultStatus
      === "counting"
    ) {

      resultContent = `

        <div
          class="result-notice"
        >

          <strong>
            当前正在计票
          </strong>

          本次选举已经结束，
          当前正在进行选票统计和结果确认。

          正式结果将在完成相关程序后公布。

        </div>

      `;

    }


    /*
     * =======================================================
     * 已公布
     * =======================================================
     */

    else if (
      resultStatus
      === "published"
    ) {

      /*
       * 找到当选人
       */

      const winner =
        result.winnerCandidateId
          ? findCandidate(
              candidatesData,
              result.winnerCandidateId
            )
          : null;


      if (winner) {

        resultContent += `

          <div
            class="card winner-card"
          >

            <div
              class="winner-label"
            >
              当选人
            </div>


            <div
              class="winner-name"
            >
              ${escapeHTML(
                winner.names?.zh
                || "未命名候选人"
              )}
            </div>


            <div
              class="winner-party"
            >
              ${escapeHTML(
                winner.partyName
                || "独立候选人"
              )}
            </div>

          </div>

        `;

      }


      /*
       * 总票数
       */

      resultContent += `

        <div
          class="card"
        >

          <h2
            class="card-title"
          >
            选举结果
          </h2>


          <div
            class="election-info"
          >

            <div
              class="info-item"
            >

              <div
                class="info-label"
              >
                总票数
              </div>


              <div
                class="info-value"
              >
                ${
                  result.totalVotes !== null
                    ? Number(
                        result.totalVotes
                      ).toLocaleString(
                        "zh-CN"
                      ) + " 票"
                    : "暂无资料"
                }
              </div>

            </div>


            <div
              class="info-item"
            >

              <div
                class="info-label"
              >
                公布时间
              </div>


              <div
                class="info-value"
              >
                ${formatAxieDate(
                  result.publishedAt,
                  true
                )}
              </div>

            </div>


            <div
              class="info-item"
            >

              <div
                class="info-label"
              >
                结果状态
              </div>


              <div
                class="info-value"
              >
                已正式公布
              </div>

            </div>

          </div>

        </div>

      `;


      /*
       * 候选人票数
       */

      if (
        Array.isArray(
          result.candidateResults
        )
        &&
        result.candidateResults.length
      ) {

        resultContent += `

          <div
            class="card"
          >

            <h2
              class="card-title"
            >
              候选人得票情况
            </h2>

        `;


        for (
          const candidateResult
          of result.candidateResults
        ) {

          const candidate =
            findCandidate(
              candidatesData,
              candidateResult.candidateId
            );


          if (!candidate) {

            continue;

          }


          resultContent +=
            renderCandidateResult(
              candidate,
              candidateResult
            );

        }


        resultContent += `

          </div>

        `;

      }

    }


    /*
     * =======================================================
     * 基本资料
     * =======================================================
     */

    const resultStatusClass =
      getResultStatusClass(
        resultStatus
      );


    const resultStatusName =
      getResultStatusName(
        resultStatus
      );


    const candidateCount =
      candidatesData.candidates
        ? candidatesData.candidates.filter(
            candidate =>
              candidate.electionId
              === election.electionId
          ).length
        : 0;


    return `

      <div
        class="page-title"
      >

        <h1>
          ${escapeHTML(
            election.name
            || "选举"
          )}
        </h1>


        <p>
          ${escapeHTML(
            election.nameEn
            || ""
          )}
        </p>

      </div>



      <div
        class="card"
      >

        <h2
          class="card-title"
        >
          选举基本资料
        </h2>


        <div
          class="election-info"
        >

          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              选举类型
            </div>


            <div
              class="info-value"
            >
              ${escapeHTML(
                typeData.name
                || "暂无资料"
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              选举状态
            </div>


            <div
              class="info-value"
            >
              <span
                class="status ${resultStatusClass}"
              >
                ${escapeHTML(
                  resultStatusName
                )}
              </span>
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              候选人数
            </div>


            <div
              class="info-value"
            >
              ${candidateCount} 人
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              选举开始
            </div>


            <div
              class="info-value"
            >
              ${formatAxieDate(
                election.start
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              选举结束
            </div>


            <div
              class="info-value"
            >
              ${formatAxieDate(
                election.end
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              就职日期
            </div>


            <div
              class="info-value"
            >
              ${formatAxieDate(
                election.inauguration
              )}
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              任期
            </div>


            <div
              class="info-value"
            >
              ${escapeHTML(
                typeData.termYears
                || "-"
              )} 年
            </div>

          </div>


          <div
            class="info-item"
          >

            <div
              class="info-label"
            >
              Election ID
            </div>


            <div
              class="info-value"
            >
              ${escapeHTML(
                election.electionId
              )}
            </div>

          </div>

        </div>

      </div>



      ${resultContent}

    `;

  }


  /* =========================================================
     错误
  ========================================================= */

  function showError(
    message
  ) {

    document.getElementById(
      "content"
    ).innerHTML = `

      <div
        class="error-card"
      >

        <h1>
          无法读取选举资料
        </h1>


        <p>
          ${escapeHTML(
            message
          )}
        </p>

      </div>

    `;

  }


  /* =========================================================
     主程序
  ========================================================= */

  async function loadPage() {

    const electionId =
      getElectionId();


    if (!electionId) {

      showError(
        "未指定 electionId。请从选举历史页面进入具体选举。"
      );

      return;

    }


    try {

      /*
       * 同时读取四个数据文件。
       */

      const [
        electionsResponse,
        candidatesResponse,
        partiesResponse,
        resultsResponse
      ] = await Promise.all([

        fetch(
          "./data/elections.json"
        ),

        fetch(
          "./data/candidates.json"
        ),

        fetch(
          "./data/parties.json"
        ),

        fetch(
          "./data/election-results.json"
        )

      ]);


      if (
        !electionsResponse.ok
      ) {

        throw new Error(
          "无法读取 elections.json"
        );

      }


      if (
        !candidatesResponse.ok
      ) {

        throw new Error(
          "无法读取 candidates.json"
        );

      }


      if (
        !partiesResponse.ok
      ) {

        throw new Error(
          "无法读取 parties.json"
        );

      }


      if (
        !resultsResponse.ok
      ) {

        throw new Error(
          "无法读取 election-results.json"
        );

      }


      const [
        electionsData,
        candidatesData,
        partiesData,
        resultsData
      ] = await Promise.all([

        electionsResponse.json(),

        candidatesResponse.json(),

        partiesResponse.json(),

        resultsResponse.json()

      ]);


      /*
       * 找到具体选举。
       */

      const electionInfo =
        findElection(
          electionsData,
          electionId
        );


      if (!electionInfo) {

        throw new Error(
          `找不到 electionId：${electionId}`
        );

      }


      /*
       * 找到结果记录。
       */

      let result = null;


      if (
        resultsData
        &&
        Array.isArray(
          resultsData.results
        )
      ) {

        result =
          resultsData.results.find(
            item =>
              item.electionId
              === electionId
          )
          || null;

      }


      /*
       * 如果暂时没有结果记录，
       * 默认显示“尚未公布”。
       */

      if (!result) {

        result = {

          electionId,

          status:
            "not_started",

          publishedAt:
            null,

          totalVotes:
            null,

          candidateResults:
            [],

          winnerCandidateId:
            null

        };

      }


      document.getElementById(
        "content"
      ).innerHTML =
        renderPage(

          electionInfo.election,

          electionInfo.typeData,

          result,

          candidatesData,

          partiesData

        );

    }


    catch (error) {

      console.error(
        error
      );


      showError(
        error.message
        || "读取资料时发生未知错误。"
      );

    }

  }


  /* =========================================================
     启动
  ========================================================= */

  loadPage();

</script>


</body>
</html>
