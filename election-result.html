<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>选举结果 | Republic of Axie</title>

  <meta
    name="description"
    content="阿谢国官方选举结果"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #061426 0%,
          #0a1d35 100%
        );

      color: #ffffff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       Header
    ========================= */

    header {
      border-bottom: 1px solid rgba(255,255,255,0.10);
      background: rgba(3, 14, 28, 0.90);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .flag {
      width: 48px;
      height: 32px;
      object-fit: cover;
      border-radius: 5px;

      border: 1px solid rgba(255,255,255,0.18);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: #9fb2c8;
      font-size: 13px;
    }

    /* =========================
       Main
    ========================= */

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 35px 24px 70px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: #9fc7ff;
      font-size: 14px;

      margin-bottom: 25px;
    }

    .back:hover {
      text-decoration: underline;
    }

    /* =========================
       Hero
    ========================= */

    .hero {
      padding: 30px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(21, 59, 101, 0.90),
          rgba(8, 29, 54, 0.95)
        );

      border: 1px solid rgba(255,255,255,0.09);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.22);
    }

    .hero h1 {
      margin: 0;

      font-size: 32px;
      line-height: 1.3;
    }

    .hero-en {
      margin-top: 9px;

      color: #a8bdd4;
      font-size: 15px;
    }

    .election-id {
      margin-top: 16px;

      display: inline-block;

      padding: 6px 10px;

      border-radius: 7px;

      background: rgba(255,255,255,0.07);

      color: #a9bfd7;

      font-size: 12px;
      font-family: monospace;
    }

    /* =========================
       Section
    ========================= */

    .section {
      margin-top: 28px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 16px;

      padding: 25px;
    }

    .section-title {
      margin: 0 0 20px;

      font-size: 21px;
      font-weight: 700;
    }

    /* =========================
       Info Grid
    ========================= */

    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .info-item {
      padding: 16px;

      border-radius: 12px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.055);
    }

    .info-label {
      color: #91a8c0;

      font-size: 13px;

      margin-bottom: 6px;
    }

    .info-value {
      font-size: 15px;

      font-weight: 600;
    }

    /* =========================
       Status
    ========================= */

    .status {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 6px 10px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 600;
    }

    .status-before {
      background: rgba(148,163,184,0.15);
      color: #cbd5e1;
    }

    .status-active {
      background: rgba(34,197,94,0.14);
      color: #86efac;
    }

    .status-ended {
      background: rgba(96,165,250,0.14);
      color: #93c5fd;
    }

    .status-pending {
      background: rgba(234,179,8,0.14);
      color: #fde68a;
    }

    .status-counting {
      background: rgba(249,115,22,0.14);
      color: #fdba74;
    }

    .status-published {
      background: rgba(34,197,94,0.14);
      color: #86efac;
    }

    /* =========================
       Result Notice
    ========================= */

    .result-notice {
      padding: 22px;

      border-radius: 14px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.07);

      text-align: center;
    }

    .result-notice-icon {
      font-size: 34px;

      margin-bottom: 10px;
    }

    .result-notice-title {
      font-size: 20px;

      font-weight: 700;

      margin-bottom: 8px;
    }

    .result-notice-text {
      color: #9fb2c8;

      font-size: 14px;

      line-height: 1.7;
    }

    /* =========================
       Vote Button
    ========================= */

    .vote-area {
      margin-top: 20px;

      text-align: center;
    }

    .vote-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 12px 24px;

      border-radius: 10px;

      background: #1d78d4;

      color: white;

      font-size: 15px;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .vote-button:hover {
      background: #2588eb;
      transform: translateY(-1px);
    }

    .vote-button.disabled {
      background: rgba(255,255,255,0.08);

      color: #8295aa;

      pointer-events: none;
    }

    /* =========================
       Candidates
    ========================= */

    .candidate-list {
      display: grid;

      gap: 14px;
    }

    .candidate-card {
      display: flex;

      align-items: center;

      gap: 16px;

      padding: 18px;

      border-radius: 14px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.07);
    }

    .candidate-number {
      flex: 0 0 46px;

      width: 46px;
      height: 46px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: rgba(50,130,220,0.16);

      color: #a9d1ff;

      font-size: 18px;

      font-weight: 800;
    }

    .candidate-photo {
      width: 68px;
      height: 68px;

      flex: 0 0 68px;

      border-radius: 12px;

      object-fit: cover;

      background: #10243b;

      border: 1px solid rgba(255,255,255,0.08);
    }

    .candidate-info {
      flex: 1;
      min-width: 0;
    }

    .candidate-name {
      font-size: 18px;

      font-weight: 700;
    }

    .candidate-en {
      margin-top: 3px;

      color: #9fb2c8;

      font-size: 13px;
    }

    .candidate-party {
      margin-top: 8px;

      color: #9fc7ff;

      font-size: 13px;
    }

    .candidate-links {
      margin-top: 9px;

      display: flex;

      gap: 12px;

      flex-wrap: wrap;
    }

    .candidate-link {
      color: #82baff;

      font-size: 13px;
    }

    .candidate-link:hover {
      text-decoration: underline;
    }

    /* =========================
       Results
    ========================= */

    .results-list {
      display: grid;

      gap: 14px;
    }

    .result-card {
      padding: 20px;

      border-radius: 14px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.07);
    }

    .result-top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;
    }

    .result-name {
      font-size: 17px;

      font-weight: 700;
    }

    .result-party {
      margin-top: 4px;

      color: #9fb2c8;

      font-size: 13px;
    }

    .result-votes {
      font-size: 20px;

      font-weight: 800;

      white-space: nowrap;
    }

    .result-percentage {
      margin-top: 3px;

      color: #9fc7ff;

      font-size: 13px;

      text-align: right;
    }

    .progress {
      margin-top: 14px;

      height: 8px;

      border-radius: 999px;

      overflow: hidden;

      background: rgba(255,255,255,0.07);
    }

    .progress-bar {
      height: 100%;

      background: #4b9bea;

      border-radius: 999px;

      width: 0;
    }

    .winner {
      margin-top: 10px;

      display: inline-block;

      padding: 4px 8px;

      border-radius: 6px;

      background: rgba(34,197,94,0.14);

      color: #86efac;

      font-size: 12px;

      font-weight: 700;
    }

    .total-votes {
      margin-top: 20px;

      padding-top: 18px;

      border-top: 1px solid rgba(255,255,255,0.08);

      color: #b3c4d7;

      font-size: 14px;

      text-align: right;
    }

    /* =========================
       Error
    ========================= */

    .error {
      padding: 30px;

      border-radius: 16px;

      background: rgba(220,38,38,0.08);

      border: 1px solid rgba(248,113,113,0.18);

      color: #fecaca;

      text-align: center;
    }

    .error-title {
      font-size: 21px;

      font-weight: 700;

      margin-bottom: 8px;
    }

    .error-text {
      color: #fca5a5;

      font-size: 14px;

      line-height: 1.7;
    }

    /* =========================
       Footer
    ========================= */

    footer {
      max-width: 1000px;

      margin: 0 auto;

      padding: 0 24px 35px;

      color: #6f849a;

      font-size: 12px;

      text-align: center;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 700px) {

      main {
        padding:
          25px 15px 55px;
      }

      .header-inner {
        padding:
          15px;
      }

      .hero {
        padding: 23px;
      }

      .hero h1 {
        font-size: 26px;
      }

      .section {
        padding: 20px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .candidate-card {
        align-items: flex-start;
      }

      .candidate-photo {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
      }

      .result-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .result-percentage {
        text-align: left;
      }

      .result-votes {
        font-size: 18px;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <img
      src="/ROA_flag.png"
      alt="Republic of Axie"
      class="flag"
    >

    <div>

      <div class="brand">
        Republic of Axie
      </div>

      <div class="brand-subtitle">
        阿谢国选举结果
      </div>

    </div>

  </div>

</header>


<main>

  <a
    href="election-history.html"
    class="back"
  >
    ← 返回选举历史
  </a>


  <div id="app">

    正在加载……

  </div>

</main>


<footer>

  Republic of Axie · 阿谢国

</footer>


<script>

  /* ============================================================
     基础设置
  ============================================================ */

  const AXIE_ERA_START_YEAR = 2024;


  /* ============================================================
     URL 参数
  ============================================================ */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const electionId =
    params.get("id");


  /* ============================================================
     DOM
  ============================================================ */

  const app =
    document.getElementById("app");


  /* ============================================================
     日期格式化
  ============================================================ */

  function formatAxieDate(dateString) {

    if (!dateString) {
      return "—";
    }

    const date =
      new Date(dateString);

    if (Number.isNaN(date.getTime())) {
      return "—";
    }

    const year =
      date.getFullYear();

    const month =
      date.getMonth() + 1;

    const day =
      date.getDate();

    const axieYear =
      year - AXIE_ERA_START_YEAR + 1;

    const yearText =
      axieYear === 1
        ? "阿谢元年"
        : `阿谢${axieYear}年`;

    return `${yearText}${month}月${day}日`;
  }


  /* ============================================================
     日期状态
  ============================================================ */

  function getElectionStatus(election) {

    const now =
      new Date();

    const start =
      new Date(election.start);

    const end =
      new Date(election.end);

    if (now < start) {
      return "before";
    }

    if (now <= end) {
      return "active";
    }

    return "ended";
  }


  /* ============================================================
     选举状态文字
  ============================================================ */

  function getElectionStatusText(status) {

    switch (status) {

      case "before":
        return "尚未开始";

      case "active":
        return "进行中";

      case "ended":
        return "已结束";

      default:
        return "未知";

    }

  }


  /* ============================================================
     选举状态样式
  ============================================================ */

  function getElectionStatusClass(status) {

    switch (status) {

      case "before":
        return "status-before";

      case "active":
        return "status-active";

      case "ended":
        return "status-ended";

      default:
        return "status-before";

    }

  }


  /* ============================================================
     结果状态文字
  ============================================================ */

  function getResultStatusText(status) {

    switch (status) {

      case "pending":
        return "尚未公布";

      case "counting":
        return "正在计票";

      case "published":
        return "已公布";

      default:
        return "暂无结果记录";

    }

  }


  /* ============================================================
     结果状态样式
  ============================================================ */

  function getResultStatusClass(status) {

    switch (status) {

      case "pending":
        return "status-pending";

      case "counting":
        return "status-counting";

      case "published":
        return "status-published";

      default:
        return "status-pending";

    }

  }


  /* ============================================================
     HTML 转义
  ============================================================ */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ============================================================
     加载 JSON
  ============================================================ */

  async function loadJSON(url) {

    const response =
      await fetch(url, {
        cache: "no-store"
      });

    if (!response.ok) {

      throw new Error(
        `无法加载 ${url}`
      );

    }

    return await response.json();

  }


  /* ============================================================
     找到选举
  ============================================================ */

  function findElection(electionsData) {

    const groups = [

      electionsData.president?.elections || [],

      electionsData.vicePresident?.elections || []

    ];

    const allElections =
      groups.flat();

    return allElections.find(
      election =>
        election.electionId === electionId
    );

  }


  /* ============================================================
     获取选举类型
  ============================================================ */

  function getElectionType(
    electionsData,
    election
  ) {

    if (
      electionsData.president?.elections
        ?.some(
          item =>
            item.electionId ===
            election.electionId
        )
    ) {

      return electionsData.president;

    }

    if (
      electionsData.vicePresident?.elections
        ?.some(
          item =>
            item.electionId ===
            election.electionId
        )
    ) {

      return electionsData.vicePresident;

    }

    return null;

  }


  /* ============================================================
     查找候选人
  ============================================================ */

  function findCandidates(
    candidatesData,
    election
  ) {

    return (
      candidatesData.candidates || []
    ).filter(
      candidate =>
        candidate.electionId ===
        election.electionId
    );

  }


  /* ============================================================
     查找政党
  ============================================================ */

  function findParty(
    partiesData,
    partyId
  ) {

    return (
      partiesData.parties || []
    ).find(
      party =>
        party.partyId === partyId
    );

  }


  /* ============================================================
     结果记录
  ============================================================ */

  function findResult(
    resultsData,
    election
  ) {

    return (
      resultsData.results || []
    ).find(
      result =>
        result.electionId ===
        election.electionId
    );

  }


  /* ============================================================
     候选人卡片
  ============================================================ */

  function renderCandidate(
    candidate,
    partiesData
  ) {

    const party =
      findParty(
        partiesData,
        candidate.partyId
      );

    const partyName =
      party?.partyName ||
      candidate.partyName ||
      "独立候选人";

    const names =
      candidate.names || {};

    const zhName =
      names.zh ||
      "未公布";

    const enName =
      names.en ||
      "";

    const jaName =
      names.ja ||
      "";

    const photo =
      candidate.photo ||
      "";

    return `

      <div class="candidate-card">

        <div class="candidate-number">

          ${escapeHtml(
            candidate.candidateNo || "—"
          )}

        </div>


        ${
          photo
            ? `
              <img
                src="${escapeHtml(photo)}"
                alt="${escapeHtml(zhName)}"
                class="candidate-photo"
                onerror="this.style.display='none';"
              >
            `
            : ""
        }


        <div class="candidate-info">

          <div class="candidate-name">

            ${escapeHtml(zhName)}

          </div>


          ${
            enName
              ? `
                <div class="candidate-en">
                  ${escapeHtml(enName)}
                  ${
                    jaName
                      ? ` / ${escapeHtml(jaName)}`
                      : ""
                  }
                </div>
              `
              : ""
          }


          <div class="candidate-party">

            ${escapeHtml(partyName)}

          </div>


          <div class="candidate-links">

            <a
              href="candidate.html?id=${encodeURIComponent(
                candidate.candidateId
              )}"
              class="candidate-link"
            >
              查看候选人资料 →
            </a>


            ${
              candidate.partyId
                ? `
                  <a
                    href="party.html?id=${encodeURIComponent(
                      candidate.partyId
                    )}"
                    class="candidate-link"
                  >
                    查看政党资料 →
                  </a>
                `
                : ""
            }

          </div>

        </div>

      </div>

    `;

  }


  /* ============================================================
     结果卡片
  ============================================================ */

  function renderResultCard(
    item,
    candidates,
    partiesData,
    winnerCandidateId
  ) {

    const candidate =
      candidates.find(
        c =>
          c.candidateId ===
          item.candidateId
      );

    if (!candidate) {
      return "";
    }

    const party =
      findParty(
        partiesData,
        candidate.partyId
      );

    const partyName =
      party?.partyName ||
      candidate.partyName ||
      "独立候选人";

    const votes =
      Number(item.votes) || 0;

    const total =
      currentTotalVotes;

    const percentage =
      total > 0
        ? (votes / total) * 100
        : 0;

    const isWinner =
      winnerCandidateId ===
      candidate.candidateId;

    return `

      <div class="result-card">

        <div class="result-top">

          <div>

            <div class="result-name">

              ${escapeHtml(
                candidate.candidateNo
                  ? `第${candidate.candidateNo}号　${candidate.names?.zh || "未公布"}`
                  : candidate.names?.zh || "未公布"
              )}

            </div>

            <div class="result-party">

              ${escapeHtml(partyName)}

            </div>

          </div>


          <div>

            <div class="result-votes">

              ${votes.toLocaleString("zh-CN")} 票

            </div>

            <div class="result-percentage">

              ${percentage.toFixed(2)}%

            </div>

          </div>

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="width:${Math.min(
              percentage,
              100
            )}%"
          ></div>

        </div>


        ${
          isWinner
            ? `
              <div class="winner">
                选举结果
              </div>
            `
            : ""
        }

      </div>

    `;

  }


  /* ============================================================
     全局总票数
  ============================================================ */

  let currentTotalVotes = 0;


  /* ============================================================
     渲染页面
  ============================================================ */

  function renderPage(
    electionsData,
    candidatesData,
    partiesData,
    resultsData
  ) {

    if (!electionId) {

      app.innerHTML = `

        <div class="error">

          <div class="error-title">
            无法打开选举结果
          </div>

          <div class="error-text">

            没有指定 electionId。<br>
            请从选举历史页面进入具体的选举结果。

          </div>

        </div>

      `;

      return;

    }


    const election =
      findElection(
        electionsData
      );


    if (!election) {

      app.innerHTML = `

        <div class="error">

          <div class="error-title">
            选举不存在
          </div>

          <div class="error-text">

            找不到 Election ID：
            <br><br>

            <strong>
              ${escapeHtml(electionId)}
            </strong>

          </div>

        </div>

      `;

      return;

    }


    const typeData =
      getElectionType(
        electionsData,
        election
      );


    const candidates =
      findCandidates(
        candidatesData,
        election
      );


    const result =
      findResult(
        resultsData,
        election
      );


    const electionStatus =
      getElectionStatus(
        election
      );


    const resultStatus =
      result?.status ||
      "none";


    const electionStatusText =
      getElectionStatusText(
        electionStatus
      );


    const resultStatusText =
      getResultStatusText(
        resultStatus
      );


    const electionStatusClass =
      getElectionStatusClass(
        electionStatus
      );


    const resultStatusClass =
      getResultStatusClass(
        resultStatus
      );


    app.innerHTML = `

      <section class="hero">

        <h1>

          ${escapeHtml(
            election.name
          )}

        </h1>


        <div class="hero-en">

          ${escapeHtml(
            election.nameEn || ""
          )}

        </div>


        <div class="election-id">

          Election ID:
          ${escapeHtml(
            election.electionId
          )}

        </div>

      </section>


      <section class="section">

        <h2 class="section-title">
          选举基本资料
        </h2>


        <div class="info-grid">


          <div class="info-item">

            <div class="info-label">
              选举类型
            </div>

            <div class="info-value">

              ${escapeHtml(
                typeData?.name ||
                "选举"
              )}

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              选举状态
            </div>

            <div class="info-value">

              <span
                class="status
                ${electionStatusClass}"
              >

                ${electionStatusText}

              </span>

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              结果状态
            </div>

            <div class="info-value">

              <span
                class="status
                ${resultStatusClass}"
              >

                ${resultStatusText}

              </span>

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              候选人数
            </div>

            <div class="info-value">

              ${candidates.length} 人

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              选举开始
            </div>

            <div class="info-value">

              ${formatAxieDate(
                election.start
              )}

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              选举结束
            </div>

            <div class="info-value">

              ${formatAxieDate(
                election.end
              )}

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              就职日期
            </div>

            <div class="info-value">

              ${formatAxieDate(
                election.inauguration
              )}

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              任期
            </div>

            <div class="info-value">

              ${escapeHtml(
                election.termYears
                  ? `${election.termYears} 年`
                  : typeData?.termYears
                    ? `${typeData.termYears} 年`
                    : "—"
              )}

            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              Election ID
            </div>

            <div class="info-value">

              ${escapeHtml(
                election.electionId
              )}

            </div>

          </div>


        </div>


        <div class="vote-area">

          ${
            electionStatus === "active"
              ? `
                <a
                  href="vote.html?id=${encodeURIComponent(
                    election.electionId
                  )}"
                  class="vote-button"
                >
                  进入投票系统 →
                </a>
              `
              : electionStatus === "before"
                ? `
                  <a
                    href="vote.html?id=${encodeURIComponent(
                      election.electionId
                    )}"
                    class="vote-button"
                  >
                    查看投票系统 →
                  </a>
                `
                : `
                  <a
                    href="vote.html?id=${encodeURIComponent(
                      election.electionId
                    )}"
                    class="vote-button disabled"
                  >
                    投票已结束
                  </a>
                `
          }

        </div>

      </section>


      <section class="section">

        <h2 class="section-title">
          选举结果
        </h2>


        <div id="result-content">

        </div>

      </section>


      <section class="section">

        <h2 class="section-title">

          候选人

        </h2>


        <div class="candidate-list">

          ${
            candidates.length
              ? candidates
                  .map(
                    candidate =>
                      renderCandidate(
                        candidate,
                        partiesData
                      )
                  )
                  .join("")
              : `
                <div class="result-notice">

                  <div class="result-notice-icon">
                    📋
                  </div>

                  <div class="result-notice-title">
                    暂无候选人资料
                  </div>

                  <div class="result-notice-text">
                    当前选举尚未登记候选人资料。
                  </div>

                </div>
              `
          }

        </div>

      </section>

    `;


    renderResultContent(
      result,
      candidates,
      partiesData,
      electionStatus
    );

  }


  /* ============================================================
     渲染结果内容
  ============================================================ */

  function renderResultContent(
    result,
    candidates,
    partiesData,
    electionStatus
  ) {

    const container =
      document.getElementById(
        "result-content"
      );


    if (!container) {
      return;
    }


    /* =========================
       没有结果记录
    ========================= */

    if (!result) {

      container.innerHTML = `

        <div class="result-notice">

          <div class="result-notice-icon">
            📋
          </div>

          <div class="result-notice-title">
            暂无结果记录
          </div>

          <div class="result-notice-text">

            当前选举尚未建立正式结果记录。

          </div>

        </div>

      `;

      return;

    }


    /* =========================
       尚未公布
    ========================= */

    if (result.status === "pending") {

      container.innerHTML = `

        <div class="result-notice">

          <div class="result-notice-icon">
            🕐
          </div>

          <div class="result-notice-title">
            尚未公布
          </div>

          <div class="result-notice-text">

            本次选举结果尚未公布。<br>
            正式结果将在选举结束并完成计票后发布。

          </div>

        </div>

      `;

      return;

    }


    /* =========================
       正在计票
    ========================= */

    if (result.status === "counting") {

      container.innerHTML = `

        <div class="result-notice">

          <div class="result-notice-icon">
            🧮
          </div>

          <div class="result-notice-title">
            正在计票
          </div>

          <div class="result-notice-text">

            本次选举已经结束，当前正在进行计票。<br>
            正式结果将在计票完成后公布。

          </div>

        </div>

      `;

      return;

    }


    /* =========================
       已公布
    ========================= */

    if (result.status === "published") {

      const resultItems =
        Array.isArray(
          result.candidateResults
        )
          ? result.candidateResults
          : [];


      currentTotalVotes =
        Number(result.totalVotes);


      if (
        !Number.isFinite(
          currentTotalVotes
        )
      ) {

        currentTotalVotes =
          resultItems.reduce(
            (
              total,
              item
            ) =>
              total +
              (
                Number(item.votes) || 0
              ),
            0
          );

      }


      if (!resultItems.length) {

        container.innerHTML = `

          <div class="result-notice">

            <div class="result-notice-icon">
              📊
            </div>

            <div class="result-notice-title">
              结果已公布
            </div>

            <div class="result-notice-text">

              结果状态已标记为“已公布”，
              但目前没有候选人票数资料。

            </div>

          </div>

        `;

        return;

      }


      container.innerHTML = `

        <div class="results-list">

          ${resultItems
            .map(
              item =>
                renderResultCard(
                  item,
                  candidates,
                  partiesData,
                  result.winnerCandidateId
                )
            )
            .join("")}

        </div>


        <div class="total-votes">

          总票数：
          <strong>
            ${currentTotalVotes.toLocaleString(
              "zh-CN"
            )}
          </strong>
          票

          ${
            result.publishedAt
              ? `
                <br>
                <span
                  style="
                    display:inline-block;
                    margin-top:6px;
                    color:#71869b;
                    font-size:12px;
                  "
                >
                  结果公布：
                  ${formatAxieDate(
                    result.publishedAt
                  )}
                </span>
              `
              : ""
          }

        </div>

      `;

      return;

    }


    /* =========================
       未知状态
    ========================= */

    container.innerHTML = `

      <div class="result-notice">

        <div class="result-notice-icon">
          ❓
        </div>

        <div class="result-notice-title">
          暂无结果
        </div>

        <div class="result-notice-text">

          当前结果记录的状态无法识别。

        </div>

      </div>

    `;

  }


  /* ============================================================
     初始化
  ============================================================ */

  async function init() {

    try {

      const [
        electionsData,
        candidatesData,
        partiesData,
        resultsData
      ] = await Promise.all([

        loadJSON(
          "./data/elections.json"
        ),

        loadJSON(
          "./data/candidates.json"
        ),

        loadJSON(
          "./data/parties.json"
        ),

        loadJSON(
          "./data/election-results.json"
        )

      ]);


      renderPage(
        electionsData,
        candidatesData,
        partiesData,
        resultsData
      );


    } catch (error) {

      console.error(
        error
      );


      app.innerHTML = `

        <div class="error">

          <div class="error-title">
            页面加载失败
          </div>

          <div class="error-text">

            无法读取阿谢国选举资料。<br><br>

            请检查以下文件是否存在并且 JSON 格式正确：

            <br><br>

            <code>
              data/elections.json
            </code>

            <br>

            <code>
              data/candidates.json
            </code>

            <br>

            <code>
              data/parties.json
            </code>

            <br>

            <code>
              data/election-results.json
            </code>

          </div>

        </div>

      `;

    }

  }


  /* ============================================================
     Start
  ============================================================ */

  init();

</script>

</body>
</html>
